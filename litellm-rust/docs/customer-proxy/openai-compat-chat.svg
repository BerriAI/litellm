<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="820" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111">POST /v1/chat/completions to an OpenAI-compatible deployment</text>

  <!-- client -->
  <rect x="20" y="60" width="150" height="56" rx="6" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="95" y="84" text-anchor="middle" fill="#111" font-weight="bold">Client</text>
  <text x="95" y="102" text-anchor="middle" fill="#333">OpenAI SDK body</text>

  <!-- gateway handle -->
  <rect x="220" y="50" width="330" height="94" rx="6" fill="#f5f5f5" stroke="#666"/>
  <text x="385" y="72" text-anchor="middle" fill="#111" font-weight="bold">gateway-inference chat_completions</text>
  <text x="385" y="92" text-anchor="middle" fill="#333">auth, hooks admit, route deployment</text>
  <text x="385" y="110" text-anchor="middle" fill="#333">serves_openai: OpenAI passthrough machine,</text>
  <text x="385" y="128" text-anchor="middle" fill="#333">a ReportedUsage rides on the response</text>
  <line x1="170" y1="88" x2="218" y2="88" stroke="#333" marker-end="url(#a)"/>

  <rect x="590" y="50" width="370" height="94" rx="6" fill="#fff8e6" stroke="#b8860b"/>
  <text x="775" y="72" text-anchor="middle" fill="#111" font-weight="bold">inference-chat compatible_chat_config</text>
  <text x="775" y="92" text-anchor="middle" fill="#333">hosted_vllm, nvidia_nim, groq, together_ai,</text>
  <text x="775" y="110" text-anchor="middle" fill="#333">fireworks_ai, xai, mistral, deepseek,</text>
  <text x="775" y="128" text-anchor="middle" fill="#333">openrouter, cerebras, perplexity</text>
  <line x1="550" y1="97" x2="588" y2="97" stroke="#333" marker-end="url(#a)"/>

  <!-- shared request build -->
  <rect x="20" y="176" width="560" height="256" rx="6" fill="#eef7ee" stroke="#3c8d3c"/>
  <text x="300" y="198" text-anchor="middle" fill="#111" font-weight="bold">llms openai/chat/compatible transform_request</text>
  <text x="36" y="222" fill="#333">1. sort_params: the provider's supported params for the model,</text>
  <text x="54" y="240" fill="#333">unsupported refused (400) or dropped with drop_params</text>
  <text x="36" y="260" fill="#333">2. a stream asks for stream_options.include_usage when the</text>
  <text x="54" y="278" fill="#333">provider takes it and the client did not</text>
  <text x="36" y="298" fill="#333">3. map_params: max_tokens names, tool_choice, reasoning,</text>
  <text x="54" y="316" fill="#333">json_tool_call workaround, web search tools</text>
  <text x="36" y="336" fill="#333">4. extra_body keys merged, the provider's own rewritten</text>
  <text x="36" y="356" fill="#333">5. messages: response-only fields, content lists, names,</text>
  <text x="54" y="374" fill="#333">cache_control kept only where the provider caches</text>
  <text x="36" y="398" fill="#555">refused (501): groq streamed response_format, images in</text>
  <text x="36" y="416" fill="#555">tool messages, file_id URLs Python downloads</text>
  <line x1="300" y1="144" x2="300" y2="174" stroke="#333" marker-end="url(#a)"/>

  <!-- urls and auth -->
  <rect x="610" y="176" width="350" height="256" rx="6" fill="#ffffff" stroke="#4a6fa5"/>
  <text x="785" y="198" text-anchor="middle" fill="#111" font-weight="bold">URL and credential</text>
  <text x="626" y="222" fill="#333">api_base: deployment, then the provider's</text>
  <text x="644" y="240" fill="#333">env var, then its default host</text>
  <text x="644" y="258" fill="#333">(hosted_vllm has no default host)</text>
  <text x="626" y="278" fill="#333">{api_base}/chat/completions, once</text>
  <text x="644" y="296" fill="#333">mistral adds /v1 to the base first</text>
  <text x="626" y="316" fill="#333">Bearer: deployment key, then env vars</text>
  <text x="644" y="334" fill="#333">hosted_vllm falls back to fake-api-key</text>
  <text x="626" y="354" fill="#333">headers: openrouter HTTP-Referer, X-Title,</text>
  <text x="644" y="372" fill="#333">perplexity X-Pplx-Integration,</text>
  <text x="644" y="390" fill="#333">fireworks x-session-affinity</text>
  <text x="626" y="414" fill="#555">os.environ/ refs resolved via the secret source</text>
  <line x1="580" y1="304" x2="608" y2="304" stroke="#333" marker-end="url(#a)"/>

  <!-- upstream -->
  <rect x="610" y="464" width="350" height="96" rx="6" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="785" y="488" text-anchor="middle" fill="#111" font-weight="bold">Provider</text>
  <text x="785" y="508" text-anchor="middle" fill="#333">OpenAI chat.completion JSON</text>
  <text x="785" y="526" text-anchor="middle" fill="#333">stream: chat.completion.chunk SSE</text>
  <text x="785" y="544" text-anchor="middle" fill="#555">data: frames closed by [DONE]</text>
  <line x1="785" y1="432" x2="785" y2="462" stroke="#333" marker-end="url(#a)"/>

  <!-- response -->
  <rect x="20" y="464" width="560" height="160" rx="6" fill="#eef7ee" stroke="#3c8d3c"/>
  <text x="300" y="486" text-anchor="middle" fill="#111" font-weight="bold">response and stream (ResponseAdapter)</text>
  <text x="36" y="510" fill="#333">bytes pass through, re-encoded only when a fixup changes them</text>
  <text x="36" y="530" fill="#333">reasoning to reasoning_content, json_tool_call to content</text>
  <text x="36" y="550" fill="#333">groq service_tier, xai reasoning in completion_tokens,</text>
  <text x="54" y="568" fill="#333">perplexity citations, mistral content blocks, fireworks</text>
  <text x="54" y="586" fill="#333">tool calls in content</text>
  <text x="36" y="606" fill="#333">stream: usage recorded, hidden unless the client asked</text>
  <line x1="608" y1="512" x2="580" y2="512" stroke="#333" marker-end="url(#a)"/>

  <!-- bottom boxes -->
  <rect x="20" y="656" width="440" height="144" rx="6" fill="#ffffff" stroke="#b8860b"/>
  <text x="240" y="678" text-anchor="middle" fill="#111" font-weight="bold">usage and cost (gateway-inference Finish)</text>
  <text x="36" y="702" fill="#333">complete: the usage object of the body</text>
  <text x="36" y="722" fill="#333">stream: the ReportedUsage the relay recorded,</text>
  <text x="54" y="740" fill="#333">even from a chunk the client never saw</text>
  <text x="36" y="760" fill="#333">cached_tokens, reasoning, server_tool_use kept</text>
  <text x="36" y="780" fill="#555">config prices win, then the cost map entry</text>

  <rect x="500" y="656" width="460" height="144" rx="6" fill="#ffffff" stroke="#3c8d3c"/>
  <text x="730" y="678" text-anchor="middle" fill="#111" font-weight="bold">gateway startup (hooks::install)</text>
  <text x="516" y="702" fill="#333">an OpenAI-compatible deployment loads the cost map</text>
  <text x="516" y="722" fill="#333">and installs it as ModelInfo, which answers</text>
  <text x="516" y="742" fill="#333">supports_reasoning, supports_web_search, vision,</text>
  <text x="516" y="762" fill="#333">function calling, reasoning_effort_levels</text>
  <text x="516" y="782" fill="#555">for {provider}/{m} or {m}</text>
  <line x1="240" y1="624" x2="240" y2="654" stroke="#333" marker-end="url(#a)"/>
</svg>
