<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0f172a">Model capacity hook (dynamic_rate_limiter_v3): fleet-wide group capacity and priority shares</text>

  <rect x="24" y="60" width="300" height="160" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="38" y="84" font-weight="600" fill="#1e3a8a">At startup</text>
  <text x="38" y="106" fill="#1e293b" font-size="13">group capacity = sum of deployments'</text>
  <text x="38" y="124" fill="#1e293b" font-size="13">   rpm / tpm (deployment, litellm_params,</text>
  <text x="38" y="142" fill="#1e293b" font-size="13">   model_info)</text>
  <text x="38" y="164" fill="#1e293b" font-size="13">priority_reservation shares: percent,</text>
  <text x="38" y="182" fill="#1e293b" font-size="13">   rpm or tpm; normalized when over 1</text>
  <text x="38" y="204" fill="#64748b" font-size="13">on when callbacks list the hook</text>

  <rect x="360" y="60" width="616" height="160" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="374" y="84" font-weight="600" fill="#92400e">Per request (one Redis script, all or nothing)</text>
  <text x="374" y="106" fill="#1e293b" font-size="13">priority: team metadata, else key metadata; pool &lt;group&gt;:&lt;priority&gt; or &lt;group&gt;:default_pool</text>
  <text x="374" y="128" fill="#1e293b" font-size="13">saturation = max(requests / rpm, tokens / tpm), read and reused for saturation_check_cache_ttl</text>
  <text x="374" y="150" fill="#1e293b" font-size="13">{model_saturation_check:&lt;group&gt;}: +1 request, tokens checked; always enforced</text>
  <text x="374" y="172" fill="#1e293b" font-size="13">{priority_model:&lt;pool&gt;}: share x capacity, enforced at saturation &gt;= threshold,</text>
  <text x="374" y="190" fill="#1e293b" font-size="13">   only counted below it</text>
  <line x1="324" y1="140" x2="356" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="24" y="256" width="460" height="130" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="38" y="280" font-weight="600" fill="#991b1b">Refusal: 429, the proxy's messages</text>
  <text x="38" y="302" fill="#1e293b" font-size="13">"Model capacity reached for &lt;group&gt;. Priority: ..., Rate limit</text>
  <text x="38" y="320" fill="#1e293b" font-size="13">  type: ..., Model TPM: ..., Model RPM: ..., Remaining: ..."</text>
  <text x="38" y="340" fill="#1e293b" font-size="13">"Priority-based rate limit exceeded. ... Model saturation: 62.5%"</text>
  <text x="38" y="362" fill="#1e293b" font-size="13">chat: retry-after, rate_limit_type, x-litellm-priority,</text>
  <text x="38" y="378" fill="#1e293b" font-size="13">   x-litellm-saturation; messages: Anthropic envelope only</text>
  <path d="M500 220 L500 240 L254 240 L254 252" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#r)"/>

  <rect x="516" y="256" width="460" height="130" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="530" y="280" font-weight="600" fill="#0f172a">Admitted: request runs</text>
  <text x="530" y="302" fill="#334155" font-size="13">complete responses carry x-litellm-priority,</text>
  <text x="530" y="320" fill="#334155" font-size="13">x-litellm-rate-limiter-version: v3 and</text>
  <text x="530" y="338" fill="#334155" font-size="13">x-ratelimit-model_saturation_check-* /</text>
  <text x="530" y="356" fill="#334155" font-size="13">x-ratelimit-priority_model-*</text>
  <path d="M760 220 L760 252" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="24" y="420" width="952" height="56" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="38" y="444" font-weight="600" fill="#5b21b6">Settle: a successful response's tokens (token_rate_limit_type: total, input or output)</text>
  <text x="38" y="464" fill="#1e293b" font-size="13">added to the group's and the admitted pool's :tokens, with the window TTL</text>
  <line x1="746" y1="386" x2="746" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="24" y="496" width="952" height="52" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="38" y="518" font-weight="600" fill="#065f46">Same keys and scripts as the Python proxy, under its namespace: Rust and Python replicas share one count</text>
  <text x="38" y="538" fill="#64748b" font-size="13">No Redis, or Redis unreachable: this replica's counters (fail_closed_rate_limit_enforcement: 503 instead)</text>
</svg>
