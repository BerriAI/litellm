[package]
name = "litellm-ai-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "litellm_ai_gateway"

[[bin]]
name = "litellm-ai-gateway"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
litellm-core = { workspace = true, features = ["bedrock-auth"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
base64.workspace = true
axum = { workspace = true, features = ["ws", "macros"], optional = true }
serde.workspace = true
subtle = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
rand = "0.8"
prometheus = "0.13"
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
notify = "7"

[features]
default = []
server = ["dep:axum", "dep:subtle", "dep:sha2", "dep:sqlx"]

[dev-dependencies]
futures-channel = "0.3"
tower = { version = "0.5.3", features = ["util"] }
