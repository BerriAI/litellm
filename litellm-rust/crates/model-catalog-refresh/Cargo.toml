[package]
name = "litellm-model-catalog-refresh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aws-config = { version = "1.9.0", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-runtime-api = { version = "1.16.2", features = ["client", "http-1x"] }
litellm-model-catalog.workspace = true
litellm-s3.workspace = true
rand.workspace = true
litellm-http.workspace = true
reqwest.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "time"] }
url.workspace = true

[dev-dependencies]
litellm-http = { workspace = true, features = ["test-support"] }
aws-credential-types = "1.3.0"
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true
