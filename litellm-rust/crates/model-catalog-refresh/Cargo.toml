[package]
name = "litellm-model-catalog-refresh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
aws-config = { version = "1.9.0", default-features = false, features = ["rt-tokio", "sso", "credentials-process"] }
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["rustls", "rt-tokio"] }
litellm-http.workspace = true
litellm-model-catalog.workspace = true
litellm-s3.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
rcgen = "0.14.10"
rstest.workspace = true
rustls.workspace = true
tempfile.workspace = true
wiremock.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["process", "signal"] }
