[package]
name = "litellm-model-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
schema = ["dep:schemars", "litellm-cost/schema"]

[dependencies]
litellm-cost = { workspace = true, features = ["serde"] }
litellm-error.workspace = true

indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
macro_rules_attribute.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_with.workspace = true
strum.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
jsonschema = { version = "0.55.1", default-features = false }
rstest.workspace = true
