[dependencies]
axum.workspace = true
http-body-util = "0.1"
litellm-core.workspace = true
litellm-cost.workspace = true
litellm-gateway-inference.workspace = true
litellm-gateway-auth.workspace = true
litellm-config.workspace = true
litellm-http.workspace = true
litellm-jobs.workspace = true
litellm-llms.workspace = true
litellm-secrets.workspace = true
litellm-spend.workspace = true
litellm-spend-redis.workspace = true
litellm-tracing.workspace = true
percent-encoding.workspace = true
redis = { version = "1.7.0", features = ["aio", "tokio-comp"] }
