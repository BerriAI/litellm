[package]
name = "litellm-traces"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
schema = ["dep:schemars"]

[dependencies]
litellm-cost.workspace = true
litellm-model-catalog.workspace = true
askama.workspace = true
macro_rules_attribute.workspace = true
schemars = { workspace = true, optional = true }
indexmap = { version = "2", features = ["serde"] }
litellm-llms-types.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace", "logs", "with-serde"] }
prost.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_with.workspace = true
sha2.workspace = true
strum.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
base64.workspace = true
criterion.workspace = true
rstest.workspace = true

[[bench]]
name = "resource-fanout"
harness = false

[[bin]]
name = "export-traces-schema"
path = "src/bin/export_schema.rs"
required-features = ["schema"]
