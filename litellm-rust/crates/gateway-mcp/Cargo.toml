[package]
name = "litellm-gateway-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true, features = ["json", "query"] }
futures-util.workspace = true
http.workspace = true
uuid.workspace = true
url.workspace = true
moka.workspace = true
sha2.workspace = true
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "client", "elicitation", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"

[dev-dependencies]
rstest.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
rmcp = { version = "=3.4.1", default-features = false, features = ["transport-child-process"] }
sse-stream = "0.2.6"
