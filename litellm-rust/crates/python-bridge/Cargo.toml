[package]
name = "litellm-python-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py310"]
extension-module = ["pyo3/extension-module"]
panic-test = []
trace-parity = [
    "dep:tracing",
    "dep:litellm-ai-gateway",
    "dep:tracing-subscriber",
    "dep:axum",
    "dep:tower",
    "litellm-ai-gateway/server",
]

[dependencies]
futures-util.workspace = true
tokio.workspace = true
tracing-subscriber = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tracing = { workspace = true, optional = true }
litellm-core = { workspace = true, features = ["bedrock-auth"] }
litellm-ai-gateway = { workspace = true, default-features = false, optional = true }
litellm-python-interop.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = "0.8.2"
tokio.workspace = true
tracing.workspace = true

[[bench]]
name = "serialization"
harness = false
