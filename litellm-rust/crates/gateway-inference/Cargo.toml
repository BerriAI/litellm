[package]
name = "litellm-gateway-inference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
switchyard = [
    "dep:async-trait",
    "dep:litellm-config",
    "dep:switchyard-libsy",
    "dep:switchyard-llm-client",
    "dep:switchyard-protocol",
    "dep:switchyard-runner",
    "dep:switchyard-translation",
]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
litellm-cache-response.workspace = true
axum = { workspace = true, features = ["json", "multipart", "original-uri"] }
base64.workspace = true
bytes.workspace = true
litellm-auth.workspace = true
litellm-gateway-auth.workspace = true
litellm-inference.workspace = true
litellm-inference-transcription.workspace = true
litellm-inference-responses.workspace = true
litellm-inference-messages.workspace = true
litellm-inference-chat.workspace = true
litellm-inference-ocr.workspace = true
litellm-config = { workspace = true, optional = true }
litellm-host-http.workspace = true
litellm-host.workspace = true
litellm-http.workspace = true
litellm-llms.workspace = true
litellm-router.workspace = true
litellm-secrets.workspace = true
litellm-llms-types.workspace = true
serde.workspace = true
serde_json.workspace = true
switchyard-libsy = { version = "0.3.0", optional = true }
switchyard-llm-client = { version = "0.3.0", optional = true }
switchyard-protocol = { version = "0.3.0", optional = true }
switchyard-runner = { version = "0.3.0", optional = true }
switchyard-translation = { version = "0.3.0", optional = true }
thiserror.workspace = true

[dev-dependencies]
litellm-cache-memory.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util"] }
rstest.workspace = true
tower = { version = "0.5.3", features = ["util"] }
wiremock.workspace = true
