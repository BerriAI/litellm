[package]
name = "litellm-lens"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true, features = ["json"] }
bytes.workspace = true
chrono = { version = "0.4", features = ["serde"] }
flate2.workspace = true
futures-util.workspace = true
http.workspace = true
jsonschema = { version = "0.55.1", default-features = false }
libc = "0.2"
litellm-http.workspace = true
litellm-tracing.workspace = true
litellm-traces.workspace = true
litellm-traces-cache.workspace = true
litellm-traces-clickhouse.workspace = true
litellm-storage-clickhouse.workspace = true
prost.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "process", "io-util"] }
tracing.workspace = true
tower-http = { version = "0.6.11", features = ["cors"] }
url.workspace = true
unicode-casefold = "0.2"

[build-dependencies]
typify = { version = "=0.6.1", default-features = false }
serde_json.workspace = true
syn = { workspace = true, features = ["full", "parsing"] }
prettyplease = "0.2"

[dev-dependencies]
rstest.workspace = true
wiremock.workspace = true
uuid.workspace = true
