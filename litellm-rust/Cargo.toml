[workspace]
members = [
    "crates/litellm",
    "crates/core",
    "crates/auth",
    "crates/auth-python",
    "crates/config",
    "crates/ai-gateway",
    "crates/python-interop",
    "crates/python-bridge",
    "crates/auth-aws",
    "crates/gateway-auth",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/BerriAI/litellm"

[workspace.dependencies]
litellm-auth = { path = "crates/auth", version = "0.1.0" }
litellm-auth-python = { path = "crates/auth-python", version = "0.1.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
litellm-core = { path = "crates/core", version = "0.1.0" }
litellm-config = { path = "crates/config", version = "0.1.0" }
litellm-ai-gateway = { path = "crates/ai-gateway", version = "0.1.0", default-features = false }
litellm-python-interop = { path = "crates/python-interop", version = "0.1.0" }
litellm-auth-aws = { path = "crates/auth-aws", version = "0.1.0" }
litellm-gateway-auth = { path = "crates/gateway-auth", version = "0.1.0" }
axum = "0.8"
pyo3 = "0.29.2"
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pythonize = "0.29.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "http2", "stream"] }
rstest = "0.26.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serial_test = { version = "4.0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
sse-stream = "=0.2.4"
strum = { version = "0.28", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
incremental = false
strip = "symbols"
