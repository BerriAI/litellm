[project]
name = "litellm-liteadmin-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "liteagents[pydantic-ai] @ https://github.com/BerriAI/liteagents/releases/download/v0.2.0/liteagents-0.2.0-py3-none-any.whl#sha256=8cd957debaeb2c36058ef6d49b916728372fcd44e6576cfd06d032a8a8824641",
    "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "respx>=0.22,<1"]

[tool.uv]
package = false
exclude-newer = "2026-09-26T00:00:00Z"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
testpaths = ["tests"]
