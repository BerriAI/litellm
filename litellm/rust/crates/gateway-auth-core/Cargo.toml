[package]
name = "litellm-gateway-auth-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
http.workspace = true
jiff.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
litellm-config.workspace = true
litellm-fnmatch.workspace = true
litellm-python-compat.workspace = true
litellm-secret-value.workspace = true
litellm-starlette.workspace = true
fancy-regex.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
strum.workspace = true
subtle.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
rstest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
