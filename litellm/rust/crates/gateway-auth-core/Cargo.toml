[package]
name = "litellm-gateway-auth-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
fips = ["dep:openssl"]

[dependencies]
base64.workspace = true
http.workspace = true
jiff.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
litellm-config.workspace = true
litellm-error.workspace = true
litellm-fnmatch.workspace = true
litellm-python-compat.workspace = true
litellm-secret-value.workspace = true
litellm-starlette.workspace = true
openssl = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
subtle.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }
rstest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
