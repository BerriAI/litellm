[package]
name = "litellm-callbacks-spend-logger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
litellm-callbacks.workspace = true
litellm-callbacks-budgets.workspace = true
litellm-callbacks-spend-log.workspace = true
litellm-python-compat.workspace = true
litellm-redis-store.workspace = true
litellm-spend-log-writer.workspace = true
litellm-redaction.workspace = true

chrono = { workspace = true, features = ["clock"] }
futures-util.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
uuid.workspace = true
veil.workspace = true

[dev-dependencies]
litellm-coroutine.workspace = true
litellm-db.workspace = true
litellm-redis-client.workspace = true
litellm-redis-testing.workspace = true
litellm-repositories.workspace = true
litellm-secret-value.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
