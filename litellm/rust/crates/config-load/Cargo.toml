[package]
name = "litellm-config-load"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads a LiteLLM config file and the files its `include` names into one typed Config, with its `os.environ/` references resolved"

[dependencies]
futures-util.workspace = true
litellm-config.workspace = true
litellm-env.workspace = true
litellm-python-compat.workspace = true
litellm-router-types.workspace = true
litellm-secret-value.workspace = true
litellm-secrets.workspace = true
litellm-yaml.workspace = true
serde.workspace = true
serde_with.workspace = true
serde_yaml_ng = "0.10.0"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
litellm-error.workspace = true
litellm-http = { workspace = true, features = ["test-support"] }
rstest.workspace = true
tempfile.workspace = true
tokio.workspace = true
