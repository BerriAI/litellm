[package]
name = "litellm-auth-gcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
google-sdk = []
# Exposes fakes such as `google::OnGce` to other crates' tests, so they can log in without a
# network. Enable it only from `[dev-dependencies]` or another crate's own `test-support`
# feature, never for a build that ships. The workspace AGENTS.md describes the pattern.
test-support = []

[dependencies]
litellm-secret-value.workspace = true
litellm-auth-types.workspace = true
litellm-auth-aws.workspace = true
litellm-env.workspace = true
litellm-error.workspace = true
litellm-http.workspace = true
litellm-python-compat.workspace = true
litellm-redaction.workspace = true
litellm-tracing.workspace = true

base64.workspace = true
moka.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["process"] }
url.workspace = true
veil.workspace = true

gcp_auth = { version = "0.12.7", default-features = false, features = ["aws-lc-rs"] }
rsa = "0.9.10"
shlex = "2.0.1"
google-cloud-auth.workspace = true
http.workspace = true
rustls.workspace = true

[dev-dependencies]
time = { workspace = true, features = ["formatting"] }
axum = { workspace = true, features = ["json"] }
percent-encoding.workspace = true
rcgen = "0.14.10"
rsa = { version = "0.9.10", features = ["sha2"] }
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
