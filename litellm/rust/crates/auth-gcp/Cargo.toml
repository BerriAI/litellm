[package]
name = "litellm-auth-gcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
google-sdk = []
test-support = []

[dependencies]
litellm-secret-value.workspace = true
litellm-auth-types.workspace = true
litellm-auth-aws.workspace = true
litellm-error.workspace = true
litellm-http.workspace = true
litellm-python-compat.workspace = true

base64.workspace = true
moka.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex = "2.0.1"
sha2.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["process"] }
url.workspace = true
veil.workspace = true

gcp_auth = "0.12.7"
google-cloud-auth.workspace = true
http.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }

[dev-dependencies]
time = { workspace = true, features = ["formatting"] }
axum = { workspace = true, features = ["json"] }
futures-util.workspace = true
litellm-tracing.workspace = true
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
rstest.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
