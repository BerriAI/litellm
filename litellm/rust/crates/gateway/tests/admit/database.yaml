# A database the config's own environment variables name sends everything to Python, since the
# proxy writes a spend log and key spend there after every call, the master key's included.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
  environment_variables:
    DATABASE_URL: postgresql://user:pass@localhost:5432/litellm

requests:
  - name: plain
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: settings
    over: DATABASE_URL
