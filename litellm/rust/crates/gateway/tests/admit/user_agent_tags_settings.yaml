# Python tags every call with its user agent unless `disable_add_user_agent_to_request_tags` is
# on. The native app always does, so a config that sets it goes to Python.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  litellm_settings:
    disable_add_user_agent_to_request_tags: true
  general_settings:
    master_key: gateway-key

requests:
  - name: plain
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: settings
