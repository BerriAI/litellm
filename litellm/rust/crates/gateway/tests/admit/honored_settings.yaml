# Settings the native app reads as Python does, so a plain request stays native.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
        api_base: https://api.anthropic.com
        rpm: 300
        weight: 2
        timeout: 30
      model_info:
        id: claude-a
  router_settings:
    routing_strategy: simple-shuffle
    num_retries: 1
    enable_cross_model_group_collision_check: true
    fallbacks:
      - claude-down: [claude]
  litellm_settings:
    drop_params: true
  general_settings:
    master_key: gateway-key
    max_request_size_mb: 1
    enable_jwt_auth: true
    store_model_in_db: false
  environment_variables:
    SOME_KEY: value

requests:
  - name: plain
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust
