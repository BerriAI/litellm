# An api_key spelled as a secret reference is resolved by Python at call time, and the native app
# would send it as written, so its model group goes to Python. Boot has already layered the stored
# model and filled the stored credential's api_key into the model naming it.
stored: loaded
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
    - model_name: oidc-env
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: oidc/env/ANTHROPIC_WIF_TOKEN
    - model_name: oidc-file
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: oidc/file/var/run/secrets/anthropic/token
    - model_name: stored-oidc
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: oidc/env/ANTHROPIC_WIF_TOKEN
      model_info:
        id: 3c9e5b17-stored
        db_model: true
        blocked: false
    - model_name: credential-oidc
      litellm_params:
        model: anthropic/claude-haiku-5-5
        litellm_credential_name: anthropic-wif
        api_key: oidc/env/ANTHROPIC_WIF_TOKEN
  general_settings:
    master_key: gateway-key
    supported_db_objects: [models]
  environment_variables:
    STORE_MODEL_IN_DB: "True"

requests:
  - name: plain_key
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust
  - name: oidc_env_key_in_the_file
    headers: {authorization: Bearer gateway-key}
    body: {model: oidc-env, max_tokens: 16, messages: []}
    expect: python
    reason: model
    over: model_list.litellm_params.api_key secret reference
  - name: oidc_file_key_in_the_file
    headers: {authorization: Bearer gateway-key}
    body: {model: oidc-file, max_tokens: 16, messages: []}
    expect: python
    reason: model
    over: model_list.litellm_params.api_key secret reference
  - name: oidc_key_on_a_stored_model
    headers: {authorization: Bearer gateway-key}
    body: {model: stored-oidc, max_tokens: 16, messages: []}
    expect: python
    reason: model
    over: model_list.litellm_params.api_key secret reference
  - name: oidc_key_filled_from_a_credential
    headers: {authorization: Bearer gateway-key}
    body: {model: credential-oidc, max_tokens: 16, messages: []}
    expect: python
    reason: model
    over: model_list.litellm_params.litellm_credential_name
