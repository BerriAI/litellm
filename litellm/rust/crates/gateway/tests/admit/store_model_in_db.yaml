# STORE_MODEL_IN_DB makes the proxy serve models and settings from its database on top of the
# YAML, which the gateway does not read.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
  environment_variables:
    STORE_MODEL_IN_DB: "True"

requests:
  - name: plain
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: settings
    over: STORE_MODEL_IN_DB
