# Who the native app authenticates: the master key and nobody else. A change that authenticates
# another caller natively turns its case here to rust.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key

requests:
  - name: the master key as a bearer token
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: the master key as x-api-key
    headers: {x-api-key: gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a virtual key
    headers: {authorization: Bearer sk-virtual}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_token
    denied: true

  - name: a JWT
    headers: {authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1In0.c2ln}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_token
    denied: true

  - name: the master key as api-key
    headers: {api-key: gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: no credential
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_token
    denied: true

  - name: another key as x-api-key
    headers: {x-api-key: sk-virtual}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_api_key
    denied: true
