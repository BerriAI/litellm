# The native router takes router_settings.request_timeout as a timeout of its own, where the Python
# router derives that value from litellm_settings.request_timeout instead.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  router_settings:
    request_timeout: 10
  litellm_settings:
    request_timeout: 30
  general_settings:
    master_key: gateway-key

requests:
  - name: plain
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: settings
    over: litellm_settings.request_timeout
