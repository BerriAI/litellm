# A virtual key in a team has its team read natively. A team that holds only what the native app
# honors, its model list included, is found, and its key still goes to Python, since the native
# spend log charges no team yet. A team that holds a limit, a budget or the per-model limits or
# priority in its metadata goes to Python over that column. A team whose metadata holds anything
# else, or a model entry the model rule does not read, is not native, and neither is the UI team
# or a team with no row. A team's default member budget is read from the budget row its metadata
# names, and its budget reset time is read for nothing, as the proxy's checks never read it.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key

teams:
  plain: {}
  listed: {models: [claude]}
  capped: {max_budget: 10}
  limited: {rpm_limit: 10}
  tagged: {metadata: {tags: [a]}}
  guarded: {metadata: {guardrails: [pii]}}
  rpm_by_model: {metadata: {model_rpm_limit: {claude: 2}}}
  tpm_by_model: {metadata: {model_tpm_limit: {claude: 100}}}
  prioritized: {metadata: {priority: prod}}
  patterned: {models: ["anthropic/*"]}
  member_default: {metadata: {team_member_budget_id: member-default}}
  member_default_gone: {metadata: {team_member_budget_id: gone}}
  member_default_per_model: {metadata: {team_member_budget_id: member-per-model}}
  reset_scheduled: {budget_duration: 30d, budget_reset_at: "2100-01-01T00:00:00"}
  windowed: {budget_limits: [{budget_duration: 30d, max_budget: 5}]}
  per_model: {model_max_budget: {claude: 2}, model_spend: {claude: 1}}
  router_override: {router_settings: {timeout: 3}}

rows:
  - LiteLLM_BudgetTable: {budget_id: member-default, max_budget: 5, created_by: test, updated_by: test}
  - LiteLLM_BudgetTable: {budget_id: member-per-model, max_budget: 5, model_max_budget: {claude: 1}, created_by: test, updated_by: test}
  - LiteLLM_ModelTable: {id: 7, aliases: {friendly: claude}, created_by: test, updated_by: test}
  - LiteLLM_TeamTable: {team_id: aliased, model_id: 7, created_at: "2026-11-01T00:00:00Z", updated_at: "2026-11-01T00:00:00Z"}

users:
  member: {}

keys:
  sk-plain: {team_id: plain}
  sk-listed: {team_id: listed}
  sk-capped: {team_id: capped}
  sk-limited: {team_id: limited}
  sk-tagged: {team_id: tagged}
  sk-guarded: {team_id: guarded}
  sk-rpm-by-model: {team_id: rpm_by_model}
  sk-tpm-by-model: {team_id: tpm_by_model}
  sk-prioritized: {team_id: prioritized}
  sk-patterned: {team_id: patterned}
  sk-gone: {team_id: gone}
  sk-ui: {team_id: litellm-dashboard}
  sk-teamless: {}
  sk-member-default: {team_id: member_default}
  sk-member-default-owner: {team_id: member_default, user_id: member}
  sk-member-default-gone: {team_id: member_default_gone}
  sk-member-default-per-model: {team_id: member_default_per_model}
  sk-member-default-per-model-owner: {team_id: member_default_per_model, user_id: member}
  sk-reset-scheduled: {team_id: reset_scheduled}
  sk-windowed: {team_id: windowed}
  sk-per-model: {team_id: per_model}
  sk-router-override: {team_id: router_override}
  sk-aliased: {team_id: aliased}

requests:
  - name: a team with typed guardrails still goes to Python
    headers: {authorization: Bearer sk-guarded}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: metadata

  - name: a key in a team with a budget window
    headers: {authorization: Bearer sk-windowed}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a key in a team with a per-model budget
    headers: {authorization: Bearer sk-per-model}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a key in a team with router overrides
    headers: {authorization: Bearer sk-router-override}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: router_settings

  - name: a key in a team that names a model alias table
    headers: {authorization: Bearer sk-aliased}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: model_id

  - name: a key in a team that holds nothing else
    headers: {authorization: Bearer sk-plain}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: team

  - name: a key in a team with a model list
    headers: {authorization: Bearer sk-listed}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: team

  - name: a key in a team with a budget
    headers: {authorization: Bearer sk-capped}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: max_budget

  - name: a key in a team with a rate limit
    headers: {authorization: Bearer sk-limited}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: rpm_limit

  - name: a key in a team with metadata
    headers: {authorization: Bearer sk-tagged}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: not_native

  - name: a key in a team with a per-model request limit in its metadata
    headers: {authorization: Bearer sk-rpm-by-model}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: model_rpm_limit

  - name: a key in a team with a per-model token limit in its metadata
    headers: {authorization: Bearer sk-tpm-by-model}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: model_tpm_limit

  - name: a key in a team with a priority in its metadata
    headers: {authorization: Bearer sk-prioritized}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: priority

  - name: a key in a team whose model list holds a provider pattern
    headers: {authorization: Bearer sk-patterned}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: not_native

  - name: a key in a team the database does not hold
    headers: {authorization: Bearer sk-gone}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: not_native

  - name: a key in the UI team
    headers: {authorization: Bearer sk-ui}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: not_native

  - name: a key in no team
    headers: {authorization: Bearer sk-teamless}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a key in a team with a default member budget
    headers: {authorization: Bearer sk-member-default}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: team

  - name: a key owned by a member with the team default budget
    headers: {authorization: Bearer sk-member-default-owner}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a key in a team whose default member budget has no row
    headers: {authorization: Bearer sk-member-default-gone}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: team

  - name: a key in a team whose default member budget holds per-model budgets
    headers: {authorization: Bearer sk-member-default-per-model}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: team

  - name: a member key whose team default holds per-model budgets
    headers: {authorization: Bearer sk-member-default-per-model-owner}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a key in a team with a budget reset time
    headers: {authorization: Bearer sk-reset-scheduled}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: budget_duration
