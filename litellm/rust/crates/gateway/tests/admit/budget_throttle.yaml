# The percentage a key that opted into throttle_on_budget_exceeded is throttled to once over its
# budget, which Python reads, sends every request to Python.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  litellm_settings:
    budget_exceeded_throttle_percentage: 50
  general_settings:
    master_key: gateway-key

requests:
  - name: the master key
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: settings
    over: litellm_settings.budget_exceeded_throttle_percentage
