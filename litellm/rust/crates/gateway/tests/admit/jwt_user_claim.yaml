# With a user claim configured, the user a JWT names is read natively, with its membership of the
# team the JWT chooses, and its caller is served, in its team when it also chooses one. A user
# with no SSO id is linked to the sign-in, but only once the request is served: one that goes to
# Python for its model, or whose user holds a budget, is left as it was for Python to link. A user
# the database does not hold is the core's to refuse, a proxy admin that names one is the admin
# all the same, and a team Python adds the user to is not native. `users_after` is what the
# database holds for each user once every request was answered.
enterprise: true

config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
    enable_jwt_auth: true
    litellm_jwtauth:
      admin_allowed_routes: [/v1/messages]
      user_id_jwt_field: sub
      team_ids_jwt_field: groups

teams:
  team-1: {members_with_roles: [{user_id: user-member, role: user}]}

users:
  user-1: {sso_user_id: user-1}
  user-capped: {sso_user_id: user-capped, max_budget: 10}
  user-member: {sso_user_id: user-member, teams: [team-1]}
  user-unlinked: {}
  user-unlinked-forwarded: {}
  user-capped-unlinked: {max_budget: 10}

users_after:
  user-unlinked: {sso_user_id: user-unlinked}
  user-unlinked-forwarded: {sso_user_id: null}
  user-capped-unlinked: {sso_user_id: null}

requests:
  - name: a proxy admin JWT naming a user
    jwt: {claims: {scope: litellm_proxy_admin, sub: user-1}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a proxy admin JWT naming a user and choosing a team
    jwt: {claims: {scope: litellm_proxy_admin, sub: user-1}}
    headers: {x-litellm-team-id: team-1}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a proxy admin JWT naming a user the database does not hold
    jwt: {claims: {scope: litellm_proxy_admin, sub: user-gone}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a proxy admin JWT naming no user
    jwt: {claims: {scope: litellm_proxy_admin}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a user JWT naming a user
    jwt: {claims: {sub: user-1}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a user JWT naming a user and choosing a team it belongs to
    jwt: {claims: {sub: user-member, groups: [team-1]}}
    headers: {x-litellm-team-id: team-1}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: a user JWT choosing a team Python adds its user to
    jwt: {claims: {sub: user-1, groups: [team-1]}}
    headers: {x-litellm-team-id: team-1}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: not_native

  - name: a user JWT naming a user with a budget
    jwt: {claims: {sub: user-capped}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: max_budget

  - name: a user JWT naming a user its sign-in is not linked to yet
    jwt: {claims: {sub: user-unlinked}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: rust

  - name: the same sign-in for a model Python answers for
    jwt: {claims: {sub: user-unlinked-forwarded}}
    body: {model: no-such-model, max_tokens: 16, messages: []}
    expect: python
    reason: model
    over: unknown_model

  - name: the same sign-in for a user with a budget
    jwt: {claims: {sub: user-capped-unlinked}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: max_budget

  - name: a user JWT naming a user the database does not hold
    jwt: {claims: {sub: user-gone}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_token
