# With a team claim configured, a JWT naming a team needs a team read, which only Python serves
# yet, and one naming none is refused by the core.
enterprise: true

config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
    enable_jwt_auth: true
    litellm_jwtauth:
      team_id_jwt_field: team_id

requests:
  - name: a JWT naming a team
    jwt: {claims: {sub: user-123, team_id: team-1}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: not_native

  - name: a JWT naming no team
    jwt: {claims: {sub: user-123}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_token
