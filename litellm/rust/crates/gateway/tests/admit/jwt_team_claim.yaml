# With a team claim configured, a JWT naming a team has the team read natively. A team the
# database holds is found, and its caller still goes to Python, since the native spend log
# charges no team yet. A team the database does not hold, and a JWT naming none, are the core's
# to refuse.
enterprise: true

config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
    enable_jwt_auth: true
    litellm_jwtauth:
      team_id_jwt_field: team_id

teams:
  team-1: {}

requests:
  - name: a JWT naming a team
    jwt: {claims: {sub: user-123, team_id: team-1}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: team

  - name: a JWT naming a team the database does not hold
    jwt: {claims: {sub: user-123, team_id: team-gone}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_token

  - name: a JWT naming no team
    jwt: {claims: {sub: user-123}}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: credential
    over: invalid_token
