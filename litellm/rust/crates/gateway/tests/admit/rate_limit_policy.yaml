# The proxy's key limiter refuses a call it cannot count when fail_closed_rate_limit_enforcement
# is on. The native limiter always lets that call through, so the setting sends every request to
# Python.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
    fail_closed_rate_limit_enforcement: true

requests:
  - name: plain
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: settings
    over: general_settings.fail_closed_rate_limit_enforcement
