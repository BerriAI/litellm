[package]
name = "litellm-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []
fips = ["rustls/fips", "litellm-http/fips", "litellm-at-rest/fips"]

[dependencies]
litellm-at-rest.workspace = true
litellm-call-scope.workspace = true
litellm-python-compat.workspace = true
litellm-env.workspace = true
litellm-secret-value.workspace = true
axum.workspace = true
envy = "0.4.2"
http-body-util = "0.1"
litellm-inference.workspace = true
litellm-gateway-inference.workspace = true
litellm-gateway-forward.workspace = true
thiserror.workspace = true
futures-util.workspace = true
litellm-gateway-auth.workspace = true
litellm-gateway-auth-core.workspace = true
jiff.workspace = true
litellm-callbacks.workspace = true
litellm-callbacks-spend-logger.workspace = true
litellm-coroutine.workspace = true
litellm-callbacks-budgets.workspace = true
litellm-spend-log-writer.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
litellm-config.workspace = true
litellm-config-load.workspace = true
litellm-core-utils.workspace = true
litellm-db.workspace = true
litellm-db-resolve.workspace = true
litellm-repositories.workspace = true
litellm-auth-store.workspace = true
litellm-error.workspace = true
litellm-circuit-breaker.workspace = true
litellm-redis-client.workspace = true
litellm-redis-store.workspace = true
litellm-callbacks-parallel-request-limiter.workspace = true
litellm-callbacks-model-capacity.workspace = true
litellm-redis-connect.workspace = true
litellm-redis-resolve.workspace = true
litellm-redis-types.workspace = true
rustls.workspace = true
litellm-http.workspace = true
litellm-inference-messages.workspace = true
litellm-license.workspace = true
litellm-llms-types.workspace = true
litellm-model-catalog.workspace = true
litellm-model-catalog-refresh.workspace = true
litellm-token-counter = { path = "../token-counter", default-features = false, features = ["tiktoken"] }
litellm-router-core.workspace = true
litellm-secrets.workspace = true
litellm-redaction.workspace = true
litellm-tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
rand.workspace = true
strum.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["catch-panic", "cors", "decompression-gzip", "decompression-zstd", "metrics", "propagate-header", "request-id", "set-header"] }
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
litellm-gateway = { workspace = true, features = ["test-support"] }
litellm-gateway-inference = { workspace = true, features = ["test-support"] }
litellm-redis-testing.workspace = true
litellm-db-testing.workspace = true
sqlx.workspace = true
litellm-yaml.workspace = true
serde_yaml_ng = "0.10.0"
litellm-http = { workspace = true, features = ["test-support"] }
rstest.workspace = true
litellm-callbacks-spend-log.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "test-util"] }
flate2 = "1.1.10"
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
wiremock.workspace = true
zstd = "0.14.4"
