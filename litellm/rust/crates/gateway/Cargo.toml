litellm-error.workspace = true
litellm-circuit-breaker.workspace = true
litellm-redis-client.workspace = true
litellm-redis-connect.workspace = true
litellm-redis-resolve.workspace = true
litellm-redis-types.workspace = true
rustls.workspace = true
litellm-http.workspace = true
litellm-inference-messages.workspace = true
litellm-license.workspace = true
litellm-llms.workspace = true
litellm-model-catalog.workspace = true
