suite: removed lens values
templates:
  - NOTES.txt
values:
  - ./values/required.yaml
tests:
  - it: warns that lens values are ignored
    set:
      lens.enabled: true
      lens.url: http://lens.lens.svc:4318
    asserts:
      - matchRegexRaw:
          pattern: lens and lensWorker values are ignored
  - it: warns that lensWorker values are ignored in monolith mode
    set:
      monolith.enabled: true
      lensWorker.enabled: true
      lensWorker.mode: sidecar
    asserts:
      - matchRegexRaw:
          pattern: lens and lensWorker values are ignored
  - it: warns about obsolete values even when disabled
    set:
      lens.enabled: false
      lensWorker.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: lens and lensWorker values are ignored
  - it: stays quiet without lens values
    asserts:
      - notMatchRegexRaw:
          pattern: lensWorker
