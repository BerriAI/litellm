suite: test ingress.controller
templates:
  - ingress.yaml
values:
  - ./values/required.yaml
tests:
  - it: keeps the AWS Load Balancer Controller path types by default
    set:
      ingress.enabled: true
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /favicon.ico
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-litellm-ui
                port:
                  number: 3000
      - notExists:
          path: spec.rules[0].http.paths[?(@.backend.service.port.name == "use-annotation" && @.pathType != "Prefix")]
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /*.txt
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-litellm-ui
                port:
                  number: 3000

  - it: fits the AWS Load Balancer Controller's one rule per path under the default 100 rules per ALB
    set:
      ingress.enabled: true
    asserts:
      - notExists:
          path: spec.rules[0].http.paths[100]

  - it: routes each grouped gateway prefix to the gateway Service through a use-annotation action on alb
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/actions.litellm-gateway-0"]
          value: '{"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"RELEASE-NAME-litellm-gateway","servicePort":"http"}]}}'
      - matchRegex:
          path: metadata.annotations["alb.ingress.kubernetes.io/conditions.litellm-gateway-0"]
          pattern: '^\[\{"field":"path-pattern","pathPatternConfig":\{"values":\["(/[^"*]+)","/[^"*]+/\*"\]\}\}\]$'
      - notExists:
          path: spec.rules[0].http.paths[?(@.pathType == "Prefix" && @.backend.service.name == "RELEASE-NAME-litellm-gateway")]

  - it: keeps an operator's conditions for the gateway Service on every grouped alb rule
    set:
      ingress.enabled: true
      ingress.annotations:
        alb.ingress.kubernetes.io/conditions.RELEASE-NAME-litellm-gateway: '[{"field":"source-ip","sourceIpConfig":{"values":["10.0.0.0/8"]}}]'
    asserts:
      - matchRegex:
          path: metadata.annotations["alb.ingress.kubernetes.io/conditions.litellm-gateway-0"]
          pattern: '^\[\{"field":"source-ip","sourceIpConfig":\{"values":\["10\.0\.0\.0/8"\]\}\},\{"field":"path-pattern",'
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/conditions.litellm-gateway-50"]
          value: '[{"field":"source-ip","sourceIpConfig":{"values":["10.0.0.0/8"]}}]'

  - it: renders no dotted Exact or Prefix path for ingress-nginx, whose admission webhook rejects them
    set:
      ingress.enabled: true
      ingress.controller: nginx
    asserts:
      - notMatchRegexRaw:
          pattern: 'path: /\S*\.\S*\n\s+pathType: (Exact|Prefix)\n'
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /favicon.ico
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-litellm-ui
                port:
                  number: 3000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /eu.assemblyai
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-litellm-gateway
                port:
                  number: 4000

  - it: drops the /*.txt wildcard for ingress-nginx and keeps every other route as is
    set:
      ingress.enabled: true
      ingress.controller: nginx
    asserts:
      - notContains:
          path: spec.rules[0].http.paths
          content:
            path: /*.txt
          any: true
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /ui
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-litellm-ui
                port:
                  number: 3000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /test
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-litellm-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /debug/memory/summary
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-litellm-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /eu_jev/v1/systemone
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-litellm-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /openrouter
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-litellm-gateway
                port:
                  number: 4000
      - equal:
          path: spec.rules[0].http.paths[-1]
          value:
            path: /
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-litellm-backend
                port:
                  number: 4001

  - it: rejects an extraPaths entry that repeats a built-in path at the pathType ingress-nginx renders it with
    set:
      ingress.enabled: true
      ingress.controller: nginx
      ingress.extraPaths:
        - path: /favicon.ico
          service: ui
          pathType: ImplementationSpecific
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /favicon.ico with pathType ImplementationSpecific is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: rejects a controller it has no path types for
    set:
      ingress.enabled: true
      ingress.controller: traefik
    asserts:
      - failedTemplate:
          errorMessage: 'ingress.controller: unknown controller "traefik", expected one of alb, nginx'

  - it: rejects an extraPaths entry that repeats a built-in path once ingress-nginx normalizes its pathType
    set:
      ingress.enabled: true
      ingress.controller: nginx
      ingress.extraPaths:
        - path: /favicon.ico
          service: ui
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /favicon.ico with pathType ImplementationSpecific is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: renders a dotted extraPaths entry as ImplementationSpecific for ingress-nginx
    set:
      ingress.enabled: true
      ingress.controller: nginx
      ingress.extraPaths:
        - path: /eu.assemblyai.custom
          service: gateway
        - path: /robots.txt
          service: ui
          pathType: Exact
    asserts:
      - notMatchRegexRaw:
          pattern: 'path: "?/\S*\.\S*"?\n\s+pathType: (Exact|Prefix)\n'
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /eu.assemblyai.custom
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-litellm-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /robots.txt
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-litellm-ui
                port:
                  number: 3000

  - it: keeps the requested pathType of a dotted extraPaths entry for the AWS Load Balancer Controller
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /eu.assemblyai.custom
          service: gateway
        - path: /robots.txt
          service: ui
          pathType: Exact
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /eu.assemblyai.custom
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-litellm-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-litellm-ui
                port:
                  number: 3000
