suite: lens secrets copied from the Lens namespace
templates:
  - lens-secrets.yaml
values:
  - ./values/required.yaml
release:
  namespace: litellm
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: lens-gateway
        namespace: lens
      data:
        gateway-secret: Z2F0ZXdheQ==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: lens-service
        namespace: lens
      data:
        service-token: c2VydmljZQ==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: lens-connection
        namespace: lens
      data:
        gateway-secret: Z2F0ZXdheQ==
        service-token: c2VydmljZQ==
tests:
  - it: renders nothing unless lens.secretsNamespace is set
    set:
      lens.enabled: true
      lens.gatewaySecret.name: lens-gateway
      lens.serviceTokenSecret.name: lens-service
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when Lens shares the release namespace
    set:
      lens.enabled: true
      lens.secretsNamespace: litellm
      lens.gatewaySecret.name: lens-gateway
      lens.serviceTokenSecret.name: lens-service
    asserts:
      - hasDocuments:
          count: 0

  - it: copies the generated Lens secrets into the release namespace
    set:
      lens.enabled: true
      lens.secretsNamespace: lens
      lens.gatewaySecret.name: lens-gateway
      lens.serviceTokenSecret.name: lens-service
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: lens-gateway
      - documentIndex: 0
        equal:
          path: data
          value:
            gateway-secret: Z2F0ZXdheQ==
      - documentIndex: 1
        equal:
          path: metadata.name
          value: lens-service
      - documentIndex: 1
        equal:
          path: data
          value:
            service-token: c2VydmljZQ==

  - it: copies one shared secret once with both keys
    set:
      lens.enabled: true
      lens.secretsNamespace: lens
      lens.gatewaySecret.name: lens-connection
      lens.serviceTokenSecret.name: lens-connection
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data
          value:
            gateway-secret: Z2F0ZXdheQ==
            service-token: c2VydmljZQ==

  - it: fails with the missing secret and namespace named
    set:
      lens.enabled: true
      lens.secretsNamespace: lens
      lens.gatewaySecret.name: absent
      lens.serviceTokenSecret.name: lens-service
    asserts:
      - failedTemplate:
          errorPattern: Secret absent was not found in namespace lens

  - it: fails when the source secret lacks the configured key
    set:
      lens.enabled: true
      lens.secretsNamespace: lens
      lens.gatewaySecret.name: lens-service
      lens.serviceTokenSecret.name: lens-service
    asserts:
      - failedTemplate:
          errorPattern: Secret lens-service in namespace lens has no key gateway-secret
