{{- with .Values.lens }}
{{- if and .enabled .secretsNamespace (ne .secretsNamespace $.Release.Namespace) }}
{{- $namespace := .secretsNamespace }}
{{- $copies := dict }}
{{- range (list (dict "ref" .gatewaySecret "value" "lens.gatewaySecret.name") (dict "ref" .serviceTokenSecret "value" "lens.serviceTokenSecret.name")) }}
{{- $name := required (printf "%s is required when lens.enabled is true" .value) .ref.name }}
{{- $source := lookup "v1" "Secret" $namespace $name }}
{{- if not $source }}
{{- fail (printf "lens.secretsNamespace is set, but Secret %s was not found in namespace %s. Install Lens with gateway.enabled=true first. The copy reads the live cluster, so it does not work with helm template or a client-side dry run" $name $namespace) }}
{{- end }}
{{- $value := required (printf "Secret %s in namespace %s has no key %s" $name $namespace .ref.key) (index ($source.data | default dict) .ref.key) }}
{{- $_ := set $copies $name (merge (dict .ref.key $value) (get $copies $name | default dict)) }}
{{- end }}
{{- range $name, $data := $copies }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "litellm.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
