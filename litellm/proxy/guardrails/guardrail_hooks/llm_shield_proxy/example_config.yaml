model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

guardrails:
  - guardrail_name: "llm_shield_proxy"
    litellm_params:
      guardrail: llm_shield_proxy
      mode: ["pre_call", "post_call"]
      default_on: true
      api_base: "http://localhost:8000"
      api_key: os.environ/LLM_SHIELD_PROXY_API_KEY
