model_list:
  - model_name: enterprise-default
    litellm_params:
      model: openai/qwen-plus
      api_base: os.environ/ENTERPRISE_UPSTREAM_BASE_URL
      api_key: os.environ/ENTERPRISE_UPSTREAM_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_connection_pool_limit: 20
  disable_spend_logs: false

litellm_settings:
  request_timeout: 300
  drop_params: true
