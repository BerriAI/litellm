name: litellm-tracing

services:
  litellm:
    build:
      context: ..
      target: runtime
    command: ["--config", "/app/tracing-config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: local-tracing-master-key
      LITELLM_SALT_KEY: sk-local-tracing-salt-key
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      CLICKHOUSE_URL: http://default:local-tracing@clickhouse:8123
      CLICKHOUSE_DATABASE: litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./tracing-config.yaml:/app/tracing-config.yaml:ro
    ports:
      - "127.0.0.1:4002:4000"
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.6.6
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: local-tracing
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "local-tracing", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  clickhouse_data:
