[project]
name = "envoy-ext-proc-proxy"
version = "1.0.0"
description = "Proxy between LiteLLM and AI Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiodns>=4.0.4",
    "aiohttp>=3.14.2",
    "grpcio>=1.78.0",
    "protobuf",
]

[project.scripts]
ext-proc-proxy = "envoy_ext_proc_proxy:main"

[build-system]
# grpcio-tools are pinned to the version that uses protobuf no more recent
# than resolved protobuf package. If/when protobuf is updated to the newer
# version, bump grpcio-tools too.
requires = ["hatchling", "grpcio-tools<1.71.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.custom]
# Enables a custom build hook defined in hatch_build.py
