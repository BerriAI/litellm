# xct-auth (self-hosted Supabase GoTrue @ auth.xcity.one) JWT authentication.
#
# This file only adds general_settings; the model_list keeps loading from the
# database (STORE_MODEL_IN_DB). It takes effect ONLY when the service env sets:
#   CONFIG_FILE_PATH=/app/xct_jwt_config.yaml
#   JWT_PUBLIC_KEY_URL=https://auth.xcity.one/.well-known/jwks.json
#
# Virtual API keys (sk-...) keep working unchanged; this adds JWT validation as
# a second auth path. GoTrue signs RS256 and publishes JWKS, so LiteLLM verifies
# tokens via the JWKS URL above. JWT_AUDIENCE/JWT_ISSUER are intentionally left
# unset so audience/issuer checks are skipped (GoTrue aud="authenticated").
general_settings:
  enable_jwt_auth: true
  litellm_jwtauth:
    user_id_jwt_field: "sub"
    user_email_jwt_field: "email"
    user_id_upsert: true
    enforce_rbac: false
