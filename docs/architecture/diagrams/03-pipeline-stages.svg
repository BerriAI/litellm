<svg xmlns='http://www.w3.org/2000/svg' width='1150' height='330' viewBox='0 0 1150 330' font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The seven data-plane stages</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7b828c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d33c3c'/></marker><marker id='ahk' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#30343b'/></marker></defs><rect width='1150' height='330' fill='#ffffff'/><rect x='20' y='92' width='142' height='96' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='91.0' y='122.6' font-size='12.5' fill='#1d3f8f' font-weight='600' text-anchor='middle'>1 Endpoint</text><text x='91.0' y='140.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>proxy_server.py or</text><text x='91.0' y='153.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>*_endpoints/*.py</text><text x='91.0' y='167.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>parse body, stamp ids</text><rect x='182' y='92' width='142' height='96' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='253.0' y='122.6' font-size='12.5' fill='#1d3f8f' font-weight='600' text-anchor='middle'>2 Auth</text><text x='253.0' y='140.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>user_api_key_auth</text><text x='253.0' y='153.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>key, team, user checks</text><text x='253.0' y='167.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>budget reservation</text><rect x='344' y='92' width='142' height='96' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='415.0' y='122.6' font-size='12.5' fill='#1d3f8f' font-weight='600' text-anchor='middle'>3 Pre-call</text><text x='415.0' y='140.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>add_litellm_data_to_request</text><text x='415.0' y='153.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>function_setup -&gt; Logging</text><text x='415.0' y='167.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>pre_call_hook</text><rect x='506' y='92' width='142' height='96' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='577.0' y='122.6' font-size='12.5' fill='#1b5e3a' font-weight='600' text-anchor='middle'>4 Route</text><text x='577.0' y='140.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>route_request</text><text x='577.0' y='153.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>Router: deployment,</text><text x='577.0' y='167.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>retries, fallbacks</text><rect x='668' y='92' width='142' height='96' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='739.0' y='122.6' font-size='12.5' fill='#1b5e3a' font-weight='600' text-anchor='middle'>5 SDK + provider</text><text x='739.0' y='140.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>*/dispatch.py -&gt; main.py</text><text x='739.0' y='153.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>provider Config</text><text x='739.0' y='167.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>HTTP call</text><rect x='830' y='92' width='142' height='96' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='901.0' y='122.6' font-size='12.5' fill='#1b5e3a' font-weight='600' text-anchor='middle'>6 Log + cost</text><text x='901.0' y='140.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>@client wrapper</text><text x='901.0' y='153.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>response_cost_calculator</text><text x='901.0' y='167.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>async_success_handler</text><rect x='992' y='92' width='142' height='96' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='1063.0' y='122.6' font-size='12.5' fill='#1d3f8f' font-weight='600' text-anchor='middle'>7 Post-call</text><text x='1063.0' y='140.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>post_call_success_hook</text><text x='1063.0' y='153.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>output guardrails</text><text x='1063.0' y='167.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>x-litellm-* headers</text><path d='M162.0,140.0 L182.0,140.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M324.0,140.0 L344.0,140.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M486.0,140.0 L506.0,140.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M648.0,140.0 L668.0,140.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M810.0,140.0 L830.0,140.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M972.0,140.0 L992.0,140.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><line x1='20' y1='64' x2='486' y2='64' stroke='#3b6fd8' stroke-width='3' stroke-linecap='round'/><text x='253.0' y='54.0' font-size='11' fill='#3b6fd8' font-weight='600' text-anchor='middle'>proxy owns identity and policy</text><line x1='506' y1='64' x2='648' y2='64' stroke='#2e8b57' stroke-width='3' stroke-linecap='round'/><text x='577.0' y='54.0' font-size='11' fill='#2e8b57' font-weight='600' text-anchor='middle'>Router owns availability</text><line x1='668' y1='64' x2='810' y2='64' stroke='#2e8b57' stroke-width='3' stroke-linecap='round'/><text x='739.0' y='54.0' font-size='11' fill='#2e8b57' font-weight='600' text-anchor='middle'>SDK owns translation</text><line x1='830' y1='64' x2='972' y2='64' stroke='#2e8b57' stroke-width='3' stroke-linecap='round'/><text x='901.0' y='54.0' font-size='11' fill='#2e8b57' font-weight='600' text-anchor='middle'>shared side channel</text><line x1='992' y1='64' x2='1134' y2='64' stroke='#3b6fd8' stroke-width='3' stroke-linecap='round'/><text x='1063.0' y='54.0' font-size='11' fill='#3b6fd8' font-weight='600' text-anchor='middle'>proxy</text><text x='20.0' y='26.0' font-size='11.5' fill='#5b616b' font-weight='500' text-anchor='start'>Every LLM call through the proxy is meant to pass these stages in order. Direct SDK use is stages 5 and 6 only.</text><path d='M415.0,188.0 L415.0,232.0 L1063.0,232.0 L1063.0,188.0' fill='none' stroke='#7b828c' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ah)'/><rect x='571.8' y='234.0' width='334.5' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='739.0' y='246.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>during_call_hook runs in parallel with stages 4 and 5</text><path d='M1000,269 a65.0,7 0 0 0 130,0 a65.0,7 0 0 0 -130,0 v40 a65.0,7 0 0 0 130,0 v-40' fill='#eef0f3' stroke='#6b7280' stroke-width='1.4'/><text x='1065.0' y='295.0' font-size='13' fill='#30343b' font-weight='600' text-anchor='middle'>Postgres</text><path d='M921.0,188.0 L921.0,289.0 L1000.0,289.0' fill='none' stroke='#7b828c' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ah)'/><rect x='537.4' y='282.0' width='377.6' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='911.0' y='294.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='end'>_ProxyDBLogger -&gt; in-memory queues -&gt; update_spend job (10s)</text></svg>
