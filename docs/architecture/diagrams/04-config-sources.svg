<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='410' viewBox='0 0 1000 410' font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Where proxy configuration comes from</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7b828c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d33c3c'/></marker><marker id='ahk' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#30343b'/></marker></defs><rect width='1000' height='410' fill='#ffffff'/><rect x='20' y='40' width='230' height='62' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='135.0' y='60.4' font-size='13' fill='#2b2f36' font-weight='600' text-anchor='middle'>Environment</text><text x='135.0' y='78.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>LITELLM_MASTER_KEY, DATABASE_URL,</text><text x='135.0' y='92.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>REDIS_*, LITELLM_SALT_KEY</text><rect x='20' y='122' width='230' height='62' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='135.0' y='149.2' font-size='13' fill='#2b2f36' font-weight='600' text-anchor='middle'>config.yaml</text><text x='135.0' y='167.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>file or bucket, with includes</text><rect x='20' y='204' width='230' height='62' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='135.0' y='224.4' font-size='13' fill='#2b2f36' font-weight='600' text-anchor='middle'>Secret managers</text><text x='135.0' y='242.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>os.environ/ and oidc/ references</text><text x='135.0' y='256.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>secret_managers/main.py:196</text><path d='M50,307 a85.0,7 0 0 0 170,0 a85.0,7 0 0 0 -170,0 v66 a85.0,7 0 0 0 170,0 v-66' fill='#eef0f3' stroke='#6b7280' stroke-width='1.4'/><text x='135.0' y='332.0' font-size='13' fill='#30343b' font-weight='600' text-anchor='middle'>Postgres</text><text x='135.0' y='347.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>ProxyModelTable, Config,</text><text x='135.0' y='361.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>guardrails, MCP ...</text><rect x='360' y='140' width='210' height='110' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='465.0' y='177.7' font-size='13' fill='#1d3f8f' font-weight='600' text-anchor='middle'>ProxyConfig.load_config</text><text x='465.0' y='195.9' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>proxy_server.py:6471</text><text x='465.0' y='209.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>parses YAML twice</text><text x='465.0' y='222.9' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>(CLI, then lifespan)</text><rect x='660' y='30' width='320' height='60' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='820.0' y='56.2' font-size='13' fill='#1b5e3a' font-weight='600' text-anchor='middle'>litellm.* module globals</text><text x='820.0' y='74.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>setattr(litellm, key, value), no schema</text><rect x='660' y='106' width='320' height='60' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='820.0' y='132.2' font-size='13' fill='#1d3f8f' font-weight='600' text-anchor='middle'>proxy_server globals</text><text x='820.0' y='150.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>general_settings (SettingsStore), master_key ...</text><rect x='660' y='182' width='320' height='60' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='820.0' y='208.2' font-size='13' fill='#1b5e3a' font-weight='600' text-anchor='middle'>Router</text><text x='820.0' y='226.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>model_list + router_settings, :7246</text><rect x='660' y='258' width='320' height='60' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='820.0' y='284.2' font-size='13' fill='#1b5e3a' font-weight='600' text-anchor='middle'>litellm.callbacks</text><text x='820.0' y='302.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>loggers, guardrails, PROXY_HOOKS</text><rect x='660' y='334' width='320' height='60' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='820.0' y='360.2' font-size='13' fill='#1b5e3a' font-weight='600' text-anchor='middle'>litellm.cache, redis_usage_cache</text><text x='820.0' y='378.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>init_cache, :6206</text><path d='M250.0,71.0 L305.0,71.0 L305.0,162.0 L360.0,162.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M250.0,153.0 L305.0,153.0 L305.0,195.0 L360.0,195.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M250.0,235.0 L305.0,235.0 L305.0,228.0 L360.0,228.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M220.0,340.0 L465.0,340.0 L465.0,250.0' fill='none' stroke='#d33c3c' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ahr)'/><rect x='230.7' y='314.0' width='223.6' height='32.6' rx='3' fill='#ffffff' opacity='0.92'/><text x='342.5' y='326.0' font-size='11' fill='#d33c3c' font-weight='400' text-anchor='middle'>only via add_deployment (30s poll),</text><text x='342.5' y='340.3' font-size='11' fill='#d33c3c' font-weight='400' text-anchor='middle'>never at boot</text><path d='M570.0,195.0 L615.0,195.0 L615.0,60.0 L660.0,60.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M570.0,195.0 L615.0,195.0 L615.0,136.0 L660.0,136.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M570.0,195.0 L615.0,195.0 L615.0,212.0 L660.0,212.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M570.0,195.0 L615.0,195.0 L615.0,288.0 L660.0,288.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M570.0,195.0 L615.0,195.0 L615.0,364.0 L660.0,364.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='916' y='36' width='58' height='16' rx='8' fill='#fde8e8' stroke='#d33c3c'/><text x='945.0' y='48.0' font-size='9.5' fill='#d33c3c' font-weight='700' text-anchor='middle'>gap G-C1</text></svg>
