<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='400' viewBox='0 0 1080 400' font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How a control-plane change reaches other pods</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7b828c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d33c3c'/></marker><marker id='ahk' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#30343b'/></marker></defs><rect width='1080' height='400' fill='#ffffff'/><rect x='20' y='60' width='150' height='60' rx='8' fill='#f3e8fd' stroke='#8e4fd1' stroke-width='1.4'/><text x='95.0' y='86.2' font-size='13' fill='#582a8c' font-weight='600' text-anchor='middle'>Admin UI</text><text x='95.0' y='104.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>POST /model/new</text><rect x='230' y='40' width='220' height='100' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='340.0' y='72.7' font-size='13' fill='#1d3f8f' font-weight='600' text-anchor='middle'>pod A</text><text x='340.0' y='90.9' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>encrypt litellm_params</text><text x='340.0' y='104.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>ModelRepository.table.create</text><text x='340.0' y='117.9' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>add_deployment now</text><path d='M530,43 a100.0,7 0 0 0 200,0 a100.0,7 0 0 0 -200,0 v56 a100.0,7 0 0 0 200,0 v-56' fill='#eef0f3' stroke='#6b7280' stroke-width='1.4'/><text x='630.0' y='70.0' font-size='13' fill='#30343b' font-weight='600' text-anchor='middle'>Postgres</text><text x='630.0' y='85.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>LiteLLM_ProxyModelTable</text><path d='M530,163 a100.0,7 0 0 0 200,0 a100.0,7 0 0 0 -200,0 v56 a100.0,7 0 0 0 200,0 v-56' fill='#eef0f3' stroke='#6b7280' stroke-width='1.4'/><text x='630.0' y='190.0' font-size='13' fill='#30343b' font-weight='600' text-anchor='middle'>Redis pub/sub</text><text x='630.0' y='205.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>litellm_proxy.config_change</text><rect x='850' y='50' width='215' height='170' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='957.5' y='110.9' font-size='13' fill='#1d3f8f' font-weight='600' text-anchor='middle'>pod B</text><text x='957.5' y='129.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>ConfigSyncSubscriber (debounced)</text><text x='957.5' y='142.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>or add_deployment_job poll (30s)</text><text x='957.5' y='156.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>then add_deployment</text><text x='957.5' y='169.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>then Router upsert / delete</text><path d='M170.0,90.0 L230.0,80.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M450.0,70.0 L530.0,66.1' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='470.6' y='52.0' width='38.8' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='490.0' y='64.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>write</text><path d='M450.0,115.0 L490.0,115.0 L490.0,191.0 L530.0,191.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='484.4' y='173.0' width='51.1' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='510.0' y='185.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>publish</text><path d='M730.0,191.0 L850.0,191.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='770.6' y='175.0' width='38.8' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='790.0' y='187.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>event</text><path d='M730.0,71.0 L850.0,71.0' fill='none' stroke='#7b828c' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ah)'/><rect x='718.2' y='75.0' width='143.5' height='32.6' rx='3' fill='#ffffff' opacity='0.92'/><text x='790.0' y='87.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>poll every 30s,</text><text x='790.0' y='101.3' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>store_model_in_db only</text><rect x='20' y='280' width='190' height='60' rx='8' fill='#f3e8fd' stroke='#8e4fd1' stroke-width='1.4'/><text x='115.0' y='306.2' font-size='13' fill='#582a8c' font-weight='600' text-anchor='middle'>key update / delete</text><text x='115.0' y='324.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>key_management_endpoints</text><rect x='270' y='280' width='230' height='60' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='385.0' y='306.2' font-size='13' fill='#1d3f8f' font-weight='600' text-anchor='middle'>delete_cache_key_object</text><text x='385.0' y='324.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle' font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">auth_checks.py:3315</text><path d='M560,282 a95.0,7 0 0 0 190,0 a95.0,7 0 0 0 -190,0 v56 a95.0,7 0 0 0 190,0 v-56' fill='#eef0f3' stroke='#6b7280' stroke-width='1.4'/><text x='655.0' y='309.0' font-size='13' fill='#30343b' font-weight='600' text-anchor='middle'>Redis pub/sub</text><text x='655.0' y='324.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>auth cache invalidation</text><rect x='850' y='280' width='215' height='60' rx='8' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.4'/><text x='957.5' y='312.9' font-size='13' fill='#1d3f8f' font-weight='600' text-anchor='middle'>pod B drops cached key</text><path d='M210.0,310.0 L270.0,310.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M500.0,310.0 L560.0,310.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M750.0,310.0 L850.0,310.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><text x='540.0' y='382.0' font-size='11' fill='#d33c3c' font-weight='500' text-anchor='middle'>Without Redis both channels are gone. Model changes fall back to the 30s poll, key revocations wait for the cache TTL.</text></svg>
