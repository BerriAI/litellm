<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='320' viewBox='0 0 1000 320' font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>How a public call picks Python or Rust</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7b828c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d33c3c'/></marker><marker id='ahk' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#30343b'/></marker></defs><rect width='1000' height='320' fill='#ffffff'/><rect x='20' y='120' width='170' height='60' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='105.0' y='146.2' font-size='13' fill='#2b2f36' font-weight='600' text-anchor='middle'>litellm.amessages(...)</text><text x='105.0' y='164.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle' font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">public call</text><rect x='230' y='120' width='150' height='60' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='305.0' y='146.2' font-size='13' fill='#1b5e3a' font-weight='600' text-anchor='middle'>messages/dispatch.py</text><text x='305.0' y='164.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle' font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">PublicDispatch</text><rect x='410' y='110' width='160' height='80' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='490.0' y='139.4' font-size='13' fill='#1b5e3a' font-weight='600' text-anchor='middle'>catalog.rollout</text><text x='490.0' y='157.7' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>(route, provider)</text><text x='490.0' y='171.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>first matching rule wins</text><rect x='820' y='20' width='160' height='56' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='900.0' y='44.2' font-size='13' fill='#8a3d12' font-weight='600' text-anchor='middle'>_native</text><text x='900.0' y='62.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>no Python fallback</text><rect x='660' y='120' width='130' height='60' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='725.0' y='145.9' font-size='12' fill='#2b2f36' font-weight='600' text-anchor='middle'>LITELLM_RUST on?</text><text x='725.0' y='162.9' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>or litellm.rust(True)</text><rect x='820' y='120' width='160' height='60' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='900.0' y='146.5' font-size='13' fill='#8a3d12' font-weight='600' text-anchor='middle'>_native</text><text x='900.0' y='164.8' font-size='9.5' fill='#5b616b' font-weight='400' text-anchor='middle'>error after start is terminal</text><rect x='820' y='236' width='160' height='60' rx='8' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.4'/><text x='900.0' y='262.2' font-size='13' fill='#1b5e3a' font-weight='600' text-anchor='middle'>Python handler</text><text x='900.0' y='280.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>main.py / llms/*</text><path d='M190.0,150.0 L230.0,150.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M380.0,150.0 L410.0,150.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><path d='M490.0,110.0 L490.0,48.0 L820.0,48.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='611.0' y='32.0' width='88.1' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='655.0' y='44.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>RUST_REQUIRED</text><path d='M570.0,150.0 L660.0,150.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='577.1' y='134.0' width='75.8' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='615.0' y='146.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>RUST_OPT_IN</text><path d='M790.0,150.0 L820.0,150.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='791.8' y='134.0' width='26.5' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='805.0' y='146.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>yes</text><path d='M725.0,180.0 L725.0,252.0 L820.0,252.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='726.8' y='200.0' width='20.3' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='737.0' y='212.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>no</text><path d='M490.0,190.0 L490.0,282.0 L820.0,282.0' fill='none' stroke='#7b828c' stroke-width='1.4' marker-end='url(#ah)'/><rect x='540.1' y='284.0' width='229.8' height='18.3' rx='3' fill='#ffffff' opacity='0.92'/><text x='655.0' y='296.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='middle'>PYTHON_ONLY (and anything unmatched)</text><path d='M900.0,180.0 L900.0,236.0' fill='none' stroke='#7b828c' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ah)'/><rect x='775.1' y='192.0' width='118.9' height='32.6' rx='3' fill='#ffffff' opacity='0.92'/><text x='890.0' y='204.0' font-size='11' fill='#5b616b' font-weight='400' text-anchor='end'>RustBridgeDeclined</text><text x='890.0' y='218.3' font-size='11' fill='#5b616b' font-weight='400' text-anchor='end'>before execution</text></svg>
