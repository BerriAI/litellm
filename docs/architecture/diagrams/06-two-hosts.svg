rust workspace</text><rect x='500' y='72' width='230' height='56' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='615.0' y='96.2' font-size='13' fill='#8a3d12' font-weight='600' text-anchor='middle'>python-bridge</text><text x='615.0' y='114.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>cdylib _native (PyO3)</text><rect x='790' y='72' width='230' height='56' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='905.0' y='96.2' font-size='13' fill='#8a3d12' font-weight='600' text-anchor='middle'>gateway binary</text><text x='905.0' y='114.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>axum server, own Dockerfile</text><rect x='790' y='160' width='230' height='52' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='905.0' y='182.2' font-size='13' fill='#8a3d12' font-weight='600' text-anchor='middle'>gateway-inference</text><text x='905.0' y='200.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>routes, parsing, error envelopes</text><rect x='500' y='160' width='230' height='52' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='615.0' y='182.2' font-size='13' fill='#8a3d12' font-weight='600' text-anchor='middle'>callbacks-legacy-python</text><text x='615.0' y='200.4' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>borrowed Python Logging</text><rect x='560' y='244' width='400' height='56' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='760.0' y='267.7' font-size='11' fill='#8a3d12' font-weight='600' text-anchor='middle'>inference + inference-chat / messages / responses / ocr / transcription</text><text x='760.0' y='283.5' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>no pricing, budgets or rate limits here</text><rect x='560' y='330' width='190' height='52' rx='8' fill='#fdeee4' stroke='#d0692b' stroke-width='1.4'/><text x='655.0' y='352.2' font-size='13' fill='#8a3d1