<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='470' viewBox='0 0 1060 470' font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Where state lives in one proxy worker</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7b828c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d33c3c'/></marker><marker id='ahk' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#30343b'/></marker></defs><rect width='1060' height='470' fill='#ffffff'/><rect x='20' y='30' width='770' height='420' rx='12' fill='#f7f8fa' stroke='#c4c9d1' stroke-width='1.2'/><text x='32.0' y='48.0' font-size='11.5' fill='#5b616b' font-weight='700' text-anchor='start'>One proxy worker process</text><rect x='40' y='62' width='330' height='300' rx='12' fill='#e6f4ea' stroke='#2e8b57' stroke-width='1.2'/><text x='52.0' y='80.0' font-size='11.5' fill='#1b5e3a' font-weight='700' text-anchor='start'>litellm module   ·   419 names</text><rect x='56' y='92' width='298' height='70' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='205.0' y='122.8' font-size='11.5' fill='#2b2f36' font-weight='600' text-anchor='middle'>callbacks, success_callback,</text><text x='205.0' y='139.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>_async_success_callback, ...</text><rect x='56' y='178' width='298' height='70' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='205.0' y='208.8' font-size='11.5' fill='#2b2f36' font-weight='600' text-anchor='middle'>cache: Cache</text><text x='205.0' y='225.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>LLM response cache</text><rect x='56' y='264' width='298' height='70' rx='8' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='205.0' y='294.8' font-size='11.5' fill='#2b2f36' font-weight='600' text-anchor='middle'>drop_params, request_timeout,</text><text x='205.0' y='311.2' font-size='10' fill='#5b616b' font-weight='400' text-anchor='middle'>model_cost, any litellm_settings key</text><rect x='400' y='62' width='370' height='300' rx='12' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='1.2'/><text x='412.0' y='80.0' font-size='11.5' fill='#1d3f8f' font-weight='700' text-anchor='start'>proxy_server module globals   ·   1,029 imports from 230 files</text><rect x='416' y='90' width='338' height='27' rx='5' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='585.0' y='106.0' font-size='11' fill='#2b2f36' font-weight='600' text-anchor='middle'>llm_router: Router (+ Router.cache)</text><rect x='416' y='123' width='338' height='27' rx='5' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='585.0' y='139.0' font-size='11' fill='#2b2f36' font-weight='600' text-anchor='middle'>prisma_client</text><rect x='416' y='156' width='338' height='27' rx='5' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='585.0' y='172.0' font-size='11' fill='#2b2f36' font-weight='600' text-anchor='middle'>general_settings: SettingsStore</text><rect x='416' y='189' width='338' height='27' rx='5' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='585.0' y='205.0' font-size='11' fill='#2b2f36' font-weight='600' text-anchor='middle'>master_key, premium_user</text><rect x='416' y='222' width='338' height='27' rx='5' fill='#ffffff' stroke='#9aa1ab' stroke-width='1.4'/><text x='585.0' y='238.0' font-size='11' fill='#2b2f36' font-weight='600' text-anchor='middle'>user_api_key_cache: UserApiKeyCache</text><rect x='416' y='255' width='338' height='27' r