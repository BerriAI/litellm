<text class="mono center" x="172" y="170">{model_group}_map</text>
<rect class="box store" x="332" y="148" width="250" height="36" rx="6"/>
<text class="mono center" x="457" y="170">{model_group}_request_count:{id}</text>
<rect class="group" x="604" y="12" width="234" height="182" rx="8"/>
<text class="group-label" x="614" y="30">THIS PROCESS ONLY</text>
