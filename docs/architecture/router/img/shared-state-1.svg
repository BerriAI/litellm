<text class="small muted center" x="188" y="81">in-memory tier</text>
<path class="edge" d="M108,68 H135" marker-end="url(#arrow)"/>
<path class="edge" d="M188,93 V145" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
