<text class="mono title center" x="436" y="64">DualCache</text>
<text class="small muted center" x="436" y="81">in-memory tier</text>
<path class="edge" d="M356,68 H383" marker-end="url(#arrow)"/>
<path class="edge" d="M436,93 V145" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="group" x="516" y="14" width="232" height="92" rx="8"/>
<text class="group-label" x="528" y="32">PROXY WORKER 3</text>
<rect class="box core" x="528" y="44" width="76" height="48" rx="6"/>
<text class="title center" x="566" y="72">Router</text>
<rect class="box store" x="632" y="44" width="104" height="48" rx="6"/>
<text class="mono title center" x="684" y="64">DualCache</text>
<text class="small muted center" x="684" y="81">in-memory tier</text>
<path class="edge" d="M604,68 H631" marker-end="url(#arrow)"/>
<path class="edge" d="M684,93 V145" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="box store" x="32" y="146" width="704" height="50" rx="6"/>
<text class="title center" x="384" y="166">Redis</text>
<text class="small center" x="384" y="184">cooldowns, <tspan class="mono">allowed_fails</tspan> counters, tpm / rpm per minute, strategy state</text>
</svg>
