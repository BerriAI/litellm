<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" role="img" aria-labelledby="t">
<title id="t">A retry inside a model group, then a fallback out of it</title>
<desc>Inside each model group the strategy picks one deployment. The strategy picks D1 in gpt-4o, which returns 429 and cools down. The retry stays in gpt-4o, the strategy picks D3, and it also returns 429. The request falls back to opus, the strategy picks D5, and D5 returns 200 to the router.</desc>
<style>/* litellm architecture diagrams v1, from the litellm-docs Aurora theme (src/css/custom.css). Embed verbatim in every SVG. */
svg { --ink:#272b37; --text:#3a3e4b; --muted:#646875; --line:#a3a8ba; --rule:#e3e5ee; --card:#ffffff; --canvas:#f7f8fd; --accent:#0117be; --accent-bg:#f2f4fd; --accent-line:#b9c1f0; --host:#1f6fa8; --host-bg:#eaf5fd; --store:#6b3fb8; --store-bg:#efe8fb; --warn:#b42318; --warn-bg:#fdecea; --ok:#1a7f4b; --ok-bg:#e7f6ee; }
@media (prefers-color-scheme: dark) {
  svg { --ink:#ffffff; --text:#d6d4ea; --muted:#a6a4c6; --line:#5c6294; --rule:#1a1f45; --card:#0f1335; --canvas:#080b26; --accent:#9fabff; --accent-bg:#161b4a; --accent-line:#3d4790; --host:#7cc4f5; --host-bg:#0f2a44; --store:#c3a6f0; --store-bg:#23173f; --warn:#f19a9a; --warn-bg:#3a1622; --ok:#7ee2a8; --ok-bg:#0f2e25; }
}
text { font-family: Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: var(--text); }
.mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.title { font-weight: 600; fill: var(--ink); }
.small { font-size: 11.5px; }
.muted { fill: var(--muted); }
.accent { fill: var(--accent); }
.center { text-anchor: middle; }
.end { text-anchor: end; }
.canvas { fill: var(--canvas); stroke: var(--rule); stroke-width: 1; }
.box { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.box.core { fill: var(--accent-bg); stroke: var(--accent); }
.box.host { fill: var(--host-bg); stroke: var(--host); }
.box.store { fill: var(--store-bg); stroke: var(--store); }
.box.warn { fill: var(--warn-bg); stroke: var(--warn); }
.box.ok { fill: var(--ok-bg); stroke: var(--ok); }
.box.decision { fill: var(--card); stroke: var(--ink); }
.group { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
.group.core { stroke: var(--accent-line); }
.group-label { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: 0.06em; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.edge.strong { stroke: var(--ink); }
.edge.dashed { stroke-dasharray: 5 4; }
.edge.core { stroke: var(--accent); }
.edge.warn { stroke: var(--warn); }
.edge-label { font-size: 11.5px; fill: var(--muted); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.arrowhead { fill: var(--line); }
.arrowhead.strong { fill: var(--ink); }
.arrowhead.core { fill: var(--accent); }
.arrowhead.warn { fill: var(--warn); }
.lifeline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.note { fill: var(--accent-bg); stroke: var(--accent-line); stroke-width: 1; }
.step { fill: var(--accent); }
.step-text { font-size: 10.5px; font-weight: 600; fill: var(--card); text-anchor: middle; }</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="canvas" x="0.5" y="0.5" width="879" height="423" rx="8"/>
<circle class="box core" cx="80" cy="150" r="56"/>
<text class="title center" x="80" y="155">Router</text>
<rect class="group core" x="190" y="20" width="360" height="260" rx="8"/>
<text class="group-label" x="204" y="42">MODEL GROUP: GPT-4O</text>
<text class="edge-label end" x="536" y="42">retries stay in this group</text>
<rect class="group core" x="640" y="20" width="220" height="260" rx="8"/>
<text class="group-label" x="654" y="42">MODEL GROUP: OPUS</text>
<rect class="box decision" x="250" y="136" width="250" height="32" rx="16"/>
<text class="small center" x="375" y="156">strategy picks one deployment here</text>
<rect class="box decision" x="675" y="136" width="150" height="32" rx="16"/>
<text class="small center" x="750" y="156">strategy picks here</text>
<rect class="box warn" x="220" y="60" width="140" height="64" rx="6"/>
<text class="title center" x="290" y="87">D1</text>
<text class="small center" x="290" y="106">429, cools down</text>
<rect class="box" x="390" y="60" width="140" height="64" rx="6"/>
<text class="title center" x="460" y="97">D2</text>
<rect class="box warn" x="220" y="180" width="140" height="64" rx="6"/>
<text class="title center" x="290" y="207">D3</text>
<text class="small center" x="290" y="226">429</text>
<rect class="box" x="390" y="180" width="140" height="64" rx="6"/>
<text class="title center" x="460" y="217">D4</text>
<rect class="box ok" x="675" y="60" width="150" height="64" rx="6"/>
<text class="title center" x="750" y="87">D5</text>
<text class="small center" x="750" y="106">returns 200</text>
<rect class="box" x="675" y="180" width="150" height="64" rx="6"/>
<text class="title center" x="750" y="217">D6</text>
<path class="edge" d="M120,111 L218,76" marker-end="url(#arrow)"/>
<path class="edge" d="M220,108 L138,140" marker-end="url(#arrow)"/>
<path class="edge" d="M132,171 L218,196" marker-end="url(#arrow)"/>
<path class="edge" d="M220,228 L118,192" marker-end="url(#arrow)"/>
<text class="edge-label" x="186" y="177">retry</text>
<path class="edge" d="M550,150 H655 V92 H673" marker-end="url(#arrow)"/>
<text class="edge-label center" x="594" y="134">fallback</text>
<path class="edge" d="M825,92 H846 V296 H80 V208" marker-end="url(#arrow)"/>
<circle class="step" cx="169" cy="93" r="8"/>
<text class="step-text" x="169" y="96.5">1</text>
<circle class="step" cx="179" cy="124" r="8"/>
<text class="step-text" x="179" y="127.5">2</text>
<circle class="step" cx="175" cy="183" r="8"/>
<text class="step-text" x="175" y="186.5">3</text>
<circle class="step" cx="169" cy="210" r="8"/>
<text class="step-text" x="169" y="213.5">4</text>
<circle class="step" cx="594" cy="150" r="8"/>
<text class="step-text" x="594" y="153.5">5</text>
<circle class="step" cx="655" cy="118" r="8"/>
<text class="step-text" x="655" y="121.5">6</text>
<circle class="step" cx="460" cy="296" r="8"/>
<text class="step-text" x="460" y="299.5">7</text>
<circle class="step" cx="36" cy="330" r="8"/>
<text class="step-text" x="36" y="333.5">1</text>
<text class="small" x="52" y="334">The strategy picks D1 from gpt-4o, and the router calls it</text>
<circle class="step" cx="36" cy="356" r="8"/>
<text class="step-text" x="36" y="359.5">2</text>
<text class="small" x="52" y="360">D1 returns 429, so it goes into cooldown</text>
<circle class="step" cx="36" cy="382" r="8"/>
<text class="step-text" x="36" y="385.5">3</text>
<text class="small" x="52" y="386">Retry in the same group: the strategy picks again and gets D3</text>
<circle class="step" cx="36" cy="408" r="8"/>
<text class="step-text" x="36" y="411.5">4</text>
<text class="small" x="52" y="412">D3 returns 429, and the retries are spent</text>
<circle class="step" cx="460" cy="330" r="8"/>
<text class="step-text" x="460" y="333.5">5</text>
<text class="small" x="476" y="334">Fallback: the request moves to model group opus</text>
<circle class="step" cx="460" cy="356" r="8"/>
<text class="step-text" x="460" y="359.5">6</text>
<text class="small" x="476" y="360">The strategy picks D5 from opus, and the router calls it</text>
<circle class="step" cx="460" cy="382" r="8"/>
<text class="step-text" x="460" y="385.5">7</text>
<text class="small" x="476" y="386">D5 returns 200, which goes back to the caller</text>
</svg>
