suite: retired Lens configuration
templates:
  - deployment.yaml
  - configmap-litellm.yaml
tests:
  - it: renders deployment.yaml with ignored lens.enabled and no Lens secret references
    template: deployment.yaml
    set:
      lens.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_LENS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENS_GATEWAY_SECRET
          any: true
  - it: renders deployment.yaml with ignored lensWorker.enabled and no Lens secret references
    template: deployment.yaml
    set:
      lensWorker.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_LENS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENS_GATEWAY_SECRET
          any: true
