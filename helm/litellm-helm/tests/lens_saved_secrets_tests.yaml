suite: Lens preserves credentials across Helm upgrades
templates:
  - lens/secrets.yaml
set:
  fullnameOverride: lens-test
  lensWorker.enabled: true
release:
  namespace: lens
  name: lens-test
  upgrade: true
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: lens-test-lens-gateway
        namespace: lens
      data:
        gateway-secret: c2F2ZWQtc2lnbmluZy1rZXk=
    - apiVersion: v1
      kind: Secret
      metadata:
        name: lens-test-lens-service
        namespace: lens
      data:
        service-token: c2F2ZWQtc2VydmljZS10b2tlbg==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: lens-test-lens-clickhouse
        namespace: lens
      data:
        password: c2F2ZWQtZGF0YWJhc2UtcGFzc3dvcmQ=
tests:
  - it: preserves the separate signing credential across upgrades
    documentSelector: {path: metadata.name, value: lens-test-lens-gateway}
    asserts:
      - equal:
          path: data.gateway-secret
          value: c2F2ZWQtc2lnbmluZy1rZXk=
      - notExists: {path: data.service-token}
  - it: reuses the service credential instead of breaking running services
    documentIndex: 0
    asserts:
      - equal:
          path: data.service-token
          value: c2F2ZWQtc2VydmljZS10b2tlbg==
  - it: reuses the database password instead of locking out stored traces
    documentIndex: 1
    asserts:
      - equal:
          path: data.password
          value: c2F2ZWQtZGF0YWJhc2UtcGFzc3dvcmQ=
