suite: reliability controls and separate metrics server
templates:
  - configmap-litellm.yaml
  - deployment.yaml
  - service.yaml
  - service-metrics.yaml
  - servicemonitor.yaml
tests:
  - it: should leave the rendered config untouched when no reliability value is set
    template: configmap-litellm.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: litellm_settings
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: router_settings

  - it: should render the reliability values under litellm_settings and router_settings
    template: configmap-litellm.yaml
    set:
      reliability.sseKeepalivePingIntervalSeconds: 20
      reliability.anthropicSsePingIntervalSeconds: 10
      reliability.enablePreCallChecks: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "litellm_settings:\n  anthropic_sse_ping_interval_seconds: 10\n  sse_keepalive_ping_interval_seconds: 20\n"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "router_settings:\n  enable_pre_call_checks: true\n"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "master_key: os.environ/PROXY_MASTER_KEY"

  - it: should merge into existing litellm_settings and router_settings without dropping user keys
    template: configmap-litellm.yaml
    set:
      reliability.sseKeepalivePingIntervalSeconds: 20
      reliability.enablePreCallChecks: true
      proxy_config.litellm_settings.drop_params: true
      proxy_config.router_settings.routing_strategy: simple-shuffle
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "litellm_settings:\n  drop_params: true\n  sse_keepalive_ping_interval_seconds: 20\n"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "router_settings:\n  enable_pre_call_checks: true\n  routing_strategy: simple-shuffle\n"

  - it: should let an explicit proxy_config key win over the reliability value
    template: configmap-litellm.yaml
    set:
      reliability.sseKeepalivePingIntervalSeconds: 20
      reliability.enablePreCallChecks: true
      proxy_config.litellm_settings.sse_keepalive_ping_interval_seconds: 7
      proxy_config.router_settings.enable_pre_call_checks: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sse_keepalive_ping_interval_seconds: 7\n"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enable_pre_call_checks: false\n"

  - it: should render enablePreCallChecks false when set explicitly
    template: configmap-litellm.yaml
    set:
      reliability.enablePreCallChecks: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "router_settings:\n  enable_pre_call_checks: false\n"

  - it: should not expose a metrics port or PROMETHEUS_METRICS_PORT by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
          any: true
        template: deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROMETHEUS_METRICS_PORT
          any: true
        template: deployment.yaml
      - lengthEqual:
          path: spec.ports
          count: 1
        template: service.yaml
      - hasDocuments:
          count: 0
        template: service-metrics.yaml

  - it: should scrape the proxy port when the metrics server is disabled
    template: servicemonitor.yaml
    set:
      serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: http

  - it: should wire the separate metrics server through container, a ClusterIP metrics service and servicemonitor
    set:
      metricsServer.enabled: true
      metricsServer.port: 4101
      serviceMonitor.enabled: true
      service.type: LoadBalancer
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROMETHEUS_METRICS_PORT
            value: "4101"
        template: deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 4101
            protocol: TCP
        template: deployment.yaml
      - lengthEqual:
          path: spec.ports
          count: 1
        template: service.yaml
      - equal:
          path: spec.type
          value: LoadBalancer
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-litellm-metrics
        template: service-metrics.yaml
      - equal:
          path: spec.type
          value: ClusterIP
        template: service-metrics.yaml
      - equal:
          path: spec.ports
          value:
            - port: 4101
              targetPort: metrics
              protocol: TCP
              name: metrics
        template: service-metrics.yaml
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: RELEASE-NAME
        template: service-metrics.yaml
      - equal:
          path: spec.endpoints[0].port
          value: metrics
        template: servicemonitor.yaml
      - equal:
          path: spec.endpoints[0].path
          value: /metrics/
        template: servicemonitor.yaml

  - it: should reject a metrics port equal to the proxy port
    template: deployment.yaml
    set:
      metricsServer.enabled: true
      metricsServer.port: 4000
    asserts:
      - failedTemplate:
          errorMessage: metricsServer.port must differ from service.port
