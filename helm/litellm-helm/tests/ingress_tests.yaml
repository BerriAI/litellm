suite: Ingress Configuration Tests
templates:
  - ingress.yaml
tests:
  - it: should not create Ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create Ingress when enabled
    set:
      ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress

  - it: should add the default nginx proxy timeout annotations
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          value: "600"
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-send-timeout"]
          value: "600"

  - it: should add the default ALB idle timeout annotation
    set:
      ingress.enabled: true
      ingress.className: alb
    asserts:
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/load-balancer-attributes"]
          value: idle_timeout.timeout_seconds=600

  - it: should preserve user-supplied timeout annotations
    set:
      ingress.enabled: true
      ingress.annotations:
        alb.ingress.kubernetes.io/load-balancer-attributes: "idle_timeout.timeout_seconds=120,routing.http2.enabled=true"
      ingress.className: alb
    asserts:
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/load-balancer-attributes"]
          value: idle_timeout.timeout_seconds=120,routing.http2.enabled=true

  - it: should omit timeout annotations when idle timeout is zero
    set:
      ingress.enabled: true
      ingress.idleTimeoutSeconds: 0
    asserts:
      - notExists:
          path: metadata.annotations["alb.ingress.kubernetes.io/load-balancer-attributes"]
      - notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
      - notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-send-timeout"]

  - it: should add custom labels
    set:
      ingress.enabled: true
      ingress.labels:
        custom-label: "true"
        another-label: "value"
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.labels.custom-label
          value: "true"
      - equal:
          path: metadata.labels.another-label
          value: "value"

  - it: should add annotations
    set:
      ingress.enabled: true
      ingress.annotations:
        kubernetes.io/ingress.class: "nginx"
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.class"]
          value: "nginx"
