{{- if .Values.lensWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.fullname" . }}-lens-worker
  labels:
    {{- include "litellm.lensWorker.labels" . | nindent 4 }}
    app.kubernetes.io/component: lens-worker
spec:
  replicas: {{ .Values.lensWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: lens-worker
  template:
    metadata:
      labels:
        {{- include "litellm.lensWorker.labels" . | nindent 8 }}
        app.kubernetes.io/component: lens-worker
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lens-worker
          image: {{ include "litellm.lensWorker.image" . | quote }}
          imagePullPolicy: {{ .Values.lensWorker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: LITELLM_URL
              value: {{ .Values.lensWorker.url | default (printf "http://%s:%v" (include "litellm.backend.fullname" .) .Values.backend.service.port) | quote }}
            - name: LITELLM_LENS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "litellm.lensWorker.serviceTokenSecretName" . | quote }}
                  key: {{ .Values.lensWorker.serviceTokenSecret.key | quote }}
            {{- if include "litellm.lensWorker.bundledClickhouse" . }}
            - name: CLICKHOUSE_HOST
              value: {{ include "litellm.lensWorker.clickhouseName" . | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "litellm.lensWorker.clickhouseName" . | quote }}
                  key: password
            {{- else }}
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "lensWorker.clickhouseSecret.name is required" .Values.lensWorker.clickhouseSecret.name | quote }}
                  key: {{ .Values.lensWorker.clickhouseSecret.key | quote }}
            {{- end }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.lensWorker.clickhouseDatabase | quote }}
            - name: AGENT_TRACING_RETENTION_DAYS
              value: {{ .Values.lensWorker.retentionDays | quote }}
            {{- if .Values.lensWorker.tokenSecret.name }}
            - name: LENS_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lensWorker.tokenSecret.name | quote }}
                  key: {{ .Values.lensWorker.tokenSecret.key | quote }}
            {{- end }}
          ports:
            - name: otlp
              containerPort: 4318
          livenessProbe:
            httpGet:
              path: /health/live
              port: otlp
          readinessProbe:
            httpGet:
              path: /health/ready
              port: otlp
          resources:
            {{- toYaml .Values.lensWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.lensWorker.tmpSizeLimit }}
      {{- with .Values.lensWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lensWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lensWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
