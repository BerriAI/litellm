{{- if and .Values.masterKey.generate (not .Values.masterKey.secretName) }}
{{- $name := include "litellm.masterKey.generatedSecretName" . }}
{{- $key := .Values.masterKey.secretKey | default "master-key" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $value = index $existing.data $key | b64dec }}
{{- else }}
{{- $value = printf "sk-%s" (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "litellm.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
