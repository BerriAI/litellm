{{- if .Values.gateway.enabled }}
{{- include "litellm.gateway.renderPerWorkload" (dict "root" $ "template" "litellm.gateway.service") }}
{{- end }}

{{- define "litellm.gateway.service" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm.gateway.fullname" . }}
  labels:
    {{- include "litellm.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "litellm.gateway.selectorLabels" . | nindent 4 }}
{{- end -}}
