{{- if .Values.gateway.config.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm.gateway.fullname" . }}-config
  {{- with .Values.gateway.config.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
{{ .Values.gateway.config.proxy_config | toYaml | indent 6 }}
{{- end }}
