{{- if .Values.gateway.enabled }}
{{- include "litellm.gateway.renderPerWorkload" (dict "root" $ "template" "litellm.gateway.serviceMetrics") }}
{{- end }}

{{- define "litellm.gateway.serviceMetrics" -}}
{{- if .Values.gateway.metricsServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm.gateway.fullname" . }}-metrics
  labels:
    {{- include "litellm.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.metricsServer.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "litellm.gateway.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end -}}
