{{- if include "litellm.backend.render" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.backend.fullname" . }}
  labels:
    {{- include "litellm.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.backend.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.backend.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and (not .Values.backend.hpa.enabled) (not (kindIs "invalid" .Values.backend.replicaCount)) }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  {{- $minReady := .Values.backend.minReadySeconds }}
  {{- if not (or (kindIs "invalid" $minReady) (eq (printf "%v" $minReady) "")) }}
  minReadySeconds: {{ $minReady }}
  {{- end }}
  {{- with .Values.backend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "litellm.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.gateway.config.create .Values.backend.podAnnotations }}
      annotations:
        {{- if .Values.gateway.config.create }}
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "litellm.backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- include "litellm.podLabels" (dict "podLabels" . "componentName" "backend") | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "litellm.backend.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.backend.automount }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.extraInitContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "litellm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - backend
            - --host
            - 0.0.0.0
            - --port
            - "4001"
          ports:
            - name: http
              containerPort: 4001
              protocol: TCP
          env:
            {{- include "litellm.lensConnectionEnv" . | nindent 12 }}
            {{- include "litellm.masterKeyEnv" $ | nindent 12 }}
            {{- include "litellm.liteadminEnv" (dict "root" $ "component" .Values.backend) | nindent 12 }}
            {{- include "litellm.serverEnv" (dict "root" $ "component" .Values.backend) | nindent 12 }}
            {{- if .Values.gateway.config.create }}
            - name: CONFIG_FILE_PATH
              value: /app/config/config.yaml
            {{- end }}
            {{- if .Values.billingMetrics.enabled }}
            {{- include "litellm.billingMetricsEnv" . | nindent 12 }}
            {{- end }}
          {{- include "litellm.envFrom" .Values.backend | nindent 10 }}
          {{- if or .Values.gateway.config.create .Values.backend.volumeMounts .Values.billingMetrics.enabled }}
          volumeMounts:
            {{- if .Values.gateway.config.create }}
            - name: gateway-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
            {{- end }}
            {{- if .Values.billingMetrics.enabled }}
            {{- include "litellm.billingMetricsVolumeMounts" . | nindent 12 }}
            {{- end }}
            {{- with .Values.backend.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- if or .Values.gateway.config.create .Values.backend.volumes .Values.billingMetrics.enabled }}
      volumes:
        {{- if .Values.gateway.config.create }}
        - name: gateway-config
          configMap:
            name: {{ include "litellm.workload.fullname" . }}-config
        {{- end }}
        {{- if .Values.billingMetrics.enabled }}
        {{- include "litellm.billingMetricsVolumes" . | nindent 8 }}
        {{- end }}
        {{- with .Values.backend.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $gracePeriod := .Values.backend.terminationGracePeriodSeconds }}
      {{- if not (or (kindIs "invalid" $gracePeriod) (eq (printf "%v" $gracePeriod) "")) }}
      terminationGracePeriodSeconds: {{ $gracePeriod }}
      {{- end }}
{{- end }}
