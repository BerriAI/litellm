suite: test gateway configmap
templates:
  - gateway/configmap.yaml
values:
  - ./values/required.yaml
tests:
  - it: should render no labels or annotations by default
    asserts:
      - isKind:
          of: ConfigMap
      - notExists:
          path: metadata.labels
      - notExists:
          path: metadata.annotations
  - it: should add the configured labels and annotations
    set:
      gateway:
        config:
          create: true
          labels:
            vault-injection: enabled
          annotations:
            vault.security.banzaicloud.io/vault-role: vault-injector
            vault.security.banzaicloud.io/vault-skip-verify: "true"
    asserts:
      - equal:
          path: metadata.labels
          value:
            vault-injection: enabled
      - equal:
          path: metadata.annotations
          value:
            vault.security.banzaicloud.io/vault-role: vault-injector
            vault.security.banzaicloud.io/vault-skip-verify: "true"
      - exists:
          path: data["config.yaml"]
  - it: should render no ConfigMap when create is false, even with labels set
    set:
      gateway:
        config:
          create: false
          labels:
            vault-injection: enabled
    asserts:
      - hasDocuments:
          count: 0
