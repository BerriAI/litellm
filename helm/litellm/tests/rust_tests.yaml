suite: Rust switch
templates:
  - gateway/deployment.yaml
  - gateway/configmap.yaml
values:
  - ./values/required.yaml
tests:
  - it: leaves LITELLM_RUST unset by default
    template: gateway/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_RUST
          any: true
  - it: sets LITELLM_RUST to false
    template: gateway/deployment.yaml
    set:
      gateway.rust.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_RUST
            value: "false"
  - it: sets LITELLM_RUST to true
    template: gateway/deployment.yaml
    set:
      gateway.rust.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_RUST
            value: "true"
  - it: keeps LITELLM_RUST off the collector sidecar
    template: gateway/deployment.yaml
    set:
      gateway.rust.enabled: true
      gateway.collector.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: collector
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: LITELLM_RUST
          any: true
  - it: lets extraEnv override the value
    template: gateway/deployment.yaml
    set:
      gateway.rust.enabled: true
      gateway.extraEnv:
        - name: LITELLM_RUST
          value: "false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_RUST
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_RUST
            value: "true"
  - it: rejects a value that is not a boolean
    template: gateway/deployment.yaml
    set:
      gateway.rust.enabled: "yes"
    asserts:
      - failedTemplate: {}
