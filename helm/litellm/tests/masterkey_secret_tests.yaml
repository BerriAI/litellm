suite: test the generated master key Secret
templates:
  - secret-masterkey.yaml
  - gateway/deployment.yaml
  - gateway/configmap.yaml
  - monolith/deployment.yaml
  - migrations-job.yaml
values:
  - ./values/required.yaml
tests:
  - it: renders no Secret when the operator supplies masterKey.secretName
    template: secret-masterkey.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses to render the workload without a Secret name when masterKey.generate is off
    set:
      masterKey.secretName: ""
    template: gateway/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: masterKey.secretName is required

  - it: generates a Secret whose key starts with sk- (base64 c2st) and keeps it across uninstall
    set:
      masterKey.secretName: ""
      masterKey.generate: true
    template: secret-masterkey.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-litellm-masterkey
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data["master-key"]
          pattern: ^c2st

  - it: stores the value under masterKey.secretKey
    set:
      masterKey.secretName: ""
      masterKey.generate: true
      masterKey.secretKey: LITELLM_MASTER_KEY
    template: secret-masterkey.yaml
    asserts:
      - matchRegex:
          path: data.LITELLM_MASTER_KEY
          pattern: ^c2st

  - it: reuses the master key already stored in the cluster instead of generating a new one on upgrade
    set:
      masterKey.secretName: ""
      masterKey.generate: true
    template: secret-masterkey.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-litellm-masterkey
            namespace: NAMESPACE
          data:
            master-key: c2stZXhpc3Rpbmcta2V5
    asserts:
      - equal:
          path: data["master-key"]
          value: c2stZXhpc3Rpbmcta2V5

  - it: points the app containers at the generated Secret and keeps it out of the pre-install migrations Job
    set:
      masterKey.secretName: ""
      masterKey.generate: true
      monolith.enabled: true
    templates:
      - monolith/deployment.yaml
      - migrations-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-litellm-masterkey
                key: master-key
        template: monolith/deployment.yaml
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
        template: migrations-job.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_MASTER_KEY
          any: true
        template: migrations-job.yaml

  - it: an explicit masterKey.secretName wins over masterKey.generate
    set:
      masterKey.secretName: operator-secret
      masterKey.generate: true
    templates:
      - secret-masterkey.yaml
      - gateway/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: secret-masterkey.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: operator-secret
                key: master-key
        template: gateway/deployment.yaml
