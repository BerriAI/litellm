suite: retired Lens configuration
templates:
  - gateway/deployment.yaml
  - backend/deployment.yaml
  - gateway/configmap.yaml
values:
  - ./values/required.yaml
tests:
  - it: renders gateway/deployment.yaml with ignored lens.enabled and no Lens secret references
    template: gateway/deployment.yaml
    set:
      lens.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_LENS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENS_GATEWAY_SECRET
          any: true
  - it: renders gateway/deployment.yaml with ignored lensWorker.enabled and no Lens secret references
    template: gateway/deployment.yaml
    set:
      lensWorker.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_LENS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENS_GATEWAY_SECRET
          any: true
  - it: renders backend/deployment.yaml with ignored lens.enabled and no Lens secret references
    template: backend/deployment.yaml
    set:
      lens.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_LENS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENS_GATEWAY_SECRET
          any: true
  - it: renders backend/deployment.yaml with ignored lensWorker.enabled and no Lens secret references
    template: backend/deployment.yaml
    set:
      lensWorker.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_LENS_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LENS_GATEWAY_SECRET
          any: true
