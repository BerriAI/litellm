suite: test gateway HPA per-pod requests-per-second and tokens-per-second targets
templates:
  - gateway/hpa.yaml
  - gateway/servicemonitor.yaml
values:
  - ./values/required.yaml
tests:
  - it: scales on CPU and memory only by default
    template: gateway/hpa.yaml
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 80

  - it: adds a requests-per-second Pods metric next to the resource metrics
    template: gateway/hpa.yaml
    set:
      gateway.hpa.targetRequestsPerSecond: 90
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 3
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
      - equal:
          path: spec.metrics[2]
          value:
            type: Pods
            pods:
              metric:
                name: litellm_requests_per_second
              target:
                type: AverageValue
                averageValue: "90"
      - notContains:
          path: spec.metrics
          content:
            type: Pods
            pods:
              metric:
                name: litellm_tokens_per_second
          any: true

  - it: adds a tokens-per-second Pods metric on its own
    template: gateway/hpa.yaml
    set:
      gateway.hpa.targetTokensPerSecond: 6M
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 3
      - equal:
          path: spec.metrics[2]
          value:
            type: Pods
            pods:
              metric:
                name: litellm_tokens_per_second
              target:
                type: AverageValue
                averageValue: "6M"
      - notContains:
          path: spec.metrics
          content:
            type: Pods
            pods:
              metric:
                name: litellm_requests_per_second
          any: true

  - it: renders requests and tokens targets together and keeps CPU and memory
    template: gateway/hpa.yaml
    set:
      gateway.hpa.targetRequestsPerSecond: 90
      gateway.hpa.targetTokensPerSecond: 6000000
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 4
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[1].resource.name
          value: memory
      - equal:
          path: spec.metrics[2].pods.metric.name
          value: litellm_requests_per_second
      - equal:
          path: spec.metrics[3].pods.metric.name
          value: litellm_tokens_per_second
      - equal:
          path: spec.metrics[3].pods.target.averageValue
          value: "6000000"

  - it: scales on workload metrics alone when the resource targets are cleared
    template: gateway/hpa.yaml
    set:
      gateway.hpa.targetCPUUtilizationPercentage: null
      gateway.hpa.targetMemoryUtilizationPercentage: null
      gateway.hpa.targetRequestsPerSecond: 90
      gateway.hpa.targetTokensPerSecond: 6000000
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - notContains:
          path: spec.metrics
          content:
            type: Resource
          any: true
      - equal:
          path: spec.metrics[0].pods.metric.name
          value: litellm_requests_per_second
      - equal:
          path: spec.metrics[1].pods.metric.name
          value: litellm_tokens_per_second
      - notMatchRegexRaw:
          pattern: per_minute

  - it: ignores the per-minute keys, which the chart never shipped
    template: gateway/hpa.yaml
    set:
      gateway.hpa.targetRequestsPerMinute: 5400
      gateway.hpa.targetTokensPerMinute: 360000000
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - notContains:
          path: spec.metrics
          content:
            type: Pods
          any: true

  - it: renders no ServiceMonitor by default
    template: gateway/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses a ServiceMonitor without the metrics server, whose http port needs a bearer token
    template: gateway/servicemonitor.yaml
    set:
      gateway.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: gateway.serviceMonitor.enabled requires gateway.metricsServer.enabled

  - it: scrapes each gateway pod through the metrics port
    template: gateway/servicemonitor.yaml
    release:
      name: rel
      namespace: llm
    set:
      gateway.serviceMonitor.enabled: true
      gateway.metricsServer.enabled: true
      gateway.serviceMonitor.labels:
        release: kube-prometheus-stack
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: gateway
      - equal:
          path: spec.namespaceSelector.matchNames
          value:
            - llm
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              path: /metrics/
              interval: 15s
              scrapeTimeout: 10s
              scheme: http

  - it: carries litellm-helm annotations, relabelings and namespaceSelector onto the ServiceMonitor
    template: gateway/servicemonitor.yaml
    release:
      namespace: llm
    set:
      gateway.serviceMonitor.enabled: true
      gateway.metricsServer.enabled: true
      gateway.serviceMonitor.annotations:
        team: platform
      gateway.serviceMonitor.relabelings:
        - targetLabel: node
          sourceLabels: [__meta_kubernetes_pod_node_name]
          action: replace
      gateway.serviceMonitor.namespaceSelector.matchNames:
        - llm
        - shared
    asserts:
      - equal:
          path: metadata.annotations
          value:
            team: platform
      - equal:
          path: spec.endpoints[0].relabelings
          value:
            - targetLabel: node
              sourceLabels: [__meta_kubernetes_pod_node_name]
              action: replace
      - equal:
          path: spec.namespaceSelector.matchNames
          value:
            - llm
            - shared

  - it: renders no ServiceMonitor annotations or relabelings by default
    template: gateway/servicemonitor.yaml
    set:
      gateway.serviceMonitor.enabled: true
      gateway.metricsServer.enabled: true
    asserts:
      - notExists:
          path: metadata.annotations
      - notExists:
          path: spec.endpoints[0].relabelings

  - it: honours a custom scrape interval
    template: gateway/servicemonitor.yaml
    set:
      gateway.serviceMonitor.enabled: true
      gateway.serviceMonitor.interval: 30s
      gateway.metricsServer.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 30s

  - it: should configure bearer authorization from an existing secret
    template: gateway/servicemonitor.yaml
    set:
      gateway.serviceMonitor.enabled: true
      gateway.serviceMonitor.scheme: https
      gateway.serviceMonitor.tlsConfig:
        serverName: litellm.monitoring.svc
        ca:
          secret:
            name: metrics-ca
            key: ca.crt
      gateway.serviceMonitor.authSecret.enabled: true
      gateway.serviceMonitor.authSecret.name: prometheus-litellm-key
      gateway.serviceMonitor.authSecret.key: token
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].scheme
          value: https
      - equal:
          path: spec.endpoints[0].tlsConfig
          value:
            serverName: litellm.monitoring.svc
            ca:
              secret:
                name: metrics-ca
                key: ca.crt
      - equal:
          path: spec.endpoints[0].authorization
          value:
            credentials:
              name: prometheus-litellm-key
              key: token
      - isNull:
          path: spec.endpoints[0].bearerTokenSecret

  - it: should reject an enabled authorization secret without a name
    template: gateway/servicemonitor.yaml
    set:
      gateway.serviceMonitor.enabled: true
      gateway.serviceMonitor.scheme: https
      gateway.serviceMonitor.authSecret.enabled: true
      gateway.serviceMonitor.authSecret.key: token
    asserts:
      - failedTemplate:
          errorMessage: gateway.serviceMonitor.authSecret.name is required when gateway.serviceMonitor.authSecret.enabled is true

  - it: should reject an enabled authorization secret without a key
    template: gateway/servicemonitor.yaml
    set:
      gateway.serviceMonitor.enabled: true
      gateway.serviceMonitor.scheme: https
      gateway.serviceMonitor.authSecret.enabled: true
      gateway.serviceMonitor.authSecret.name: prometheus-litellm-key
    asserts:
      - failedTemplate:
          errorMessage: gateway.serviceMonitor.authSecret.key is required when gateway.serviceMonitor.authSecret.enabled is true

  - it: should reject authenticated scrapes over HTTP
    template: gateway/servicemonitor.yaml
    set:
      gateway.serviceMonitor.enabled: true
      gateway.serviceMonitor.authSecret.enabled: true
      gateway.serviceMonitor.authSecret.name: prometheus-litellm-key
      gateway.serviceMonitor.authSecret.key: token
    asserts:
      - failedTemplate:
          errorMessage: gateway.serviceMonitor.scheme must be https when gateway.serviceMonitor.authSecret.enabled is true
