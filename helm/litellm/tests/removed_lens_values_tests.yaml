suite: removed lens values
templates:
  - NOTES.txt
values:
  - ./values/required.yaml
tests:
  - it: warns that lens values are ignored
    set:
      lens.enabled: true
      lens.url: http://lens.lens.svc:4318
    asserts:
      - matchRegexRaw:
          pattern: lens and lensWorker values are ignored
  - it: stays quiet without lens values
    asserts:
      - notMatchRegexRaw:
          pattern: lensWorker
