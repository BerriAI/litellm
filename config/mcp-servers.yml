mcp_servers:
  google_drive:
    transport: stdio
    command: /usr/bin/node
    args:
      - /app/mcp/google-drive-mcp/dist/index.js
    env:
      GOOGLE_DRIVE_MCP_CLIENT_ID: os.environ/GOOGLE_DRIVE_MCP_CLIENT_ID
      GOOGLE_DRIVE_MCP_CLIENT_SECRET: os.environ/GOOGLE_DRIVE_MCP_CLIENT_SECRET
      GOOGLE_DRIVE_MCP_ACCESS_TOKEN: os.environ/GOOGLE_DRIVE_MCP_ACCESS_TOKEN
      GOOGLE_DRIVE_MCP_REFRESH_TOKEN: os.environ/GOOGLE_DRIVE_MCP_REFRESH_TOKEN
    allowed_tools:
      - search
      - listFolder
      - createFolder
      - createTextFile
      - readTextFile
      - copyFile
      - getFileMetadata
      - readGoogleDoc
      - createGoogleDoc
      - getGoogleDocContent
      - appendToDoc
      - insertTextInDoc
      - readGoogleSheet
      - createGoogleSheet
      - getGoogleSheetContent
      - createGoogleSlides
