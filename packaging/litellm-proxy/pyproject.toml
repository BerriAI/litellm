[project]
name = "litellm-proxy"
version = "1.109.0"
description = "Opt-in Rust HTTP forwarding server for the LiteLLM Python proxy"
requires-python = ">=3.10, <3.16"
license = "MIT"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../litellm-rust/crates/gateway/Cargo.toml"
bindings = "bin"
targets = [{ name = "litellm-gateway", kind = "bin" }]
profile = "release"
editable-profile = "dev"
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "model_prices_and_context_window.json", format = "sdist" },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "setup.cfg" },
    { dir = "src" },
    { env = "MATURIN_PEP517_ARGS" },
]
