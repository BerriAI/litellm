- model_name: roi-sonnet-opus-validation-regret-0
  litellm_params:
    model: auto_router/complexity_router
    complexity_router_config:
      classifier_type: capability
      classifier_llm_config:
        model: router-judge
        timeout_ms: 30000
        reasoning_effort: low
      tiers:
        SIMPLE:
        - claude-sonnet-5
        REASONING:
        - claude-opus-5
      adaptive: false
      route_housekeeping_to_cheapest_tier: false
      escalation_keywords: []
      plan_mode_min_tier: null
      enable_context_window_escalation: false
      return_raw_model_name: true
      max_tokens_from_tier_model: false
      capability_classifier_config:
        efficient_tier: SIMPLE
        capable_tier: REASONING
        max_output_tokens: 2048
        base_threshold: 0.5
        threshold_step: 0.0
        card:
          version: roi-20260914-cap_sonnet_opus_trained_card
          text: '- SUP-1 [supported]: A bounded transformation has explicit inputs,
            outputs and accessible checks covering its material requirements; merely
            mentioning tests does not establish coverage.

            - SUP-2 [supported]: Relevant repository state can be inspected and a
            localized repair mechanism can be verified; repository size, familiar
            terminology and file count are not difficulty proxies.

            - SUP-3 [supported]: Numerical or typed behavior has explicit interfaces,
            edge cases and tolerances, and the solver can validate the core computation;
            a test harness does not solve an unknown algorithm.

            - SUP-4 [supported]: The failure mechanism and search boundary are supplied
            or readily inspectable, and the requested change fits the configured solver;
            multiple mechanical edits need not require stronger reasoning.

            - SUP-5 [supported]: Behavioral reproduction has an accessible executable
            reference or complete specification covering edge cases; hidden grading
            alone is not such a reference.

            - UNC-1 [uncertain]: Material semantic choices or interacting invariants
            remain unresolved, so several plausible implementations could differ in
            correctness.

            - UNC-2 [uncertain]: The task requires completeness across coupled paths,
            asynchronous state, schemas or compatibility surfaces without a clear
            search boundary or sufficient visible coverage.

            - LIM-1 [unsupported]: Exact information must be recovered from noisy
            visual or temporal media without an available reliable extraction mechanism.

            - LIM-2 [unsupported]: Success requires inaccessible reference behavior,
            undocumented state or unknown configuration. Such obstacles may defeat
            either solver; unsupported does not imply capable success.


            Configured solver: Claude Sonnet 5 at high effort is a general coding
            solver. Evaluate its fit to the actual mechanism and scope. Clear instructions
            and runnable tests help, but do not establish complete coverage or guarantee
            success. Large repository size alone is not difficult scope. Public research
            does not establish a universal Sonnet advantage for a task family.

            Training evidence: 83 distinct DeepSWE tasks, repeated attempts averaged
            within task; mean success 0.461. go: 23 tasks, success estimate shrunk
            toward the overall mean 0.425. python: 27 tasks, success estimate shrunk
            toward the overall mean 0.477. rust: 5 tasks, success estimate shrunk
            toward the overall mean 0.437. typescript: 25 tasks, success estimate
            shrunk toward the overall mean 0.483. These are task-family priors from
            a different budget/configuration, not the probability for this request.
            Use visible demands to update them. Do not identify or recall a benchmark
            task or its published answer.

            Harness: mini-SWE-agent 2.0.0, Linux shell, repository inspection and
            edits, existing tests and self-written reproductions; one fresh attempt,
            high native reasoning effort, 150 model calls and USD 5 inference limit.
            Final hidden tests are unavailable to the solver. No retry or inherited
            patch from another model.'
          empirical: true
