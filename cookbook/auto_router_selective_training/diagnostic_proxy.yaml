model_list:
- model_name: router-judge
  litellm_params:
    model: openai/openai/gpt-5.6-luna
    api_base: os.environ/ROI_GATEWAY_BASE_URL
    api_key: os.environ/ROI_GATEWAY_API_KEY
    reasoning_effort: low
- model_name: gpt-5.6-luna
  litellm_params:
    model: openai/openai/gpt-5.6-luna
    api_base: os.environ/ROI_GATEWAY_BASE_URL
    api_key: os.environ/ROI_GATEWAY_API_KEY
    reasoning_effort: high
- model_name: gpt-5.6-sol
  litellm_params:
    model: openai/openai/gpt-5.6-sol
    api_base: os.environ/ROI_GATEWAY_BASE_URL
    api_key: os.environ/ROI_GATEWAY_API_KEY
    reasoning_effort: high
- model_name: selective-v3-diagnostic-empirical-upfront-benefit-per-dollar
  litellm_params:
    model: auto_router/complexity_router
    complexity_router_config:
      classifier_type: llm_v2
      classifier_llm_config: &id001
        model: router-judge
        timeout_ms: 30000
        reasoning_effort: low
      tiers: &id002
        SIMPLE:
        - gpt-5.6-luna
        REASONING:
        - gpt-5.6-sol
      adaptive: false
      route_housekeeping_to_cheapest_tier: false
      escalation_keywords: &id003 []
      plan_mode_min_tier: null
      enable_context_window_escalation: false
      return_raw_model_name: true
      max_tokens_from_tier_model: false
      llm_v2_config:
        efficient_tier: SIMPLE
        capable_tier: REASONING
        efficient_profile: 'General coding model: gpt-5.6-luna, high reasoning effort.'
        capable_profile: 'General coding model: gpt-5.6-sol, high reasoning effort.'
        harness: One fresh attempt at high reasoning effort, maximum 8192 completion tokens per response. Hidden
          tests, reference solutions and previous model attempts are unavailable. mini-swe-agent 2.0.0 with a Linux
          shell, local inspection, edits and tests; 150 model calls and USD 5 inference limit. The solver container
          has no external network. Each shell command has a 90-second time limit. Python testbed environment is
          activated for every shell command. The repository exposes only the supplied base snapshot, with no future
          Git objects.
        max_quality_gap: 0.05
        max_output_tokens: 2048
        response_format: json_schema
        calibration: null
        empirical_supplement: '


          # Empirical training supplement

          The following measured observations supplement the qualitative card. They describe independent training
          attempts, never this request. Treat these small-sample frequencies as noisy priors, conditional on the
          actual execution conditions.

          single-response: 130 paired training attempts; Luna solved 98, Sol solved 103; Sol-only successes 11,
          Luna-only successes 6.

          agentic: 30 paired training attempts; Luna solved 23, Sol solved 25; Sol-only successes 2, Luna-only successes
          0.

          Prefer Luna when the observable crux is a standard reduction with a compact correctness argument, even
          if multistep. Luna-only successes include careful recurrence/index handling, recursive preservation of
          nested structure, parity-based combinatorics, offline sequence queries with value caps, and exact discrete
          marginal-cost allocation. In tool-using work, Luna is a reasonable default for localized patches whose
          call path and regression surface can be directly inspected and tested.


          Prefer Sol when the task exposes semantic choices not distinguished by the example, or when implementation
          robustness dominates the core idea. Sol-only rescues covered true-versus-floor arithmetic semantics, cascading
          rewrite simulation, duplicate-sensitive greedy pairing, cycle-aware functional-graph DP, sophisticated
          range-query pairing, cyclic boundary characterization, lexicographic DP reconstruction, pair-state graph
          search, movement-accounting feasibility checks, and prime-factor state aggregation. In tool-using work,
          Sol also rescued subtle transform semantics and an underspecified binary-memory extraction task.


          Do not route to Sol merely because a task is multistep: Luna succeeded on many coupled combinatorial and
          DP problems that Sol did not. Conversely, repeated both-fail outcomes on novel global data structures,
          compressed huge-domain reachability, high-performance convolution, and difficult optimization reconstruction
          indicate algorithmic difficulty rather than demonstrated Sol advantage. If focused or public checks fail,
          favor the model whose mechanism directly addresses that failure; a passing single example should not override
          unresolved semantic branches.

          Limitations: All observations come from a fixed training harness and do not imply general superiority.
          Measured labels govern these runs, but one noisy attempt and several conflicts with self-review or partial
          checks make isolated outcomes unreliable. Sol-only and Luna-only patterns are sparse for tool-using work.
          Verification was often absent or limited to supplied examples, so hidden-edge robustness and cross-environment
          behavior remain uncertain.'
        selective_policy:
          version: selective-v3-v2_empirical_upfront_benefit_per_dollar_C0.1
          feature_schema: v2-v1
          target: benefit_per_dollar
          threshold: 0.5
