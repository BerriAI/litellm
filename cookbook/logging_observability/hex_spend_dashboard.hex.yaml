    valueRowIndex: 0
    valueVariableName: spend_summary
    showComparison: false
- cellId: 55436d1d-3d4e-5068-b192-d540d488d9d0
  cellLabel: Daily spend
  cellType: CODE
  config:
    source: |-
      import plotly.express as px

      spend_trend = px.line(daily_spend, x="log_date", y="spend", markers=True,
                            title="Daily spend (USD)", labels={"log_date": "Date (UTC)", "spend": "USD"})
      spend_trend.update_layout(template="plotly_white")
      spend_trend
- cellId: 25ea0fa3-9a3c-58ed-949e-777ed64ce6dc
  cellLabel: Spend by model
  cellType: CODE
  config:
    source: |-
      model_breakdown = px.bar(model_spend, x="model", y="spend",
                               title="Spend by model (USD)", labels={"model": "Model", "spend": "USD"})
      model_breakdown.update_layout(template="plotly_white")
      model_breakdown
