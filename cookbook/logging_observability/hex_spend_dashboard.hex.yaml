schemaVersion: 3
meta:
  title: LiteLLM spend analytics
  description: Request spend, token usage, errors, models, and teams from LiteLLM via S3 and Athena.
  codeLanguage: PYTHON
  timezone: UTC
  autoRerunApp: true
  logicQueryCacheTimeout:
    type: disabled
  publishedQueryCacheTimeout:
    type: disabled
cells:
- cellId: bb3d1f25-5065-58b9-bca1-049cf32398de
  cellLabel: Setup
  cellType: MARKDOWN
  config:
    source: |-
      # LiteLLM spend analytics

      1. Enable `litellm_settings: {callbacks: [hex]}` on the proxy. Set `HEX_S3_BUCKET_NAME`, optionally `HEX_S3_REGION_NAME` and `HEX_S3_PATH` (default `litellm-spend`). Use the proxy's AWS IAM role to write logs.
      2. Run the accompanying `hex_spend_table.sql` in Athena after replacing its bucket and prefix. Partition projection discovers new daily folders without a crawler or partition repair. Keep query results outside the log prefix.
      3. Add an [Athena data connection](https://learn.hex.tech/docs/connect-to-data/data-connections/setup-guides/connect-to-amazon-athena) to Hex, preferably using an IAM role. Select that connection for the four SQL cells below and choose the database containing `litellm_hex_spend`.
      4. Run all cells, publish the App, and configure a Hex scheduled run for your desired refresh interval. Refresh queries read newly uploaded records; this is not a live streaming dashboard.

      This template covers the last 30 UTC calendar days, including today. Spend is in USD. Requests with unknown cost are counted separately rather than assumed free. No prompts, responses, raw errors, or API keys are exported. Team/user identifiers and key aliases are included; control access to the bucket and Hex project accordingly.

      Uploads are buffered in process and retried by the S3 logger. A proxy crash can lose records that have not reached S3. Use your existing warehouse pipeline and native Hex connection instead if you already have one; this callback does not require a Hex API key.
- cellId: b38ace16-60ff-5713-9fd4-c2afac69e732
  cellLabel: Summary query
  cellType: SQL
  config:
    dataFrameCell: false
    dataConnectionId: null
    resultVariableName: spend_summary
    source: |-
      SELECT COUNT(*) AS requests,
             COALESCE(SUM(spend), 0) AS total_spend,
             COUNT(*) FILTER (WHERE spend IS NULL) AS unknown_cost_requests,
             COALESCE(SUM(total_tokens), 0) AS tokens,
             COUNT(*) FILTER (WHERE status = 'failure') AS failed_requests,
             AVG(response_time) AS average_latency_seconds
      FROM litellm_hex_spend
      WHERE log_date BETWEEN CAST(date_add('day', -29, current_date) AS varchar)
                         AND CAST(current_date AS varchar)
- cellId: b1ff3cf7-66ca-5013-90a0-5b7368c52773
  cellLabel: Daily spend query
  cellType: SQL
  config:
    dataFrameCell: false
    dataConnectionId: null
    resultVariableName: daily_spend
    source: |-
      SELECT log_date, COALESCE(SUM(spend), 0) AS spend,
             COUNT(*) AS requests
      FROM litellm_hex_spend
      WHERE log_date BETWEEN CAST(date_add('day', -29, current_date) AS varchar)
                         AND CAST(current_date AS varchar)
      GROUP BY log_date
      ORDER BY log_date
- cellId: 08d70a66-b6f8-587c-9bcf-b71e639c4239
  cellLabel: Model spend query
  cellType: SQL
  config:
    dataFrameCell: false
    dataConnectionId: null
    resultVariableName: model_spend
    source: |-
      SELECT COALESCE(model_group, model, '(unassigned)') AS model,
             COALESCE(SUM(spend), 0) AS spend, COUNT(*) AS requests,
             COALESCE(SUM(total_tokens), 0) AS tokens
      FROM litellm_hex_spend
      WHERE log_date BETWEEN CAST(date_add('day', -29, current_date) AS varchar)
                         AND CAST(current_date AS varchar)
      GROUP BY 1
      ORDER BY spend DESC
- cellId: 5199f238-552a-5d14-8368-e83ce7414369
  cellLabel: Team spend query
  cellType: SQL
  config:
    dataFrameCell: false
    dataConnectionId: null
    resultVariableName: team_spend
    source: |-
      SELECT COALESCE(team_id, '(unassigned)') AS team_id,
             COALESCE(SUM(spend), 0) AS spend, COUNT(*) AS requests,
             COUNT(*) FILTER (WHERE status = 'failure') AS failed_requests,
             AVG(response_time) AS average_latency_seconds
      FROM litellm_hex_spend
      WHERE log_date BETWEEN CAST(date_add('day', -29, current_date) AS varchar)
                         AND CAST(current_date AS varchar)
      GROUP BY 1
      ORDER BY spend DESC
- cellId: ab06dca2-ee5d-5b43-99f4-13dbbd6f0404
