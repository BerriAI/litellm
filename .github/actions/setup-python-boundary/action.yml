name: Set up Python boundary benchmarks
description: Install the pinned runtime and a release wheel with benchmark probes
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12.12"
    - uses: ./.github/actions/setup-uv-with-retries
      with:
        version: "0.10.9"
    - name: Set up Rust
      shell: bash
      run: rustup toolchain install
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: cargo-cache
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          litellm-rust/target
        key: boundary-${{ runner.os }}-${{ runner.arch }}-release-bench-${{ hashFiles('rust-toolchain.toml', 'litellm-rust/Cargo.lock') }}
    - name: Build and install release benchmark wheel
      shell: bash
      run: |
        uv venv --python python .venv-boundary
        uv pip sync --python .venv-boundary/bin/python --require-hashes tests/benchmarks/python_boundary/requirements.txt
        .venv-boundary/bin/maturin build --release --locked --features bench,extension-module --out boundary-dist
        uv pip install --python .venv-boundary/bin/python --no-deps boundary-dist/*.whl
    - name: Save the successful release build before performance checks
      if: steps.cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          litellm-rust/target
        key: boundary-${{ runner.os }}-${{ runner.arch }}-release-bench-${{ hashFiles('rust-toolchain.toml', 'litellm-rust/Cargo.lock') }}
