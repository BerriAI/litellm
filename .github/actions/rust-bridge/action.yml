name: Set up the Rust bridge
description: >-
  Fill rust-bridge-dist from the shared Rust bridge artifact, or restore or build it
  when no artifact is given. Install it with .github/scripts/uv_sync_with_rust_bridge.sh
inputs:
  artifact:
    description: Rust bridge artifact name
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Build the Rust bridge
      if: inputs.artifact == ''
      uses: ./.github/actions/build-rust-bridge
    - name: Download the Rust bridge artifact
      if: inputs.artifact != ''
      uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
      with:
        name: ${{ inputs.artifact }}
        path: rust-bridge-dist
