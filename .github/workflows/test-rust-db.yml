name: LiteLLM Rust DB

on:
  push:
    branches:
      - main
    paths:
      - "litellm-rust/**"
      - "litellm/proxy/db/queries/**"
      - "litellm-proxy-extras/litellm_proxy_extras/migrations/**"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test-rust-db.yml"
  pull_request:
    branches:
      - main
      - "litellm_**"
    paths:
      - "litellm-rust/**"
      - "litellm/proxy/db/queries/**"
      - "litellm-proxy-extras/litellm_proxy_extras/migrations/**"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test-rust-db.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sqlx-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update
        working-directory: litellm-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: litellm-rust
          cache-on-failure: true

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres

      - name: Check the committed .sqlx against the migrated schema
        working-directory: litellm-rust
        run: cargo run --locked -p litellm-db-testing --bin sqlx-prepare -- --check

      - name: Lint the database tests
        working-directory: litellm-rust
        run: cargo clippy -p litellm-db --all-targets --locked --features postgres-tests,schema -- -D warnings

      - name: Run the database tests
        working-directory: litellm-rust
        run: cargo test -p litellm-db --locked --features postgres-tests
