name: LiteLLM Rust DB

on:
  push:
    branches:
      - main
    paths:
      - "litellm-rust/**"
      - "litellm/proxy/db/queries/**"
      - "litellm-proxy-extras/litellm_proxy_extras/migrations/**"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test-rust-db.yml"
  pull_request:
    branches:
      - main
      - "litellm_**"
    paths:
      - "litellm-rust/**"
      - "litellm/proxy/db/queries/**"
      - "litellm-proxy-extras/litellm_proxy_extras/migrations/**"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test-rust-db.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sqlx-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: litellm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/litellm_test"

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install the Prisma CLI
        run: uv sync --frozen --no-install-project --only-group proxy-dev

      - uses: ./.github/actions/cache-prisma-binaries

      - name: Apply the Prisma migrations
        run: uv run --no-sync prisma migrate deploy --schema litellm-proxy-extras/litellm_proxy_extras/schema.prisma

      - run: rustup toolchain install --no-self-update
        working-directory: litellm-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: litellm-rust
          cache-on-failure: true

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres

      - name: Check the committed .sqlx against the migrated schema
        working-directory: litellm-rust/crates/db
        run: cargo sqlx prepare --check -- --all-targets --features postgres-tests

      - name: Lint the database tests
        working-directory: litellm-rust
        run: cargo clippy -p litellm-db --all-targets --locked --features postgres-tests,schema -- -D warnings

      - name: Run the database tests
        working-directory: litellm-rust
        run: cargo test -p litellm-db --locked --features postgres-tests
