name: Lens Worker Image

on:
  pull_request:
    branches: [main, litellm_oss_branch, "litellm_**"]
    paths:
      - deploy/lens/**
      - litellm/proxy/lens/**
      - tests/proxy_behavior/lens/**
      - .github/workflows/lens-worker.yml
  push:
    branches: [main]
    paths:
      - deploy/lens/**
      - litellm/proxy/lens/**
      - tests/proxy_behavior/lens/**
      - .github/workflows/lens-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lens-worker-image:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Build Lens worker
        run: docker build --build-arg LITELLM_RELEASE_TAG=sha-${{ github.sha }} -f deploy/lens/Dockerfile -t lens-worker:${{ github.sha }} .
      - name: Reject custom builds without a matching release tag
        run: |
          if docker build --progress plain -f deploy/lens/Dockerfile -t lens-worker:unversioned . > missing-tag.log 2>&1; then
            echo "::error::An unversioned worker build unexpectedly succeeded"
            exit 1
          fi
          grep -F 'LITELLM_RELEASE_TAG: Pass --build-arg LITELLM_RELEASE_TAG matching the gateway' missing-tag.log
      - name: Verify standalone imports with a read-only filesystem
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            --security-opt no-new-privileges --entrypoint python \
            lens-worker:${{ github.sha }} -c '
          import os
          import lens.worker
          from lens.trace_store import trace_store
          assert os.getuid() == 65532
          with trace_store() as store:
              assert store.count() == 0
          '
      - name: Prepare test-only coverage tool
        run: |
          coverage_directory=$(mktemp -d "$RUNNER_TEMP/lens-coverage.XXXXXX")
          curl --fail --silent --show-error --location \
            https://files.pythonhosted.org/packages/61/e8/cb8e80d6f9f55b99588625062822bf946cf03ed06315df4bd8397f5632a1/coverage-7.14.0-py3-none-any.whl \
            --output "$coverage_directory/coverage.whl"
          printf '%s  %s\n' 8de5b61163aee3d05c8a2beab6f47913df7981dad1baf82c414d99158c286ab1 \
            "$coverage_directory/coverage.whl" | sha256sum --check
          chmod 777 "$coverage_directory"
          echo "LENS_COVERAGE_DIRECTORY=$coverage_directory" >> "$GITHUB_ENV"
      - name: Verify confined Python execution
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g --security-opt no-new-privileges \
            -v "$PWD/tests/proxy_behavior/lens/worker_python_smoke.py:/app/python_smoke.py:ro" \
            -v "$PWD/tests/proxy_behavior/lens/coverage.ini:/coverage.ini:ro" \
            -v "$LENS_COVERAGE_DIRECTORY:/coverage" \
            -e PYTHONPATH=/coverage/coverage.whl -e COVERAGE_RCFILE=/coverage.ini \
            --entrypoint python lens-worker:${{ github.sha }} \
            -m coverage run --data-file=/coverage/.coverage.python /app/python_smoke.py
      - name: Verify workspace investigation and live review output
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g --security-opt no-new-privileges \
            -v "$PWD/tests/proxy_behavior/lens/worker_context_smoke.py:/app/context_smoke.py:ro" \
            -v "$PWD/tests/proxy_behavior/lens/coverage.ini:/coverage.ini:ro" \
            -v "$LENS_COVERAGE_DIRECTORY:/coverage" \
            -e PYTHONPATH=/coverage/coverage.whl -e COVERAGE_RCFILE=/coverage.ini \
            --entrypoint python lens-worker:${{ github.sha }} \
            -m coverage run --data-file=/coverage/.coverage.context /app/context_smoke.py
      - name: Verify default workspace recovery after Python scratch storage fills
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=64k --security-opt no-new-privileges \
            -v "$PWD/tests/proxy_behavior/lens/worker_storage_smoke.py:/app/storage_smoke.py:ro" \
            -v "$PWD/tests/proxy_behavior/lens/coverage.ini:/coverage.ini:ro" \
            -v "$LENS_COVERAGE_DIRECTORY:/coverage" \
            -e PYTHONPATH=/coverage/coverage.whl -e COVERAGE_RCFILE=/coverage.ini \
            --entrypoint python lens-worker:${{ github.sha }} \
            -m coverage run --data-file=/coverage/.coverage.storage /app/storage_smoke.py
      - name: Map native worker coverage to repository sources
        if: always() && env.LENS_COVERAGE_DIRECTORY != ''
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges -w /workspace \
            -v "$PWD/litellm/proxy/lens:/workspace/litellm/proxy/lens:ro" \
            -v "$PWD/tests/proxy_behavior/lens/coverage.ini:/coverage.ini:ro" \
            -v "$LENS_COVERAGE_DIRECTORY:/coverage" \
            -e PYTHONPATH=/coverage/coverage.whl -e COVERAGE_RCFILE=/coverage.ini \
            --entrypoint /bin/sh lens-worker:${{ github.sha }} \
            -c 'python -m coverage combine && python -m coverage xml'
      - name: Upload native worker coverage
        if: always() && env.LENS_COVERAGE_DIRECTORY != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: ${{ env.LENS_COVERAGE_DIRECTORY }}/lens-worker.xml
          root_dir: ${{ github.workspace }}
          flags: lens-worker
          fail_ci_if_error: false
      - name: Publish versioned Lens worker
        if: github.event_name != 'pull_request' && github.repository == 'BerriAI/litellm' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/berriai/litellm-lens-worker-dev:sha-${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker tag lens-worker:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          printf 'Lens worker image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
