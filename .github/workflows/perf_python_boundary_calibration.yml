name: Calibrate Python boundary budgets

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-boundary-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    name: Collect candidate latency budgets
    runs-on: codspeed-macro
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      BOUNDARY_RUNNER: codspeed-macro
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-boundary
      - name: Collect five independent measurements
        run: |
          for run in 1 2 3 4 5; do
            .venv-boundary/bin/python tests/benchmarks/python_boundary/budgets.py measure --output "boundary-results/report-$run.json"
          done
      - name: Generate candidate budgets
        run: >-
          .venv-boundary/bin/python tests/benchmarks/python_boundary/budgets.py
          calibrate boundary-results/report-*.json --output boundary-results/candidate-budgets.json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: python-boundary-calibration
          path: boundary-results/
          if-no-files-found: error
