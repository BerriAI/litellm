name: Check OpenAPI Breaking Changes

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-breaking:
    name: Verify openapi.json is current and has no breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OASDIFF_VERSION: "1.28.0"
      OASDIFF_SHA256: "e0ef076f2cf953d922addc04be9c3851cf3ec18f7678d2b94d44cea23dca51b5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changes that can affect the spec
        id: changes
        run: |
          set -euo pipefail
          if ! base="$(git rev-parse --verify --quiet HEAD^2 >/dev/null && git rev-parse HEAD^1)"; then
            echo "Not a pull request merge commit, running the full check."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          if grep -Eq '^(litellm/|openapi\.json$|scripts/dump_openapi\.py$|\.github/workflows/check-openapi-breaking-changes\.yml$)' <<< "$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend or spec changes in this pull request, nothing to verify."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache uv dependencies
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install backend dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router

      - name: Cache Prisma binaries
        if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/cache-prisma-binaries

      - name: Generate Prisma client
        if: steps.changes.outputs.relevant == 'true'
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Regenerate the spec
        if: steps.changes.outputs.relevant == 'true'
        run: uv run --no-sync python scripts/dump_openapi.py openapi.json

      - name: Fail if the committed spec is stale
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=openapi.json::openapi.json is out of sync with the proxy's routes."
            echo ""
            echo "A backend route or model changed without regenerating the committed spec."
            echo "To fix, run from the repo root:"
            echo "  uv run python scripts/dump_openapi.py openapi.json"
            echo "then commit the updated openapi.json."
            exit 1
          fi
          echo "openapi.json is in sync with the proxy's routes."

      - name: Install oasdiff
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          curl -sSL -o "${RUNNER_TEMP}/oasdiff.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  ${RUNNER_TEMP}/oasdiff.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/oasdiff-bin"
          tar -xzf "${RUNNER_TEMP}/oasdiff.tar.gz" -C "${RUNNER_TEMP}/oasdiff-bin" oasdiff

      - name: Fail on undeclared breaking API changes vs the base branch
        if: steps.changes.outputs.relevant == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "HEAD^1:openapi.json" 2>/dev/null; then
            echo "The base branch has no openapi.json yet, skipping the breaking-change diff."
            exit 0
          fi
          git show "HEAD^1:openapi.json" > "${RUNNER_TEMP}/base_openapi.json"
          if "${RUNNER_TEMP}/oasdiff-bin/oasdiff" breaking -f githubactions --fail-on ERR "${RUNNER_TEMP}/base_openapi.json" openapi.json; then
            echo "No breaking API changes against the base branch."
            exit 0
          fi
          if grep -Eq '^[a-z]+(\([^)]+\))?!:' <<< "${PR_TITLE}" || grep -q 'BREAKING CHANGE' <<< "${PR_BODY:-}"; then
            echo ""
            echo "Breaking API changes detected, and the PR declares them with a conventional-commits breaking marker. Passing."
            exit 0
          fi
          echo ""
          echo "::error::This pull request breaks the proxy's public API without declaring it."
          echo "If the break is intentional, declare it the conventional-commits way:"
          echo "  add a bang to the PR title, e.g. feat!: drop the deprecated /v1/foo route"
          echo "  or add a 'BREAKING CHANGE: <description>' line to the PR description."
          exit 1
