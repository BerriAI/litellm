name: Interactions spec canary

on:
  schedule:
    - cron: "17 7 * * *"
  pull_request:
    paths:
      - .github/workflows/interactions-spec-canary.yml
      - tests/unit/interactions/**
      - litellm/types/interactions/**
  workflow_dispatch:

permissions: {}

jobs:
  interactions-spec-canary:
    name: interactions-spec-canary
    if: github.repository == 'BerriAI/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra proxy --no-install-project

      - name: Run the compliance tests against Google's live spec
        env:
          LITELLM_INTERACTIONS_SPEC_SOURCE: live
        run: |
          uv run --no-sync pytest tests/unit/interactions/test_openapi_compliance.py \
            --tb=short -vv -p no:rerunfailures -p no:pytest-retry \
            --allow-hosts=127.0.0.1,::1,localhost,ai.google.dev

      - name: Open or update the tracking issue when a scheduled run is red
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = "Interactions spec canary is red";
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const { data: found } = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });
            if (found.total_count > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: found.items[0].number, body: `Still red: ${runUrl}` });
              return;
            }
            await github.rest.issues.create({
              ...context.repo,
              title,
              body: `The scheduled run of tests/unit/interactions/test_openapi_compliance.py against Google's live Interactions spec failed: ${runUrl}\n\nlitellm/types/interactions/README.md says how to refresh the snapshot and regenerate the types.`,
            });
