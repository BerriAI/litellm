name: Interactions spec canary

on:
  schedule:
    - cron: "17 7 * * *"
  pull_request:
    paths:
      - .github/workflows/interactions-spec-canary.yml
      - tests/unit/interactions/**
      - litellm/types/interactions/**
  workflow_dispatch:

permissions: {}

concurrency: interactions-spec-canary

jobs:
  interactions-spec-canary:
    name: interactions-spec-canary
    if: github.repository == 'BerriAI/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      compliance: ${{ steps.compliance.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra proxy --no-install-project

      - name: Run the compliance tests against Google's live spec
        id: compliance
        run: |
          uv run --no-sync pytest tests/unit/interactions/test_openapi_compliance.py \
            --interactions-spec-url=https://ai.google.dev/static/api/interactions.openapi.json \
            --tb=short -vv -p no:rerunfailures -p no:pytest-retry \
            --allow-hosts=127.0.0.1,::1,localhost,ai.google.dev

  tracking-issue:
    name: tracking-issue
    needs: interactions-spec-canary
    if: always() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.repository == 'BerriAI/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File the tracking issue unless the compliance step passed, close it when it did
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPLIANCE_OUTCOME: ${{ needs.interactions-spec-canary.outputs.compliance }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = "Interactions spec canary is red";
            const outcome = process.env.COMPLIANCE_OUTCOME;
            const runUrl = process.env.RUN_URL;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const { data: found } = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 20 });
            const open = found.items.find((issue) => issue.title === title);
            if (outcome === "success") {
              if (open === undefined) return;
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `Green again: ${runUrl}` });
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: "closed" });
              return;
            }
            const state = outcome === "failure" ? "red" : `not run (compliance step outcome: ${outcome || "none"})`;
            if (open !== undefined) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `Still ${state}: ${runUrl}` });
              return;
            }
            await github.rest.issues.create({
              ...context.repo,
              title,
              assignees: ["mateo-berri"],
              body: `The scheduled run of tests/unit/interactions/test_openapi_compliance.py against Google's live Interactions spec is ${state}: ${runUrl}\n\nlitellm/types/interactions/README.md says how to refresh the snapshot and regenerate the types.`,
            });
