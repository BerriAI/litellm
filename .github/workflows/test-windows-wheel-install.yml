name: Windows wheel install

on:
  push:
    branches:
      - main
    paths:
      - "litellm/**"
      - "litellm-rust/**"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "tests/windows_tests/check_windows_wheel_install.py"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/workflows/test-windows-wheel-install.yml"
  pull_request:
    branches:
      - main
      - "litellm_**"
    paths:
      - "litellm/**"
      - "litellm-rust/**"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "tests/windows_tests/check_windows_wheel_install.py"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/workflows/test-windows-wheel-install.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-under-store-python-prefix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: litellm-rust
          cache-on-failure: true

      - run: uv build --wheel --out-dir dist

      - name: Turn off long-path support, the default on a user's Windows machine
        run: |
          $key = "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem"
          Write-Host "LongPathsEnabled on this runner image: $((Get-ItemProperty -Path $key).LongPathsEnabled)"
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 0 -Type DWord

      - run: python tests/windows_tests/check_windows_wheel_install.py
