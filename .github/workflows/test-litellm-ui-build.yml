name: UI Build Check
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"

jobs:
  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/litellm-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json

      - name: Verify the dependency cooldown is enforced
        run: |
          set -euo pipefail
          configured=$(npm config get min-release-age)
          if [ "$configured" = "null" ] || [ -z "$configured" ]; then
            echo "::error::min-release-age is not set for ui/litellm-dashboard"
            exit 1
          fi
          echo "min-release-age=$configured on npm $(npm --version)"

          probe=$(mktemp -d)
          printf '{"name":"cooldown-probe","version":"1.0.0","private":true}\n' > "$probe/package.json"
          printf 'min-release-age=999999\n' > "$probe/.npmrc"
          if (cd "$probe" && npm install --package-lock-only --no-audit --no-fund react >/dev/null 2>&1); then
            echo "::error::npm resolved a version despite a 999999-day cooldown; min-release-age is inert on npm $(npm --version)"
            exit 1
          fi
          echo "cooldown enforced: resolution refused under an impossible min-release-age"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
