name: integration-trial

on:
  push:
    branches: [litellm_test_de828f]
  workflow_dispatch:
    inputs:
      suite:
        description: Integration group to run
        type: choice
        options: [all, providers, database, management]
        default: all
      workers:
        description: Workers per group, blank keeps each group's default
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.workers }}
  cancel-in-progress: false

jobs:
  integration:
    name: integration-trial ${{ matrix.suite }}
    runs-on: ${{ matrix.suite == 'providers' && 'ubuntu-latest-64-cores' || 'ubuntu-latest-16-cores' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((inputs.suite || 'all') == 'all' && '["providers","database","management"]' || format('["{0}"]', inputs.suite)) }}
    env:
      UV_PYTHON: "3.12"
      INTEGRATION_WORKERS: ${{ inputs.workers || (matrix.suite == 'providers' && '32') || (matrix.suite == 'management' && '8') || '2' }}
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        command: -c max_connections=1000 -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=20000
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: circle_test
        ports:
          - 5432:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        timeout-minutes: 5
        uses: ./.github/actions/cache-cargo-build

      - name: Cache Prisma binaries
        timeout-minutes: 5
        uses: ./.github/actions/cache-prisma-binaries

      - name: Install dependencies
        timeout-minutes: 20
        run: .github/scripts/uv_sync_with_retries.sh --frozen --all-groups --all-extras

      - name: Install redis-server 7.2.16
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/redis-bin"
          cid="$(docker create redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c)"
          docker cp "${cid}:/usr/local/bin/redis-server" "$RUNNER_TEMP/redis-bin/redis-server"
          docker rm "$cid"
          "$RUNNER_TEMP/redis-bin/redis-server" --version | grep -q 'v=7.2.16'
          echo "$RUNNER_TEMP/redis-bin" >> "$GITHUB_PATH"

      - name: Run integration contracts
        timeout-minutes: 45
        env:
          SUITE: ${{ matrix.suite }}
          INTEGRATION_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          INTEGRATION_REDIS_CONTAINER: ${{ job.services.redis.id }}
          LITELLM_LICENSE: ${{ secrets.LITELLM_LICENSE }}
        run: bash .circleci/scripts/run_integration.sh "$SUITE"

      - name: Upload results
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-trial-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
