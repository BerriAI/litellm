name: Check Duplicate Issues

# Flags newly opened issues that look like existing ones. Flagging only: the actual
# close happens 3 days later in "Close Stale Duplicate Issues", and only if nobody
# replied to the comment posted here. The HTML marker below is the handshake between
# the two workflows, so keep it in the template.

on:
  issues:
    types: [opened, edited]

jobs:
  check-duplicate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check for potential duplicates
        uses: wow-actions/potential-duplicates@4d4ea0352e0383859279938e255179dd1dbb67b5 # v1.1.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          label: potential-duplicate
          threshold: 0.6
          reaction: eyes
          comment: |
            <!-- litellm:potential-duplicate candidates={{#issues}}{{number}},{{/issues}} -->
            **Potential duplicate detected**

            This looks similar to:
            {{#issues}}
            - #{{number}} - {{title}} ({{accuracy}}% similar)
            {{/issues}}

            This issue will close automatically in 3 days unless someone responds. If it is a duplicate, please 👍 the existing issue and follow along there. If it is not, comment here or 👎 this comment and it stays open.
