name: Cost map pins recheck

on:
  push:
    branches:
      - main
      - litellm_cmg_qa_before_184f9a
    paths:
      - ci_cd/cost_map_pins.json

permissions: {}

jobs:
  rerun-cost-map-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run the cost map guard on open pull requests that touch the cost map or its pins
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          gh api graphql --paginate -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" -F base="$BASE_REF" \
            -f query='query($owner: String!, $name: String!, $base: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, baseRefName: $base, first: 25, after: $endCursor) {
                  nodes { headRefOid files(first: 100) { nodes { path } } }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }' \
            --jq '.data.repository.pullRequests.nodes[] | select(any(.files.nodes[].path; IN("model_prices_and_context_window.json", "litellm/model_prices_and_context_window_backup.json", "ci_cd/cost_map_pins.json"))) | .headRefOid' |
          while read -r head_sha; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cost-map-guard.yml --commit "$head_sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -z "$run_id" ]; then
              echo "::warning::no cost map guard run found for $head_sha"
              continue
            fi
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" || echo "::warning::could not re-run cost map guard run $run_id for $head_sha"
          done
