name: Sync Cheaper Inference model registry

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_cheaperinference_models:
    if: github.repository == 'BerriAI/litellm'
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Look for an already-open sync PR
        id: existing
        run: |
          # Only a branch in this repository counts: a fork PR could otherwise take a
          # sync-shaped branch name and suppress every scheduled run from then on.
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false) | .headRefName | select(startswith("litellm_cheaperinference_registry_sync_"))] | first // empty')"
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
          if [ -n "$open_pr" ]; then
            echo "An open sync PR already exists on branch $open_pr; skipping this run."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      - name: Run the sync
        if: steps.existing.outputs.open_pr == ''
        run: |
          uv run --frozen --with httpx --with pydantic python scripts/sync_cheaperinference_models.py \
            --write --pr-body-file "$RUNNER_TEMP/pr_body.md"
        env:
          CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
      - name: Regenerate the JSON schema
        if: steps.existing.outputs.open_pr == ''
        run: |
          uv run --frozen python ci_cd/generate_model_prices_schema.py
      - name: Create a pull request when the registry changed
        if: steps.existing.outputs.open_pr == ''
        run: |
          if git diff --quiet; then
            echo "Registry already in sync; no PR needed."
            exit 0
          fi
          branch="litellm_cheaperinference_registry_sync_$(date +'%Y-%m-%d')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add model_prices_and_context_window.json \
            litellm/model_prices_and_context_window_backup.json \
            model_prices_and_context_window.schema.json
          git commit -m "feat(models): sync cheaperinference model registry $(date +'%Y-%m-%d')"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --title "feat(models): sync cheaperinference model registry" \
            --body-file "$RUNNER_TEMP/pr_body.md" \
            --head "$branch" \
            --base "$BASE_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
