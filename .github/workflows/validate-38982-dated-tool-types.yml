name: Validate dated server-tool types

on:
  push:
    branches:
      - ci_38982_greptile_round2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Apply dated-version fix
        run: |
          python - <<'PY'
          from pathlib import Path
          common_path = Path('litellm/router_utils/common_utils.py')
          common = common_path.read_text()
          old = '''    prefix: Final = f"{family}_"\n    version_suffix: Final = tool_type[len(prefix) :] if tool_type.startswith(prefix) else ""\n    return bool(version_suffix) and version_suffix.isdigit()\n'''
          new = '''    prefix: Final = f"{family}_"\n    version_suffix: Final = tool_type[len(prefix) :] if tool_type.startswith(prefix) else ""\n    preview_prefix: Final = "preview_"\n    version_value: Final = (\n        version_suffix[len(preview_prefix) :]\n        if family == "web_search" and version_suffix.startswith(preview_prefix)\n        else version_suffix\n    )\n    date_parts: Final = version_value.split("_")\n    compact_date: Final = len(version_value) == 8 and version_value.isdigit()\n    underscored_date: Final = (\n        len(date_parts) == 3\n        and tuple(len(part) for part in date_parts) == (4, 2, 2)\n        and all(part.isdigit() for part in date_parts)\n    )\n    return compact_date or underscored_date\n'''
          if common.count(old) != 1:
              raise SystemExit('unexpected helper version block')
          common_path.write_text(common.replace(old, new, 1))

          test_path = Path('tests/test_litellm/router_utils/test_router_utils_common_utils.py')
          tests = test_path.read_text()
          anchor = '    def test_custom_server_tool_prefixes_do_not_trigger_native_filtering(self):\n'
          addition = '''    def test_openai_dated_web_search_types_filter_unsupported(self, sample_deployments):\n        dated_search: Final = filter_web_search_deployments(\n            sample_deployments, {"tools": [{"type": "web_search_2025_08_26"}]}\n        )\n        dated_preview: Final = filter_web_search_deployments(\n            sample_deployments, {"tools": [{"type": "web_search_preview_2025_03_11"}]}\n        )\n        assert isinstance(dated_search, list)\n        assert isinstance(dated_preview, list)\n        assert "deployment-3" not in tuple(d["model_info"]["id"] for d in dated_search)\n        assert "deployment-3" not in tuple(d["model_info"]["id"] for d in dated_preview)\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit('unexpected test insertion anchor')
          test_path.write_text(tests.replace(anchor, addition + anchor, 1))
          PY
          git diff --check
      - name: Install dependencies
        run: |
          uv sync --frozen --group proxy-dev --group e2e-dev
          uv pip install orjson
      - name: Validate repository gates and tests
        run: |
          uv run --no-sync ruff format --check litellm/router_utils/common_utils.py
          cd litellm && uv run --no-sync ruff check . && cd ..
          uv run --no-sync ruff check --config ruff-tests.toml tests
          uv run --no-sync python scripts/ruff_strict_gate.py --base 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a
          uv run --no-sync python scripts/type_discipline_gate.py --base 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a
          uv run --no-sync python scripts/test_quality_gate.py --base 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a
          uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py::TestFilterWebSearchDeployments -q
          uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py -q
      - name: Publish validated fix
        env:
          TARGET_BRANCH: litellm_fix_38982_anthropic_server_tool_routing
          EXPECTED_HEAD: 9d5bc01bbcf3c5399264b2b421105c45b70db64c
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name Vist233
          git config user.email 144699295+Vist233@users.noreply.github.com
          git add litellm/router_utils/common_utils.py tests/test_litellm/router_utils/test_router_utils_common_utils.py
          git commit -m "fix(router): support dated native web-search types"
          git push origin HEAD:"$TARGET_BRANCH"
