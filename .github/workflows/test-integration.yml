name: integration

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "5 8-20/3 * * 1-6"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      suite:
        description: Integration group to run
        type: choice
        options:
          - all
          - providers
          - extensions
          - accounting
          - management
          - management-replica
          - database
          - database-replica
          - mcp
          - security
          - cost
          - sdk
          - browser
        default: all
      workers:
        description: Workers per shard, blank keeps each group's default
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}-${{ inputs.suite }}-${{ inputs.workers }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: integration plan
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          SUITE: ${{ inputs.suite || 'all' }}
          WORKERS: ${{ inputs.workers }}
          INTEGRATION_GROUPS: >-
            {"providers": {"shards": 7, "workers": 4}, "extensions": {"shards": 9, "workers": 4},
            "accounting": {"shards": 3, "workers": 4}, "management": {"shards": 5, "workers": 4},
            "management-replica": {"shards": 5, "workers": 4}, "database": {"shards": 1, "workers": 4},
            "database-replica": {"shards": 1, "workers": 4}, "mcp": {"shards": 1, "workers": 4},
            "security": {"shards": 1, "workers": 4}, "cost": {"shards": 1, "workers": 4},
            "sdk": {"shards": 1, "workers": 1}, "browser": {"shards": 1, "workers": 1}}
        run: |
          include="$(jq -c --arg suite "$SUITE" --arg workers "$WORKERS" '[to_entries[]
            | select($suite == "all" or .key == $suite)
            | {suite: .key, shards: .value.shards, shard: range(.value.shards),
               workers: (if $workers == "" then .value.workers else $workers end | tostring)}]' <<< "$INTEGRATION_GROUPS")"
          test "$include" != "[]"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  integration:
    name: integration ${{ matrix.suite }} shard ${{ matrix.shard }}
    needs: plan
    environment: integration-license
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      UV_PYTHON: "3.12"
      INTEGRATION_WORKERS: ${{ matrix.workers }}
      INTEGRATION_CASE_SHARDS: ${{ matrix.shards }}
      INTEGRATION_CASE_SHARD_INDEX: ${{ matrix.shard }}
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: circle_test
        ports:
          - 5432:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Record runner load
        run: |
          mkdir -p test-results
          nohup vmstat -t -w -S M 10 > test-results/runner-load.txt 2>&1 &

      - name: Configure PostgreSQL for integration workers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" sh -c 'printf "%s\n" "max_connections = 1000" "shared_preload_libraries = pg_stat_statements" "pg_stat_statements.track = all" "pg_stat_statements.max = 20000" >> "$PGDATA/postgresql.conf"'
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        timeout-minutes: 5
        uses: ./.github/actions/cache-cargo-build

      - name: Cache Prisma binaries
        timeout-minutes: 5
        uses: ./.github/actions/cache-prisma-binaries

      - name: Install dependencies
        timeout-minutes: 20
        run: .github/scripts/uv_sync_with_retries.sh --frozen --all-groups --all-extras

      - name: Install the Rust gateway
        if: matrix.suite == 'management' || matrix.suite == 'management-replica'
        timeout-minutes: 15
        working-directory: litellm/packaging/litellm-proxy
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          uv run --no-project --with maturin==1.15.0 maturin build --profile dev --strip --out "$RUNNER_TEMP/gateway-dist"
          uv pip install --no-deps --python ../../../.venv/bin/python "$RUNNER_TEMP"/gateway-dist/*.whl
          test -x ../../../.venv/bin/litellm-gateway

      - name: Install redis-server 7.2.16
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/redis-bin"
          cid="$(docker create redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c)"
          docker cp "${cid}:/usr/local/bin/redis-server" "$RUNNER_TEMP/redis-bin/redis-server"
          docker rm "$cid"
          "$RUNNER_TEMP/redis-bin/redis-server" --version | grep -q 'v=7.2.16'
          echo "$RUNNER_TEMP/redis-bin" >> "$GITHUB_PATH"

      - name: Install MCP SDK1 peer
        if: matrix.suite == 'mcp'
        timeout-minutes: 5
        run: |
          uv venv --python 3.12 .venv-mcp-peer
          uv pip install --no-config --exclude-newer "3 days" --python .venv-mcp-peer 'mcp==1.28.1' 'langchain-mcp-adapters==0.2.1'
          echo "MCP_TEST_PEER_PYTHON=$PWD/.venv-mcp-peer/bin/python" >> "$GITHUB_ENV"

      - name: Set up Node.js
        if: matrix.suite == 'browser'
        timeout-minutes: 5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: litellm/ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: |
            litellm/ui/litellm-dashboard/package-lock.json
            tests/e2e/ui/package-lock.json

      - name: Install browser dependencies and build the dashboard
        if: matrix.suite == 'browser'
        timeout-minutes: 20
        run: |
          (cd litellm/ui/litellm-dashboard && npm ci)
          (cd tests/e2e/ui && npm ci)
          sudo env PATH="$PATH" DEBIAN_FRONTEND=noninteractive \
            node tests/e2e/ui/node_modules/@playwright/test/cli.js install-deps chromium
          node tests/e2e/ui/node_modules/@playwright/test/cli.js install chromium
          (cd litellm/ui/litellm-dashboard && NEXT_TELEMETRY_DISABLED=1 npm run build)

      - name: Run integration contracts
        timeout-minutes: 45
        env:
          SUITE: ${{ matrix.suite }}
          INTEGRATION_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          INTEGRATION_REDIS_CONTAINER: ${{ job.services.redis.id }}
          LITELLM_LICENSE: ${{ secrets.LITELLM_LICENSE }}
        run: |
          case "$SUITE" in
            *-replica) bash .github/scripts/ci/run_integration.sh "${SUITE%-replica}" replica ;;
            *) bash .github/scripts/ci/run_integration.sh "$SUITE" ;;
          esac

      - name: Report MCP coverage
        if: ${{ !cancelled() && matrix.suite == 'mcp' }}
        timeout-minutes: 5
        run: |
          coverage_dir=test-results/integration-mcp/coverage
          test -f "$coverage_dir/coverage.txt" && exit 0
          export COVERAGE_FILE="$PWD/$coverage_dir/data"
          .venv/bin/python -m coverage combine --rcfile=tests/integration/mcp_coverage.toml
          .venv/bin/python -m coverage report --rcfile=tests/integration/mcp_coverage.toml > "$coverage_dir/coverage.txt"
          .venv/bin/python -m coverage html --rcfile=tests/integration/mcp_coverage.toml -d "$coverage_dir/html"
          tail -n 1 "$coverage_dir/coverage.txt"

      - name: Check results for the license
        id: secret-scan
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          SCANNED_SECRET: ${{ secrets.LITELLM_LICENSE }}
        run: python .github/scripts/assert_secret_absent.py test-results

      - name: Upload results
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

  census:
    name: integration census
    needs: [plan, integration]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up uv
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Download shard results
        timeout-minutes: 10
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: integration-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/results

      - name: Verify every case ran exactly once across each group's shards
        env:
          INCLUDE: ${{ needs.plan.outputs.include }}
          RESULTS: ${{ runner.temp }}/results
          CENSUS: ${{ runner.temp }}/census
          RUN_ID: ${{ github.run_id }}
        run: |
          status=0
          while read -r suite shard; do
            latest="$(find "$RESULTS" -mindepth 1 -maxdepth 1 -name "integration-$suite-$shard-$RUN_ID-*" | sort -V | tail -n 1)"
            if [ ! -f "$latest/integration-$suite/execution.json" ]; then
              echo "::error::integration $suite shard $shard uploaded no execution record"
              status=1
              continue
            fi
            mkdir -p "$CENSUS/$suite/$shard"
            cp "$latest/integration-$suite/execution.json" "$CENSUS/$suite/$shard/"
          done < <(jq -r '.[] | select(.suite != "browser") | "\(.suite) \(.shard)"' <<< "$INCLUDE")
          while read -r suite shards; do
            uv run --no-project --python 3.12 --with pydantic==2.13.4 \
              python -m tests.integration._support.sharding "$CENSUS/$suite" --shards "$shards" || status=1
          done < <(jq -r '[.[] | select(.suite != "browser")] | unique_by(.suite)[] | "\(.suite) \(.shards)"' <<< "$INCLUDE")
          exit "$status"

      - name: Combine MCP coverage
        id: mcp-coverage
        if: ${{ !cancelled() && contains(needs.plan.outputs.include, '"mcp"') }}
        timeout-minutes: 5
        env:
          RESULTS: ${{ runner.temp }}/results
          RUN_ID: ${{ github.run_id }}
          COVERAGE_FILE: ${{ github.workspace }}/mcp-coverage/data
        run: |
          mkdir -p mcp-coverage
          for shard_data in "$RESULTS"/integration-mcp-*-"$RUN_ID"-*/integration-mcp/coverage/data; do
            cp "$shard_data" "mcp-coverage/data.$(basename "$(dirname "$(dirname "$(dirname "$shard_data")")")")"
          done
          coverage=(uv run --no-project --python 3.12 --with coverage==7.14.0 python -m coverage)
          "${coverage[@]}" combine --rcfile=tests/integration/mcp_coverage.toml mcp-coverage
          "${coverage[@]}" report --rcfile=tests/integration/mcp_coverage.toml > mcp-coverage/coverage.txt
          "${coverage[@]}" html --rcfile=tests/integration/mcp_coverage.toml -d mcp-coverage/html
          tail -n 1 mcp-coverage/coverage.txt

      - name: Upload MCP coverage
        if: ${{ !cancelled() && steps.mcp-coverage.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-mcp-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: mcp-coverage/
          retention-days: 14
