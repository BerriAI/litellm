name: integration

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  schedule:
    - cron: "5 8-20/3 * * 1-6"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      suite:
        description: Integration group to run
        type: choice
        options:
          - all
          - providers
          - extensions
          - accounting
          - management
          - management-replica
          - database
          - database-replica
          - mcp
          - security
          - cost
          - sdk
          - browser
        default: all
      workers:
        description: Workers per group, blank keeps each group's default
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}-${{ inputs.suite }}-${{ inputs.workers }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: integration ${{ matrix.suite }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    environment: integration-license
    runs-on: ${{ fromJSON('{"providers":"ubuntu-latest-64-cores","extensions":"ubuntu-latest-64-cores","accounting":"ubuntu-latest-32-cores","management":"ubuntu-latest-32-cores","management-replica":"ubuntu-latest-32-cores"}')[matrix.suite] || 'ubuntu-latest-16-cores' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((inputs.suite || 'all') == 'all' && '["providers","extensions","accounting","management","management-replica","database","database-replica","mcp","security","cost","sdk","browser"]' || format('["{0}"]', inputs.suite)) }}
    env:
      UV_PYTHON: "3.12"
      INTEGRATION_WORKERS: ${{ inputs.workers || fromJSON('{"providers":"32","extensions":"48","accounting":"16","management":"16","management-replica":"16","cost":"16","mcp":"8","security":"8","database":"4","database-replica":"4"}')[matrix.suite] || '' }}
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: circle_test
        ports:
          - 5432:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Configure PostgreSQL for integration workers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" sh -c 'printf "%s\n" "max_connections = 1000" "shared_preload_libraries = pg_stat_statements" "pg_stat_statements.track = all" "pg_stat_statements.max = 20000" >> "$PGDATA/postgresql.conf"'
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        timeout-minutes: 5
        uses: ./.github/actions/cache-cargo-build

      - name: Cache Prisma binaries
        timeout-minutes: 5
        uses: ./.github/actions/cache-prisma-binaries

      - name: Install dependencies
        timeout-minutes: 20
        run: .github/scripts/uv_sync_with_retries.sh --frozen --all-groups --all-extras

      - name: Install the Rust gateway
        if: matrix.suite == 'management' || matrix.suite == 'management-replica'
        timeout-minutes: 15
        working-directory: litellm/packaging/litellm-proxy
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          uv run --no-project --with maturin==1.15.0 maturin build --profile dev --strip --out "$RUNNER_TEMP/gateway-dist"
          uv pip install --no-deps --python ../../../.venv/bin/python "$RUNNER_TEMP"/gateway-dist/*.whl
          test -x ../../../.venv/bin/litellm-gateway

      - name: Install redis-server 7.2.16
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/redis-bin"
          cid="$(docker create redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c)"
          docker cp "${cid}:/usr/local/bin/redis-server" "$RUNNER_TEMP/redis-bin/redis-server"
          docker rm "$cid"
          "$RUNNER_TEMP/redis-bin/redis-server" --version | grep -q 'v=7.2.16'
          echo "$RUNNER_TEMP/redis-bin" >> "$GITHUB_PATH"

      - name: Install MCP SDK1 peer
        if: matrix.suite == 'mcp'
        timeout-minutes: 5
        run: |
          uv venv --python 3.12 .venv-mcp-peer
          uv pip install --no-config --exclude-newer "3 days" --python .venv-mcp-peer 'mcp==1.28.1' 'langchain-mcp-adapters==0.2.1'
          echo "MCP_TEST_PEER_PYTHON=$PWD/.venv-mcp-peer/bin/python" >> "$GITHUB_ENV"

      - name: Set up Node.js
        if: matrix.suite == 'browser'
        timeout-minutes: 5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: litellm/ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: |
            litellm/ui/litellm-dashboard/package-lock.json
            tests/e2e/ui/package-lock.json

      - name: Install browser dependencies and build the dashboard
        if: matrix.suite == 'browser'
        timeout-minutes: 20
        run: |
          (cd litellm/ui/litellm-dashboard && npm ci)
          (cd tests/e2e/ui && npm ci)
          sudo env PATH="$PATH" DEBIAN_FRONTEND=noninteractive \
            node tests/e2e/ui/node_modules/@playwright/test/cli.js install-deps chromium
          node tests/e2e/ui/node_modules/@playwright/test/cli.js install chromium
          (cd litellm/ui/litellm-dashboard && NEXT_TELEMETRY_DISABLED=1 npm run build)

      - name: Run integration contracts
        timeout-minutes: 45
        env:
          SUITE: ${{ matrix.suite }}
          INTEGRATION_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          INTEGRATION_REDIS_CONTAINER: ${{ job.services.redis.id }}
          LITELLM_LICENSE: ${{ secrets.LITELLM_LICENSE }}
        run: |
          case "$SUITE" in
            *-replica) bash .github/scripts/ci/run_integration.sh "${SUITE%-replica}" replica ;;
            *) bash .github/scripts/ci/run_integration.sh "$SUITE" ;;
          esac

      - name: Verify every case ran exactly once
        if: ${{ !cancelled() && matrix.suite != 'browser' }}
        timeout-minutes: 2
        run: |
          record="$(find test-results -mindepth 2 -maxdepth 2 -name execution.json -print -quit)"
          test -n "$record"
          mkdir -p "$RUNNER_TEMP/shards/0"
          cp "$record" "$RUNNER_TEMP/shards/0/execution.json"
          .venv/bin/python -m tests.integration._support.sharding "$RUNNER_TEMP/shards" --shards 1

      - name: Report MCP coverage
        if: ${{ !cancelled() && matrix.suite == 'mcp' }}
        timeout-minutes: 5
        run: |
          coverage_dir=test-results/integration-mcp/coverage
          test -f "$coverage_dir/coverage.txt" && exit 0
          export COVERAGE_FILE="$PWD/$coverage_dir/data"
          .venv/bin/python -m coverage combine --rcfile=tests/integration/mcp_coverage.toml
          .venv/bin/python -m coverage report --rcfile=tests/integration/mcp_coverage.toml > "$coverage_dir/coverage.txt"
          .venv/bin/python -m coverage html --rcfile=tests/integration/mcp_coverage.toml -d "$coverage_dir/html"
          tail -n 1 "$coverage_dir/coverage.txt"

      - name: Check results for the license
        id: secret-scan
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          SCANNED_SECRET: ${{ secrets.LITELLM_LICENSE }}
        run: python .github/scripts/assert_secret_absent.py test-results

      - name: Upload results
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

  unit-io:
    name: integration unit-io
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache uv dependencies
        timeout-minutes: 5
        uses: ./.github/actions/cache-uv-downloads

      - name: Set up the Rust build
        timeout-minutes: 5
        uses: ./.github/actions/rust-bridge

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          diff -u model_prices_and_context_window.json litellm/model_prices_and_context_window_backup.json
          .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router --extra switchyard --extra saml --extra extra_proxy --extra proxy-runtime --extra utils
          uv run --no-sync python -c 'import os, sys; print(sys.version); assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["UV_PYTHON"]'

      - name: Cache Prisma binaries
        timeout-minutes: 3
        uses: ./.github/actions/cache-prisma-binaries

      - name: Generate Prisma client
        timeout-minutes: 3
        run: |
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Run tests
        timeout-minutes: 30
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run --no-sync pytest \
            tests/unit/integrations/test_opentelemetry.py \
            tests/unit/integrations/otel/test_otel_v2_components.py \
            tests/unit/llms/custom_httpx/test_aiohttp_transport.py \
            tests/unit/proxy/db/test_pgbouncer.py \
            tests/unit/proxy/test_prometheus_metrics_server.py \
            tests/unit/proxy/test_proxy_cli.py \
            --tb=short -vv --maxfail=10 \
            -n 4 --dist=loadscope \
            --reruns 0 --reruns-delay 1 \
            --timeout=120 --rerun-except "from pytest-timeout" \
            --durations=20 \
            --cov=./litellm --cov=./litellm/enterprise/litellm_enterprise \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-unit-io-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          retention-days: 1

  e2e-harness:
    name: integration e2e-harness
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis@sha256:e2debfb7956fa12c7ddc79d7e645c8cf26b30c99a6e9161ea9bf4171e1668a5f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache uv dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache the Rust build
        uses: ./.github/actions/cache-cargo-build

      - name: Install dependencies
        run: |
          uv sync --frozen --group proxy-dev --group e2e-dev

      - name: Cache Prisma binaries
        uses: ./.github/actions/cache-prisma-binaries

      - name: Generate Prisma client
        run: |
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Run the e2e harness tests
        env:
          LITELLM_MASTER_KEY: sk-e2e-harness-tests-reach-no-proxy
          E2E_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          retry() { "$@" || { sleep 15; "$@"; } || { sleep 30; "$@"; }; }
          CLAUDE_VERSION="$(retry uv run --no-sync python tests/e2e/cli_harness/npm_version_resolver.py @anthropic-ai/claude-code)"
          tests/e2e/claude_code/cron_vm/install_claude_code.sh "$CLAUDE_VERSION" "$RUNNER_TEMP/claude-cli"
          PATH="$RUNNER_TEMP/claude-cli:$PATH" uv run --no-sync pytest -q tests/e2e_harness
          uv run --no-sync pytest --tb=short -q --noconftest -o addopts= -o "pythonpath=tests/e2e tests/e2e_harness" -p no:rerunfailures \
            tests/code_coverage_tests/test_provider_replay_harness.py \
            tests/code_coverage_tests/test_provider_cache.py
