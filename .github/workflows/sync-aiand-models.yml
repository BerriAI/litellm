name: Sync aiand model registry

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

concurrency:
  group: sync-aiand-models
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_aiand_models:
    if: github.repository == 'BerriAI/litellm'
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Look for an already-open sync PR
        id: existing
        run: |
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json headRefName,changedFiles \
            --jq '[.[] | select(.headRefName | startswith("litellm_aiand_registry_sync_")) | select(.changedFiles > 0)] | first | .headRefName // empty')"
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
          if [ -n "$open_pr" ]; then
            echo "Sync PR $open_pr still has unreviewed changes; skipping this run."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      - name: Run the sync
        if: steps.existing.outputs.open_pr == ''
        run: |
          uv run --frozen python scripts/sync_aiand_models.py --write --pr-body-file "$RUNNER_TEMP/pr_body.md"
      - name: Regenerate the JSON schema
        if: steps.existing.outputs.open_pr == ''
        run: |
          uv run --frozen python ci_cd/generate_model_prices_schema.py
      - name: Create a pull request when the registry changed
        if: steps.existing.outputs.open_pr == ''
        run: |
          if git diff --quiet; then
            echo "Registry already in sync; no PR needed."
            exit 0
          fi
          branch="litellm_aiand_registry_sync_$(date +'%Y-%m-%d')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add model_prices_and_context_window.json \
            litellm/model_prices_and_context_window_backup.json \
            model_prices_and_context_window.schema.json
          git commit -m "feat(models): sync aiand model registry $(date +'%Y-%m-%d')"
          gh auth setup-git
          git push origin --delete "$branch" 2>/dev/null || true
          git push origin "$branch"
          gh pr create --title "feat(models): sync aiand model registry" \
            --body-file "$RUNNER_TEMP/pr_body.md" \
            --head "$branch" \
            --base "$BASE_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
