name: "Unit Tests: LLM Provider Transformations"

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
  push:
    branches:
      - main
      - litellm_internal_staging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vertex-ai:
    name: Vertex AI
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_test-unit-base.yml
    with:
      test-path: "tests/test_litellm/llms/vertex_ai"
      workers: 1
      reruns: 2
      artifact-name: llm-vertex-ai

  other-providers:
    name: All Other Providers
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_test-unit-base.yml
    with:
      test-path: "tests/test_litellm/llms --ignore=tests/test_litellm/llms/vertex_ai"
      workers: 2
      reruns: 2
      artifact-name: llm-other-providers
