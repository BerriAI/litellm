name: UI Tests
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
  push:
    branches:
      - litellm_internal_staging

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui/litellm-dashboard

jobs:
  ui-unit-tests:
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json

      - run: npm ci

      - name: Type tests
        env:
          CI: "true"
        run: npm run test:types

      - name: Unit, component and integration tiers
        env:
          CI: "true"
        run: |
          npx vitest run \
            --pool forks --poolOptions.forks.maxForks=14 \
            --reporter=basic --reporter=json --outputFile=reports/vitest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vitest-report
          path: ui/litellm-dashboard/reports/vitest.json
          retention-days: 1

      - name: Per-test duration against each tier's budget
        if: always()
        run: npm run test:budgets -- reports/vitest.json
