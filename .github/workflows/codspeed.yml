name: CodSpeed Benchmarks

on:
  push:
    branches:
      - main
      - litellm_internal_staging
  pull_request:
    branches:
      - main
      - litellm_internal_staging
  # Allow CodSpeed to trigger backtest performance analysis
  # in order to generate initial data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-suite:
    name: Python suite (CPU)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        uses: ./.github/actions/cache-cargo-build

      # Build the wheel and resolve every dependency outside the CodSpeed
      # runner: the same maturin build took 42 minutes inside `codspeed run`
      # versus under 3 minutes as a plain step (LIT-6183)
      - name: Build environment
        run: >
          env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          uv run --frozen --no-default-groups
          --with pytest==8.3.5
          --with pytest-codspeed==4.3.0
          --with "mcp>=1.26.0,<2.0"
          --with "a2a-sdk>=1.1.0,<2.0"
          pytest
          -p pytest_codspeed.plugin
          tests/benchmarks/
          --ignore=tests/benchmarks/python_boundary
          --codspeed
          --collect-only -q

      - name: Run benchmarks
        uses: CodSpeedHQ/action@1c8ae4843586d3ba879736b7f6b7b0c990757fab # v4.12.1
        with:
          mode: simulation
          run: >
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
            uv run --frozen --no-default-groups
            --with pytest==8.3.5
            --with pytest-codspeed==4.3.0
            --with "mcp>=1.26.0,<2.0"
            --with "a2a-sdk>=1.1.0,<2.0"
            pytest
            -p pytest_codspeed.plugin
            tests/benchmarks/
            --ignore=tests/benchmarks/python_boundary
            --codspeed

  boundary-cpu:
    name: Python boundary (simulation)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-boundary
      - name: Test budget checker
        run: >-
          .venv-boundary/bin/python -m pytest -c /dev/null --rootdir=. -p no:cacheprovider
          --confcutdir=tests/benchmarks/python_boundary
          tests/benchmarks/python_boundary/test_budgets.py
      - name: Measure conversion CPU cost
        uses: CodSpeedHQ/action@1c8ae4843586d3ba879736b7f6b7b0c990757fab # v4.12.1
        with:
          mode: simulation
          run: >-
            .venv-boundary/bin/python -m pytest -c /dev/null --rootdir=. -p no:cacheprovider
            -p pytest_codspeed.plugin --confcutdir=tests/benchmarks/python_boundary
            tests/benchmarks/python_boundary/test_boundary.py -k test_conversion --codspeed

  boundary-latency:
    name: Python boundary (walltime)
    permissions:
      contents: read
      id-token: write
    runs-on: codspeed-macro
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      BOUNDARY_RUNNER: codspeed-macro
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-boundary
      - name: Measure boundary latency
        uses: CodSpeedHQ/action@1c8ae4843586d3ba879736b7f6b7b0c990757fab # v4.12.1
        with:
          mode: walltime
          run: >-
            .venv-boundary/bin/python -m pytest -c /dev/null --rootdir=. -p no:cacheprovider
            -p pytest_codspeed.plugin --confcutdir=tests/benchmarks/python_boundary
            tests/benchmarks/python_boundary/test_boundary.py --codspeed
            --codspeed-warmup-time=0.2 --codspeed-max-time=3
            --boundary-report=boundary-results/report.json
      - name: Enforce fixed latency budgets
        run: >-
          .venv-boundary/bin/python tests/benchmarks/python_boundary/budgets.py
          check boundary-results/report.json --output boundary-results/summary.md
      - name: Publish latency summary
        if: always()
        run: |
          if test -f boundary-results/summary.md; then
            cat boundary-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: python-boundary-walltime
          path: boundary-results/
          if-no-files-found: error
