name: CodSpeed Benchmarks

on:
  push:
    branches:
      - main
      - litellm_internal_staging
    paths:
      - "litellm/**"
      - "tests/benchmarks/**"
      - "tests/rust-python-harness/**"
      - "litellm-rust/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/actions/cache-cargo-build/**"
  pull_request:
    branches:
      - main
      - litellm_internal_staging
    paths:
      - "litellm/**"
      - "tests/benchmarks/**"
      - "tests/rust-python-harness/**"
      - "litellm-rust/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/actions/cache-cargo-build/**"
  # Allow CodSpeed to trigger backtest performance analysis
  # in order to generate initial data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        uses: ./.github/actions/cache-cargo-build

      # Build the wheel and resolve every dependency outside the CodSpeed
      # runner: the same maturin build took 42 minutes inside `codspeed run`
      # versus under 3 minutes as a plain step (LIT-6183)
      - name: Build environment
        run: >
          env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          uv run --frozen --no-default-groups
          --with pytest==8.3.5
          --with pytest-codspeed==4.3.0
          --with "mcp>=1.26.0,<2.0"
          --with "a2a-sdk>=1.1.0,<2.0"
          pytest
          -p pytest_codspeed.plugin
          tests/benchmarks/
          --codspeed
          --collect-only -q

      - name: Run benchmarks
        uses: CodSpeedHQ/action@1c8ae4843586d3ba879736b7f6b7b0c990757fab # v4.12.1
        with:
          mode: simulation
          run: >
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
            uv run --frozen --no-default-groups
            --with pytest==8.3.5
            --with pytest-codspeed==4.3.0
            --with "mcp>=1.26.0,<2.0"
            --with "a2a-sdk>=1.1.0,<2.0"
            pytest
            -p pytest_codspeed.plugin
            tests/benchmarks/
            --codspeed

  e2e-walltime:
    permissions:
      contents: read
      id-token: write
    runs-on: codspeed-macro
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            litellm-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-e2e-release-${{ hashFiles('litellm-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-e2e-release-

      - name: Build environment
        run: >-
          env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          uv run --frozen --no-default-groups
          --with pytest==8.3.5
          --with pytest-codspeed==5.0.3
          --with psutil==7.2.2
          --with vcrpy==8.2.1
          --with hypothesis==6.165.10
          --with reportlab==5.0.1
          --with "mcp>=1.26.0,<2.0"
          --with "a2a-sdk>=1.1.0,<2.0"
          pytest -p pytest_codspeed.plugin -c /dev/null --rootdir=.
          --import-mode=importlib -o consider_namespace_packages=true
          tests/rust-python-harness/strategies/e2e_benchmark/codspeed.py
          --collect-only -q

      - name: Build release extension
        run: VIRTUAL_ENV="$PWD/.venv" uvx --from maturin==1.15.0 maturin develop --release

      - name: Run OCR walltime benchmarks
        uses: CodSpeedHQ/action@1c8ae4843586d3ba879736b7f6b7b0c990757fab # v4.12.1
        with:
          mode: walltime
          run: >-
            uv run --no-sync --no-default-groups
            --with pytest==8.3.5
            --with pytest-codspeed==5.0.3
            --with psutil==7.2.2
            --with vcrpy==8.2.1
            --with hypothesis==6.165.10
            --with reportlab==5.0.1
            --with "mcp>=1.26.0,<2.0"
            --with "a2a-sdk>=1.1.0,<2.0"
            python -m tests.rust-python-harness.strategies.e2e_benchmark.codspeed
