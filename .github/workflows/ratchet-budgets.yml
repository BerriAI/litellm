name: Ratchet lint budgets

# Lowers every *-budget.json limit on litellm_internal_staging by exactly the
# violations the push that just landed fixed, then commits the result straight to
# the branch. PR branches never touch the budget files, so two PRs fixing the same
# rule no longer collide on the same "limit" line. Pushes made with GITHUB_TOKEN do
# not trigger workflows, so the bot commit cannot re-trigger this job.
# No cancel-in-progress: every push's delta matters, so runs queue instead.

on:
  push:
    branches:
      - litellm_internal_staging
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to measure fixes against (defaults to the current branch tip, i.e. a no-op)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ratchet-budgets
  cancel-in-progress: false

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A branch creation or force-push has no meaningful "before"; skip rather than
    # ratchet against the null sha.
    if: github.event_name == 'workflow_dispatch' || (github.event.before != '0000000000000000000000000000000000000000' && !github.event.forced)
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: litellm_internal_staging
          fetch-depth: 1
          clean: true
          persist-credentials: true

      - name: Resolve ratchet base
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          BASE_SHA="${INPUT_BASE:-$EVENT_BEFORE}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-parse HEAD)
          fi
          retry() { "$@" || { sleep 15; "$@"; } || { sleep 30; "$@"; }; }
          retry git fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "RATCHET_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache uv dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-lint-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-lint-

      - name: Cache the Rust build
        uses: ./.github/actions/cache-cargo-build

      - name: Cache Prisma binaries
        uses: ./.github/actions/cache-prisma-binaries

      - name: Install dependencies
        run: |
          uv sync --frozen --group proxy-dev --group e2e-dev

      # Same four gates test-linting.yml runs, in --update mode against the pre-push
      # tip. type_check_gate.py provisions its own .venv-typecheck and reuses the
      # base-counts artifact publish-basedpyright-base-counts.yml uploaded for the
      # base sha when one exists.
      - name: Ratchet budgets down by what this push fixed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync python scripts/ruff_strict_gate.py --update --base "$RATCHET_BASE_SHA"
          uv run --no-sync python scripts/type_discipline_gate.py --update --base "$RATCHET_BASE_SHA"
          uv run --no-sync python scripts/test_quality_gate.py --update --base "$RATCHET_BASE_SHA"
          uv run --no-sync python scripts/type_check_gate.py --update --base "$RATCHET_BASE_SHA"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- '*-budget.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No limit moved. Nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- '*-budget.json'
          fi

      # The tip may have moved while the gates ran. The checkout is shallow, so
      # instead of rebasing, re-apply the budget diff onto the fresh tip and retry
      # the push. A patch that no longer applies means someone merged a hand-edited
      # budget in the meantime, so fail loudly rather than guess, and re-run via
      # workflow_dispatch with `base` set to this run's RATCHET_BASE_SHA once the
      # branch is quiet.
      - name: Commit lowered limits
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MESSAGE="chore(lint): ratchet budget limits down by what ${RATCHET_BASE_SHA:0:12}..${GITHUB_SHA:0:12} fixed"
          git diff -- '*-budget.json' > "$RUNNER_TEMP/ratchet.patch"
          for attempt in 1 2 3; do
            git add -- '*-budget.json'
            git commit -m "$MESSAGE"
            if git push origin HEAD:litellm_internal_staging; then
              exit 0
            fi
            sleep $((attempt * 10))
            git fetch --no-tags --depth=1 origin litellm_internal_staging
            git checkout --detach origin/litellm_internal_staging
            git apply "$RUNNER_TEMP/ratchet.patch" || { echo "::error::budget patch no longer applies; re-run with base=$RATCHET_BASE_SHA"; exit 1; }
          done
          echo "::error::could not push the ratchet commit after 3 attempts"
          exit 1
