name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - litellm_internal_staging
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12

      - name: Compute image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag_list="${image}:sha-${GITHUB_SHA::12}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            branch_tag="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
            tag_list+=$'\n'"${image}:${branch_tag}"

            if [[ "${GITHUB_REF_NAME}" == "litellm_internal_staging" ]]; then
              tag_list+=$'\n'"${image}:main-stable"
            fi
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_list+=$'\n'"${image}:${GITHUB_REF_NAME}"
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${tag_list}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14
        with:
          context: .
          file: ./docker/Dockerfile.non_root
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
