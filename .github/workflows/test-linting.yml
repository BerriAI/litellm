  ci-coverage:
    name: ci-coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Assert every test file and Dockerfile is invoked by a job
        run: |
          python -m pip install "pyyaml==6.0.3"
          python .github/scripts/assert_ci_coverage.py

      - name: Assert no -k expression deselects a file from every job that globs it
        run: python .github/scripts/assert_ci_coverage.py --slices

      - name: Assert .github/workflows/ holds only workflows, correctly named
        run: python .github/scripts/assert_workflow_dir_hygiene.py
  lint-passed:
    name: lint passed
    needs: [python, secret-scan, ui, ui-api-types, code-quality, ci-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every lint job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
