name: Terraform Modules

on:
  push:
    paths:
      - "litellm/deploy/terraform/litellm/aws/**"
      - "litellm/deploy/terraform/litellm/gcp/**"
      - ".github/workflows/test-terraform-modules.yml"
  pull_request:
    branches:
      - main
      - "litellm_**"
    paths:
      - "litellm/deploy/terraform/litellm/aws/**"
      - "litellm/deploy/terraform/litellm/gcp/**"
      - ".github/workflows/test-terraform-modules.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  module:
    name: fmt, validate, test (${{ matrix.module }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [aws, gcp]
    defaults:
      run:
        working-directory: litellm/deploy/terraform/litellm/${{ matrix.module }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -recursive -check -diff

      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      # Plan-only, mock_provider-backed: no cloud credentials, no API calls.
      - name: test
        run: terraform test

