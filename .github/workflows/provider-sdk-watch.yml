name: Provider SDK watch

on:
  schedule:
    - cron: "23 14 * * *"
  pull_request:
    paths:
      - .github/workflows/provider-sdk-watch.yml
      - litellm/scripts/sdk_watch/**
  workflow_dispatch:
    inputs:
      day:
        description: "Release day to check (YYYY-MM-DD). Empty means the last 7 days"
        required: false
        default: ""
      sdk:
        description: "Check one release instead of a day: openai, anthropic or google-genai"
        required: false
        default: ""
      version:
        description: "The release of that SDK to check, e.g. 0.105.0"
        required: false
        default: ""
      max_implementations:
        description: "Most changes the agent implements in this run"
        required: false
        default: "2"

permissions: {}

concurrency:
  group: provider-sdk-watch-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: false

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  test:
    name: test
    if: github.repository == 'BerriAI/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: litellm/scripts/sdk_watch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install the agent
        run: uv sync --frozen --group dev

      - name: Run the agent's tests
        run: uv run --no-sync pytest -q -p no:cacheprovider

  bridge:
    name: bridge
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'BerriAI/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.bridge.outputs.artifact }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build or restore the Rust bridge
        id: bridge
        timeout-minutes: 20
        uses: ./.github/actions/build-rust-bridge

  watch:
    name: watch
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      drafts: ${{ steps.agent.outputs.drafts }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
          save-cache: "false"

      - name: Download the Rust bridge
        uses: ./.github/actions/rust-bridge
        with:
          artifact: ${{ needs.bridge.outputs.artifact }}

      - name: Install LiteLLM with its unit test dependencies
        run: |
          .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev \
            --extra google --extra proxy --extra semantic-router --extra switchyard --extra saml \
            --extra extra_proxy --extra proxy-runtime --extra utils \
            --no-install-project --no-install-package litellm-proxy
          uv pip install --no-deps --python .venv/bin/python rust-bridge-dist/*.whl
          cp rust-bridge-dist/litellm/rust_bridge/_native.abi3.so litellm/rust_bridge/_native.abi3.so
          rm -rf rust-bridge-dist

      - name: Restore the Prisma binaries
        uses: ./.github/actions/cache-prisma-binaries
        with:
          save-cache: "false"

      - name: Generate the Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Install the agent
        working-directory: litellm/scripts/sdk_watch
        run: uv sync --frozen

      - name: Start the LiteLLM proxy the agent calls its models through
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROXY_IMAGE: ghcr.io/berriai/litellm@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::The ANTHROPIC_API_KEY repository secret is not set, so the agent has no model to call"
            exit 1
          fi
          LITELLM_MASTER_KEY="sk-$(openssl rand -hex 32)"
          export LITELLM_MASTER_KEY
          echo "::add-mask::${LITELLM_MASTER_KEY}"
          echo "LITELLM_PROXY_KEY=${LITELLM_MASTER_KEY}" >> "${GITHUB_ENV}"
          docker run -d --name sdk-watch-proxy -p 127.0.0.1:4000:4000 \
            -e ANTHROPIC_API_KEY -e LITELLM_MASTER_KEY -e LITELLM_LOCAL_MODEL_COST_MAP \
            -v "${GITHUB_WORKSPACE}/litellm/scripts/sdk_watch/proxy_config.yaml:/app/sdk-watch.yaml:ro" \
            "${PROXY_IMAGE}" --config /app/sdk-watch.yaml --port 4000
          for _ in $(seq 1 150); do
            if curl -sf http://127.0.0.1:4000/health/liveliness > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 50 sdk-watch-proxy
          echo "::error::The LiteLLM proxy did not come up"
          exit 1

      - name: Lock the runner user out of the proxy's environment
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 600 /var/run/docker.sock
          fi
          sudo rm -f /etc/sudoers.d/runner
          if sudo -n true 2> /dev/null; then
            echo "::error::The runner user can still use sudo, so code the agent writes could read the provider key"
            exit 1
          fi

      - name: Restore the last scheduled run's history
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sdk-watch-history.json
          key: sdk-watch-history-${{ github.run_id }}
          restore-keys: sdk-watch-history-

      - name: Run the agent
        id: agent
        working-directory: litellm/scripts/sdk_watch
        env:
          LITELLM_PROXY_URL: http://127.0.0.1:4000
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_DAY: ${{ inputs.day }}
          INPUT_SDK: ${{ inputs.sdk }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MAX_IMPLEMENTATIONS: ${{ inputs.max_implementations || '2' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--repo "${GITHUB_WORKSPACE}" --repository "${GITHUB_REPOSITORY}" --out "${RUNNER_TEMP}/sdk-watch"
            --max-implementations "${INPUT_MAX_IMPLEMENTATIONS}")
          if [ "${EVENT_NAME}" = schedule ]; then
            args+=(--history "${RUNNER_TEMP}/sdk-watch-history.json")
          fi
          if [ -n "${INPUT_DAY}" ]; then
            args+=(--day "${INPUT_DAY}")
          fi
          if [ -n "${INPUT_SDK}" ]; then
            args+=(--sdk "${INPUT_SDK}" --version "${INPUT_VERSION}")
          fi
          uv run --no-sync python -m sdk_watch watch "${args[@]}"
          cat "${RUNNER_TEMP}/sdk-watch/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          drafts="$(find "${RUNNER_TEMP}/sdk-watch" -mindepth 2 -name pr.json -printf '%h\n' | xargs -r -n1 basename | jq -Rnc '[inputs]')"
          echo "drafts=${drafts}" >> "${GITHUB_OUTPUT}"

      - name: Save this run's history for the next scheduled run
        if: always() && github.event_name == 'schedule'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sdk-watch-history.json
          key: sdk-watch-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the PR drafts
        if: steps.agent.outputs.drafts != '[]'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdk-watch-drafts
          path: ${{ runner.temp }}/sdk-watch
          if-no-files-found: error
          retention-days: 14

  verify:
    name: verify
    needs: [bridge, watch]
    if: needs.watch.outputs.drafts != '[]' && needs.watch.outputs.drafts != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
          save-cache: "false"

      - name: Download the Rust bridge
        uses: ./.github/actions/rust-bridge
        with:
          artifact: ${{ needs.bridge.outputs.artifact }}

      - name: Install LiteLLM with its unit test dependencies
        run: |
          .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev \
            --extra google --extra proxy --extra semantic-router --extra switchyard --extra saml \
            --extra extra_proxy --extra proxy-runtime --extra utils \
            --no-install-project --no-install-package litellm-proxy
          uv pip install --no-deps --python .venv/bin/python rust-bridge-dist/*.whl
          cp rust-bridge-dist/litellm/rust_bridge/_native.abi3.so litellm/rust_bridge/_native.abi3.so
          rm -rf rust-bridge-dist

      - name: Restore the Prisma binaries
        uses: ./.github/actions/cache-prisma-binaries
        with:
          save-cache: "false"

      - name: Generate the Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Install the agent and its recorder
        working-directory: litellm/scripts/sdk_watch
        run: uv sync --frozen --group demo

      - name: Install agg
        env:
          AGG_URL: https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu
          AGG_SHA256: f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/agg" "${AGG_URL}"
          echo "${AGG_SHA256}  ${RUNNER_TEMP}/agg" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/agg"

      - name: Download the PR drafts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: sdk-watch-drafts
          path: ${{ runner.temp }}/sdk-watch

      - name: Record each change's tests failing on main and passing with the fix
        working-directory: litellm/scripts/sdk_watch
        run: |
          mkdir -p "${RUNNER_TEMP}/sdk-watch-videos"
          for change in "${RUNNER_TEMP}"/sdk-watch/*/; do
            name="$(basename "${change}")"
            out="${RUNNER_TEMP}/sdk-watch-videos/${name}"
            mkdir -p "${out}"
            demo="$(printf '%q ' uv run --no-sync python -m sdk_watch demo --repo "${GITHUB_WORKSPACE}" \
              --change "${change}" --python "${GITHUB_WORKSPACE}/.venv/bin/python" --verdict "${out}/verdict.json")"
            if ! uv run --no-sync asciinema rec --quiet --overwrite --cols 110 --rows 36 -c "${demo}" "${out}/demo.cast" < /dev/null; then
              echo "::warning::Recording ${name} failed, so it gets no PR"
              continue
            fi
            if ! "${RUNNER_TEMP}/agg" --speed 1.5 "${out}/demo.cast" "${out}/demo.gif" 2> /dev/null; then
              echo "::warning::Rendering the video for ${name} failed, so it gets no PR"
            fi
          done

      - name: Upload the recordings
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdk-watch-videos
          path: ${{ runner.temp }}/sdk-watch-videos
          if-no-files-found: error
          retention-days: 14

  open-pr:
    name: open-pr
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
          save-cache: "false"

      - name: Install the agent
        working-directory: litellm/scripts/sdk_watch
        run: uv sync --frozen

      - name: Download the PR drafts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: sdk-watch-drafts
          path: ${{ runner.temp }}/sdk-watch

      - name: Download the recordings
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: sdk-watch-videos
          path: ${{ runner.temp }}/sdk-watch-videos

      - name: Open a PR for each verified change and ping the team
        working-directory: litellm/scripts/sdk_watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_WATCH_SLACK_WEBHOOK_URL: ${{ secrets.SDK_WATCH_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          for change in "${RUNNER_TEMP}"/sdk-watch/*/; do
            name="$(basename "${change}")"
            video="${RUNNER_TEMP}/sdk-watch-videos/${name}"
            if [ ! -f "${video}/verdict.json" ] || [ ! -f "${video}/demo.gif" ]; then
              echo "::warning::${name} has no recorded verdict or video, so it gets no PR"
              continue
            fi
            if ! uv run --no-sync python -m sdk_watch ship --repo "${GITHUB_WORKSPACE}" --repository "${GITHUB_REPOSITORY}" \
              --change "${change}" --verdict "${video}/verdict.json" --gif "${video}/demo.gif" \
              --base "${BASE_BRANCH}" --base-sha "${BASE_SHA}" | tee -a "${GITHUB_STEP_SUMMARY}"; then
              echo "::warning::Opening a PR for ${name} failed"
            fi
          done
