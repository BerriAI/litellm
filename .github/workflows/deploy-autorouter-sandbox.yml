name: Deploy autorouter sandbox

on:
  push:
    branches:
      - litellm_autorouter_sandbox_deploy
  workflow_dispatch:

concurrency:
  group: deploy-autorouter-sandbox
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/litellm-autorouter-sandbox

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/autorouter-sandbox/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - if: ${{ secrets.AUTOROUTER_SANDBOX_KUBECONFIG_B64 != '' }}
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - if: ${{ secrets.AUTOROUTER_SANDBOX_KUBECONFIG_B64 != '' }}
        env:
          KUBECONFIG_B64: ${{ secrets.AUTOROUTER_SANDBOX_KUBECONFIG_B64 }}
          NAMESPACE: ${{ vars.AUTOROUTER_SANDBOX_NAMESPACE || 'default' }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n "$NAMESPACE" apply -f deploy/autorouter-sandbox/k8s.yaml
          kubectl -n "$NAMESPACE" set image deployment/litellm-autorouter-sandbox litellm="$IMAGE:$GITHUB_SHA"
          kubectl -n "$NAMESPACE" rollout status deployment/litellm-autorouter-sandbox --timeout=5m
