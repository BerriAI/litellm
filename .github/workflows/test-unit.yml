              tests/unit/enterprise/enterprise_callbacks/send_emails
              tests/unit/enterprise/proxy/test_afile_retrieve_returns_unified_id.py
              tests/unit/enterprise/proxy/test_batch_retrieve_input_file_id.py
              tests/unit/enterprise/proxy/test_batch_retrieve_registers_missing_output_file_id.py
              tests/unit/enterprise/proxy/test_batch_retrieve_returns_unified_input_file_id.py
              tests/unit/enterprise/proxy/test_batch_update_db_managed_output_file_id.py
              tests/unit/enterprise/proxy/test_deleted_file_returns_403_not_404.py
              tests/unit/enterprise/proxy/test_enterprise_routes.py
              tests/unit/enterprise/proxy/test_file_deletion_blocking.py
              tests/unit/enterprise/proxy/test_managed_files_access_check.py
              tests/unit/enterprise/proxy/test_managed_files_hook.py
            python-version: "3.12"
            workers: 4
            reruns: 2
            timeout-minutes: 20
            job-timeout-minutes: 60
