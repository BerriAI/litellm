        if: steps.changes.outputs.decision != 'skip'
        run: |
          .github/scripts/uv_sync_with_retries.sh --frozen --group dev --group proxy-dev --extra proxy --no-install-workspace
          uv pip install "openai==${OPENAI_VERSION:?}" --exclude-newer-package openai=2026-10-07T00:00:00Z
          uv run --no-sync python -c 'import os, openai; assert openai.__version__ == os.environ["OPENAI_VERSION"], openai.__version__'

      - name: Run OpenAI SDK compatibility tests
        if: steps.changes.outputs.decision != 'skip'
        run: |
          uv run --no-sync pytest \
            tests/unit/llms/openai/test_openai.py \
            tests/unit/llms/openai/test_openai_common_utils.py \
            tests/unit/llms/openai/test_openai_file_content_streaming.py \
            tests/unit/test_openai_embedding_encoding_format_default.py \
            tests/unit/llms/inception/test_inception_completion_transformation.py::test_inception_fim_targets_fim_endpoint \
            tests/unit/llms/inception/test_inception_completion_transformation.py::test_inception_fim_async \
            tests/unit/llms/azure/test_azure_exception_mapping.py \
            tests/unit/test_completion_timeout_resolution.py \
            tests/unit/types/test_router.py \
            tests/unit/test_exception_header_preservation.py \
            tests/unit/integrations/otel/test_otel_v2_sources_of_truth.py::test_speech_binary_response_still_streaming_reports_the_bytes_downloaded_so_far \
            --tb=short -q

      - name: Run workload identity tests with SDK 3
        if: steps.changes.outputs.decision != 'skip' && startsWith(matrix.openai-version, '3.')
        run: uv run --no-sync pytest tests/unit/llms/openai/test_openai_workload_identity.py --tb=short -q

      - name: Check consumer types with the installed SDK
        if: steps.changes.outputs.decision != 'skip'
        run: uv run --no-sync basedpyright --pythonpath .venv/bin/python --project tests/typing/pyrightconfig.json
  coverage:
    name: coverage
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: coverage-*-${{ github.run_id }}-*
          path: coverage-reports
          merge-multiple: false

      - name: Upload to Codecov
        id: codecov-upload
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          directory: coverage-reports
          root_dir: ${{ github.workspace }}
          flags: unit
          fail_ci_if_error: false

      - name: Upload to Codecov (retry)
        if: steps.codecov-upload.outcome == 'failure'
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          directory: coverage-reports
          root_dir: ${{ github.workspace }}
          flags: unit
          fail_ci_if_error: false
  unit-passed:
    name: unit passed
    permissions: {}
    needs: [rust-bridge, assert-shard-coverage, unit, ui-unit, docs, helm, openai-sdk-compat]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every unit job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
