    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        timeout-minutes: 3
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        timeout-minutes: 2
        uses: ./.github/actions/detect-changes

      - name: Set up Python
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache uv dependencies
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 5
        uses: ./.github/actions/cache-uv-downloads

      - name: Set up the Rust build
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 5
        uses: ./.github/actions/rust-bridge
        with:
          artifact: ${{ needs.rust-bridge.outputs.artifact }}

      - name: Install dependencies
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 8
        env:
          RUST_BRIDGE_ARTIFACT: ${{ needs.rust-bridge.outputs.artifact }}
        run: |
          diff -u model_prices_and_context_window.json litellm/model_prices_and_context_window_backup.json
          if [ -z "$RUST_BRIDGE_ARTIFACT" ]; then
            .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router --extra saml --extra caching --extra extra_proxy --extra proxy-runtime --extra utils
          else
            .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router --extra saml --extra caching --extra extra_proxy --extra proxy-runtime --extra utils --no-install-project
            uv pip install --no-deps --python .venv/bin/python rust-bridge-dist/*.whl
            cp rust-bridge-dist/litellm/rust_bridge/_native.abi3.so litellm/rust_bridge/_native.abi3.so
            uv run --no-sync python -c "import importlib.metadata; import litellm.rust_bridge._native; print(importlib.metadata.version('litellm'))"
          fi
          uv run --no-sync python -c 'import os, sys; print(sys.version); assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["UV_PYTHON"]'

      - name: Cache Prisma binaries
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 3
        uses: ./.github/actions/cache-prisma-binaries

      - name: Generate Prisma client
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 3
        run: |
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Run tests
        id: tests
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: ${{ matrix.timeout-minutes }}
        env:
          TEST_PATH: ${{ matrix.test-path }}
          MAX_FAILURES: "10"
          WORKERS: ${{ matrix.workers }}
          RERUNS: ${{ matrix.reruns }}
          TEST_TIMEOUT_SECONDS: "120"
          DIST: ${{ matrix.dist }}
          COVERAGE_CORE: sysmon
        run: |
          echo "has-coverage=false" >> "$GITHUB_OUTPUT"
          selection="${TEST_PATH}"
          if [ -z "${selection// /}" ]; then
            echo "shard selection is empty; nothing to run"
            exit 0
          fi
          pytest_args=()
          existing_paths=0
          for token in ${selection}; do
            case "${token}" in
              -*) pytest_args+=("${token}") ;;
              *)
                if [ -e "${token%%::*}" ]; then
                  pytest_args+=("${token}")
                  existing_paths=$((existing_paths + 1))
                else
                  echo "::warning::${token} does not exist; drop it from this shard's test-path"
                fi
                ;;
            esac
          done
          if [ "${existing_paths}" -eq 0 ]; then
            echo "No path in the selection exists (${selection}); nothing to run"
            exit 0
          fi
          xdist_args=()
          if [ "${WORKERS}" != "0" ]; then
            xdist_args=(-n "${WORKERS}" --dist="${DIST}")
          fi
          set +e
          uv run --no-sync pytest "${pytest_args[@]}" \
            --tb=short -vv \
            --maxfail="${MAX_FAILURES}" \
            "${xdist_args[@]}" \
            --reruns "${RERUNS}" \
            --reruns-delay 1 \
            --timeout="${TEST_TIMEOUT_SECONDS}" \
            --rerun-except "from pytest-timeout" \
            --durations=20 \
            --cov=./litellm --cov=./enterprise/litellm_enterprise \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml
          status=$?
          set -e
          if [ -f coverage.xml ]; then
            echo "has-coverage=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$status" -eq 5 ]; then
            echo "pytest collected no tests from ${selection}; passing"
            exit 0
          fi
          exit "$status"

      - name: Save coverage report
        if: always() && steps.changes.outputs.decision != 'skip'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          retention-days: 1
  ui-unit:
    name: ui-unit
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/litellm-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          category: ui

      - name: Setup Node.js
        if: steps.changes.outputs.decision != 'skip'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.decision != 'skip'
        run: npm ci

      - name: Check UI production source types
        if: steps.changes.outputs.decision != 'skip'
        run: npm run typecheck

      - name: Run UI type tests (Vitest)
        if: steps.changes.outputs.decision != 'skip'
        env:
          CI: "true"
        run: npm run test:types

      - name: Run UI unit tests (Vitest)
        if: steps.changes.outputs.decision != 'skip'
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full_suite() { npm run test -- --run --pool forks --maxWorkers=14; }

          if [ -z "$BASE_SHA" ]; then
            echo "Push to $GITHUB_REF_NAME: running the full suite"
            full_suite
            exit 0
          fi

          merge_base=$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}?per_page=1" --jq '.merge_base_commit.sha')
          test -n "$merge_base"
          git fetch --no-tags --depth=1 origin "$merge_base" "$HEAD_SHA"
          changed_files=()
          while IFS= read -r f; do
            changed_files+=("$f")
          done < <(git diff --name-only --relative "$merge_base" "$HEAD_SHA" -- .)
          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "No UI files changed in this PR; skipping unit tests."
            exit 0
          fi

          scope=$(printf '%s\n' "${changed_files[@]}" | bash "$GITHUB_WORKSPACE/.github/scripts/select_ui_test_scope.sh")
          if [ "$scope" != related ]; then
            echo "Pull request: ${#changed_files[@]} changed UI files reach outside src/, so related would miss their dependents; running the full suite"
            full_suite
            exit 0
          fi

          echo "Pull request: running tests related to ${#changed_files[@]} changed UI files"
          npm run test -- related "${changed_files[@]}" --run --passWithNoTests \
            --pool forks --maxWorkers=14
  docs:
