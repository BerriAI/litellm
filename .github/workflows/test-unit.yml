name: unit

on:
  pull_request:
    branches:
      - main
      - "litellm_**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-bridge:
    name: rust-bridge
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact: ${{ steps.rust-bridge-artifact.outputs.name }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        timeout-minutes: 2
        uses: ./.github/actions/detect-changes

      - name: Define editable Rust bridge cache key
        id: rust-bridge-key
        if: steps.changes.outputs.decision != 'skip'
        env:
          RUST_BRIDGE_CACHE_KEY: ${{ runner.os }}-rust-bridge-editable-${{ hashFiles('litellm-rust/Cargo.lock', 'litellm-rust/Cargo.toml', 'litellm-rust/crates/**', 'pyproject.toml') }}
        run: echo "key=$RUST_BRIDGE_CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Restore editable Rust bridge
        id: rust-bridge-cache
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 5
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust-bridge-dist
          key: ${{ steps.rust-bridge-key.outputs.key }}

      - name: Cache the Rust build
        if: steps.changes.outputs.decision != 'skip' && steps.rust-bridge-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: ./.github/actions/cache-cargo-build

      - name: Build editable Rust bridge
        if: steps.changes.outputs.decision != 'skip' && steps.rust-bridge-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          mkdir -p rust-bridge-dist
          uv run --no-project --with maturin==1.15.0 python -c 'import maturin; maturin.build_editable("rust-bridge-dist")'
          strip --strip-debug litellm/rust_bridge/_native.abi3.so
          mkdir -p rust-bridge-dist/litellm/rust_bridge
          cp litellm/rust_bridge/_native.abi3.so rust-bridge-dist/litellm/rust_bridge/_native.abi3.so

      - name: Upload Rust bridge artifact
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 10
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: rust-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust-bridge-dist/
          retention-days: 1

      - name: Save editable Rust bridge
        if: steps.changes.outputs.decision != 'skip' && github.ref == 'refs/heads/main' && steps.rust-bridge-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust-bridge-dist
          key: ${{ steps.rust-bridge-key.outputs.key }}

      - name: Expose the Rust bridge artifact
        id: rust-bridge-artifact
        if: steps.changes.outputs.decision != 'skip'
        timeout-minutes: 1
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "name=rust-bridge-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
  assert-shard-coverage:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Assert every test directory and file is claimed by a shard
        run: python3 .github/scripts/assert_ci_coverage.py --shards
  unit:
    name: ${{ matrix.shard }}
    needs: [rust-bridge, assert-shard-coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-utils
            test-path: |-
              tests/unit/batch_completion
              tests/unit/decisions
              tests/unit/litellm_core_utils
            python-version: "3.12"
            workers: 4
            reruns: 0
            timeout-minutes: 20
            job-timeout-minutes: 60
            dist: loadscope

          - shard: enterprise-routing
