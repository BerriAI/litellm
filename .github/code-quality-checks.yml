  - name: check_workflow_job_name_collisions
    run: uv run --no-sync python ./tests/code_coverage_tests/check_workflow_job_name_collisions.py

  - name: test_workflow_job_name_collisions
    run: uv run --no-sync pytest -q --noconftest -p no:cacheprovider -c /dev/null tests/code_coverage_tests/test_workflow_job_name_collisions.py

  - name: test_unit_passed_gate
    run: uv run --no-sync pytest -q --noconftest -p no:cacheprovider -c /dev/null tests/code_coverage_tests/test_unit_passed_gate.py

  - name: test_e2e_changed_gate
    run: uv run --no-sync pytest -q --noconftest -p no:cacheprovider -c /dev/null tests/code_coverage_tests/test_e2e_changed_gate.py tests/code_coverage_tests/test_e2e_idp_stack.py

  - name: test_e2e_metadata
    env:
      PYTHONPATH: tests/e2e
    run: |
      export LITELLM_MASTER_KEY="sk-$(openssl rand -hex 16)"
      uv run --no-sync pytest -q --noconftest -p no:cacheprovider -c /dev/null tests/code_coverage_tests/test_e2e_metadata.py tests/code_coverage_tests/test_e2e_junit_report.py

  - name: test_merge_smoke
    run: uv run --no-sync pytest -q --noconftest -p no:cacheprovider -c /dev/null tests/code_coverage_tests/test_merge_smoke.py
    ci_only: the harness finds listening ports in /proc/net/tcp, which only Linux has

