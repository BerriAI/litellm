version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/litellm-rust"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      cargo:
        patterns:
          - "*"
