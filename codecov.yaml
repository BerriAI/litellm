codecov:
  require_ci_to_pass: false # post coverage status even if CI has unrelated failures
  notify:
    wait_for_ci: false # post as soon as expected uploads arrive, don't wait on CI

ignore:
  - "litellm-rust/**"

# Uploads are flagged per workflow tier (GHA) or "circleci". carryforward makes
# a re-upload of a flag replace its prior session instead of accumulating a
# conflicting one, and lets a commit reuse a flag from its parent when that flag
# was not re-uploaded. Required because the same commit can receive the
# push-triggered workflows more than once (re-runs / branches cut at the same
# SHA); flagless overlapping sessions made Codecov drop the largest files.
flag_management:
  default_rules:
    carryforward: true
  # Dead flags no CI job uploads anymore: their carried-forward sessions were
  # measured against old revisions, and the stale line maps mark comment lines
  # of since-edited files as missed, sinking patch coverage on unrelated PRs.
  individual_flags:
    - name: proxy-mgmt-behavior
      carryforward: false
    - name: security
      carryforward: false
    - name: proxy-db-schema-migration
      carryforward: false
    - name: circleci
      carryforward: false
    - name: core-utils
      carryforward: false
    - name: enterprise-routing
      carryforward: false
    - name: integrations
      carryforward: false
    - name: llm-vertex-ai
      carryforward: false
    - name: llm-other-providers
      carryforward: false
    - name: llm-openai-meta
      carryforward: false
    - name: misc
      carryforward: false
    - name: misc-dirs
      carryforward: false
    - name: proxy-auth
      carryforward: false
    - name: proxy-hooks-client
      carryforward: false
    - name: proxy-endpoints
      carryforward: false
    - name: proxy-feature-endpoints
      carryforward: false
    - name: proxy-server
      carryforward: false
    - name: mcp-elicitation
      carryforward: false
    - name: proxy-infra
      carryforward: false
    - name: proxy-infra-root
      carryforward: false
    - name: caching-local
      carryforward: false
    - name: proxy-extras
      carryforward: false
    - name: enterprise-package
      carryforward: false
    - name: enterprise-managed-files
      carryforward: false
    - name: responses-caching-types
      carryforward: false
    - name: lens-python-310
      carryforward: false
    - name: proxy-db-key-generation
      carryforward: false
    - name: proxy-db-auth-checks
      carryforward: false
    - name: proxy-db-jwt-and-keys
      carryforward: false
    - name: proxy-db-proxy-utils
      carryforward: false
    - name: proxy-db-proxy-server-core
      carryforward: false
    - name: proxy-db-proxy-runtime
      carryforward: false
    - name: proxy-db-mcp-oauth
      carryforward: false
    - name: proxy-db-custom-logging
      carryforward: false
    - name: proxy-db-logging-misc
      carryforward: false
    - name: proxy-db-db-and-spend
      carryforward: false
    - name: proxy-db-guardrails-hooks
      carryforward: false
    - name: proxy-db-budgets
      carryforward: false
    - name: proxy-db-endpoints-and-responses
      carryforward: false

component_management:
  individual_components:
    - component_id: "Router"
      paths:
        - "router"
    - component_id: "LLMs"
      paths:
        - "*/llms/*"
    - component_id: "Caching"
      paths:
        - "*/caching/*"
        - ".*redis.*"
    - component_id: "litellm_logging"
      paths:
        - "*/integrations/*"
        - ".*litellm_logging.*"
    - component_id: "Proxy_Authentication"
      paths:
        - "*/proxy/auth/**"
    - component_id: "Enterprise"
      paths:
        - "enterprise/**"
    - component_id: "Batches"
      paths:
        - "*/proxy/batches_endpoints/**"
        - "litellm/batches/**"
        - "*/llms/*/batches/**"
    - component_id: "Videos"
      paths:
        - "litellm/videos/**"
        - "*/proxy/video_endpoints/**"
        - "*/llms/*/videos/**"
    - component_id: "Realtime"
      paths:
        - "litellm/realtime_api/**"
        - "*/proxy/realtime_endpoints/**"
        - "*/llms/*/realtime/**"
        - "litellm/litellm_core_utils/realtime_streaming.py"
comment:
  layout: "header, diff, flags, components"  # show component info in the PR comment

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0% # do not allow project coverage to drop
    patch:
      default:
        target: auto
        threshold: 0% # patch coverage should be 100%
