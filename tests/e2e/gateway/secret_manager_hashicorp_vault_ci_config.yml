# Proxy for the secret_manager suite's hashicorp_vault lane
# (tests/e2e/secret_manager/, opt-in E2E_SECRET_MANAGER=hashicorp_vault).
# key_management_system is global, so each secret manager lane runs its own proxy
# rather than the shared stack; every lane's config differs only in that value
# (checked by secret_manager/test_secret_backends.py). The Vault address and token
# come from HCP_VAULT_ADDR / HCP_VAULT_TOKEN (secret_manager/backend.sh writes them). Keep OPENAI_API_KEY out of this
# proxy's environment: the tests hand it to the proxy only through the manager.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  key_management_system: hashicorp_vault
  key_management_settings:
    access_mode: read_and_write
    store_virtual_keys: true
    # Mirrored by VIRTUAL_KEY_PREFIX in the test module.
    prefix_for_stored_virtual_keys: litellm-e2e/virtual-keys/
