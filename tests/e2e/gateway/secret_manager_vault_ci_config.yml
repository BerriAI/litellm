# Proxy for the secret_manager suite's HashiCorp Vault lane
# (tests/e2e/secret_manager/test_hashicorp_vault_e2e.py, opt-in E2E_SECRET_MANAGER_VAULT).
# key_management_system is global, so this runs as its own proxy rather than on the
# shared stack. The Vault address and token come from HCP_VAULT_ADDR / HCP_VAULT_TOKEN.
# Keep OPENAI_API_KEY out of this proxy's environment: the tests hand it to the proxy
# only through Vault.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  key_management_system: hashicorp_vault
  key_management_settings:
    access_mode: read_and_write
    store_virtual_keys: true
    # Mirrored by VIRTUAL_KEY_PREFIX in the test module.
    prefix_for_stored_virtual_keys: litellm-e2e/virtual-keys/
