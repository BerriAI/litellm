general_settings:
  proxy_batch_write_at: 5
  enable_jwt_auth: true
  litellm_jwtauth:
    user_id_jwt_field: sub
    user_email_jwt_field: email
    team_ids_jwt_field: groups
    user_id_upsert: true
  proxy_config_reload_interval_seconds: 7
  store_prompts_in_spend_logs: true
  database_connection_pool_limit: 10
  forward_client_headers_to_llm_api: false
  cancel_on_disconnect: true
  maximum_spend_logs_retention_period: "60d"
  maximum_spend_logs_cleanup_cron: "0 1 * * *"
  proxy_budget_rescheduler_min_time: 15
  proxy_budget_rescheduler_max_time: 20

litellm_settings:
  drop_params: true
  default_redis_ttl: 20
  request_timeout: 600
  num_retries: 3
  json_logs: true
  store_audit_logs: true
  cache: true
  cache_params:
    type: redis
    host: 127.0.0.1
    port: 6379
    redis_startup_nodes:
      - host: 127.0.0.1
        port: 6379
    ssl: true
  callbacks: ["arize_phoenix", "datadog", "smtp_email", "prometheus", "otel", "websearch_interception"]
  websearch_interception_params:
    enabled_providers: ["bedrock"]
    search_tool_name: e2e-search
  require_auth_for_metrics_endpoint: false

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  allowed_fails: 5
  cooldown_time: 30
  model_group_alias:
    e2e-alias-rl-alias: e2e-alias-rl-target

model_list:
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini-2.5-flash-vertex
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: us-central1
      vertex_credentials: os.environ/VERTEXAI_CREDENTIALS
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: e2e-alias-rl-target
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      default_api_key_rpm_limit: 3
  - model_name: openai-text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

search_tools:
  - search_tool_name: e2e-search
    litellm_params:
      search_provider: perplexity
      api_key: os.environ/PERPLEXITY_API_KEY

files_settings:
  - custom_llm_provider: openai
    api_key: os.environ/OPENAI_API_KEY
  - custom_llm_provider: azure
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: 2025-04-01-preview
  - custom_llm_provider: vertex_ai
    vertex_project: os.environ/VERTEXAI_PROJECT
    vertex_location: us-central1
    vertex_credentials: os.environ/VERTEXAI_CREDENTIALS
    bucket_name: os.environ/GCS_BUCKET_NAME

finetune_settings:
  - custom_llm_provider: openai
    api_key: os.environ/OPENAI_API_KEY

mcp_servers:
  devin:
    url: "https://mcp.devin.ai/mcp"
    auth_type: api_key
    auth_value: os.environ/DEVIN_API_KEY
