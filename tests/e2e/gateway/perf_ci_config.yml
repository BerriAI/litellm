# Gateway config for the perf cases (tests/e2e/perf/test_perf_cases.py): one small gateway with
# everything a customer runs turned on. Model groups, keys, teams and guardrails are created by
# the case at run time, so the model list here is empty and store_model_in_db is on.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  proxy_config_reload_interval_seconds: 7
  enable_jwt_auth: true
  litellm_jwtauth:
    user_id_jwt_field: sub
    user_email_jwt_field: email
    team_ids_jwt_field: groups
    user_id_upsert: true
  proxy_batch_write_at: 5
  database_connection_pool_limit: 10

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    supported_call_types: []
  callbacks:
    - prometheus
    - otel
  require_auth_for_metrics_endpoint: false
  drop_params: true
  request_timeout: 120

router_settings:
  num_retries: 2
  retry_after: 0
  allowed_fails: 3
  cooldown_time: 5
  routing_strategy: simple-shuffle

model_list: []
