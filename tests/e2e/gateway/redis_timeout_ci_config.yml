general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  cache: true
  cache_params:
    type: redis
    host: 127.0.0.1
    port: 6379
    socket_timeout: 0.001

router_settings:
  num_retries: 1
  fallbacks:
    - redis-timeout-primary:
        - redis-timeout-backup
