general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: 127.0.0.1
    port: 6379
    socket_timeout: 0.001

router_settings:
  num_retries: 1
  fallbacks:
    - redis-timeout-primary:
        - redis-timeout-backup

model_list:
  - model_name: redis-timeout-primary
    litellm_params:
      model: openai/gpt-5-mini
      api_key: sk-redis-timeout-primary-not-used
      api_base: http://127.0.0.1:1
  - model_name: redis-timeout-backup
    litellm_params:
      model: openai/gpt-5-mini
      api_key: sk-redis-timeout-backup-not-used
      mock_response: "ok"
