general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    supported_call_types: []
  callbacks:
    - prometheus
    - otel
  require_auth_for_metrics_endpoint: false
  drop_params: true
  request_timeout: 600
